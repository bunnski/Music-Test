      body: JSON.stringify({ id, key }),
    });
    if (playingId === id && playingKey === key) {
      setPlayingId(null);
      setPlayingKey(null);
      if (audioRef.current) audioRef.current.pause();
    }
    loadLibrary();
  }

  async function handleDelete(target) {
    const label =
      target.type === "folder"
        ? `folder "${library.folders[target.id] ? library.folders[target.id].name : ""}" and everything inside it`
        : `"${library.soundtracks[target.id] ? library.soundtracks[target.id].name : ""}"`;
    if (!confirm(`Delete ${label}? This cannot be undone.`)) return;

    await authedFetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(target),
    });
    loadLibrary();
  }

  function togglePin(id) {
    const pinned = library.order["_pinned"] || [];
    const newPinned = pinned.includes(id) ? pinned.filter((p) => p !== id) : [...pinned, id];
    updateOrder("_pinned", newPinned);
  }

  // ids (folders / soundtracks) excluded from the random "what plays next" pick; stored in the order map so no worker change is needed
  const excludedIds = library.order["_excludeRandom"] || [];

  function toggleExcluded(id) {
    const next = excludedIds.includes(id) ? excludedIds.filter((x) => x !== id) : [...excludedIds, id];
    updateOrder("_excludeRandom", next);
    setContextMenu(null);
  }

  function movePinned(id, dir) {
    const pinned = [...(library.order["_pinned"] || [])];
    const i = pinned.indexOf(id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= pinned.length) return;
    [pinned[i], pinned[j]] = [pinned[j], pinned[i]];
    updateOrder("_pinned", pinned);
    setContextMenu(null);
  }

  async function updateOrder(parentPath, newOrder) {
    setLibrary((prev) => ({ ...prev, order: { ...prev.order, [parentPath]: newOrder } }));
    await authedFetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parentPath, order: newOrder }),
    });
  }

  const allSoundtracks = Object.values(library.soundtracks);

  const pinnedIds = library.order["_pinned"] || [];
  const pinnedItems = pinnedIds
    .map((id) => {
      if (library.soundtracks[id]) return { type: "soundtrack", ...library.soundtracks[id] };
      if (library.folders[id]) return { type: "folder", ...library.folders[id] };
      return null;
    })
    .filter(Boolean);

  const searchResults = (() => {
    const q = searchQuery.trim().toLowerCase();
    if (!q) return null;

    const soundtrackMatches = allSoundtracks
      .filter((s) => s.name.toLowerCase().includes(q))
      .map((s) => ({ kind: "soundtrack", soundtrack: s }));

    const trackMatches = [];
    allSoundtracks.forEach((s) => {
      s.tracks.forEach((t) => {
        if (t.isRef) return;
        if (stripExt(t.name).toLowerCase().includes(q)) {
          trackMatches.push({ kind: "track", soundtrack: s, track: t });
        }
      });
    });

    return [...soundtrackMatches, ...trackMatches];
  })();

  // ---- drag and drop ----
  // dragRef stores { parentPath, index, meta: { type, id } } of the item currently being dragged.
  // parentPath is "" for top level, or a folder id for anything nested inside a folder.
  const dragRef = useRef(null);

  function handleDragStart(parentPath, index, meta) {
    dragRef.current = { parentPath, index, meta };
  }

  function handleDragOver(e) {
    e.preventDefault();
  }

  // dropping between/onto items in the SAME list -> pure reorder
  function handleDropReorder(parentPath, displayedItems, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag || drag.parentPath !== parentPath || drag.index === dropIndex) return;
    const newItems = [...displayedItems];
    const [moved] = newItems.splice(drag.index, 1);
    newItems.splice(dropIndex, 0, moved);
    updateOrder(parentPath, newItems.map((it) => it.id));
  }

  // dropping directly onto a folder row -> move soundtracks into that folder;
  // dropping a folder onto a folder either reorders (same list) or nests it inside (different list)
  function handleDropOnFolder(targetFolderId, parentPath, displayedItems, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag) return;

    if (drag.meta.type === "soundtrack") {
      moveItem("soundtrack", drag.meta.id, targetFolderId);
      return;
    }

    if (drag.meta.type === "folder") {
      if (drag.meta.id === targetFolderId) return;
      if (drag.parentPath === parentPath && drag.index !== dropIndex) {
        const newItems = [...displayedItems];
        const [moved] = newItems.splice(drag.index, 1);
        newItems.splice(dropIndex, 0, moved);
        updateOrder(parentPath, newItems.map((it) => it.id));
      } else {
        moveItem("folder", drag.meta.id, targetFolderId);
      }
    }
  }

  function toggleFolder(id) {
    setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
  }

  // recursively renders everything inside the given parentId ("" / null = top level)
  function renderItems(parentId, indentLevel) {
    const key = parentId || "";
    const childFolders = Object.values(library.folders).filter((f) => (f.parentId || null) === (parentId || null));
    const childSoundtracks = allSoundtracks.filter((s) => (s.parentId || null) === (parentId || null));

    const items = applyOrder(
      [
        ...childFolders.map((f) => ({ type: "folder", id: f.id, name: f.name })),
        ...childSoundtracks.map((s) => ({ type: "soundtrack", id: s.id, name: s.name, cover: s.cover })),
      ],
      library.order[key] || [],
      (item) => item.id
    );

    return items.map((item, i) => {
      const meta = { type: item.type, id: item.id };
      const style = { paddingLeft: 8 + indentLevel * 16 };

      if (item.type === "folder") {
        const isOpen = !!expanded[item.id];
        return (
          <React.Fragment key={item.id}>
            <div
              className="folder-item"
              style={style}
              draggable
              onDragStart={() => handleDragStart(key, i, meta)}
              onDragOver={handleDragOver}
              onDrop={() => handleDropOnFolder(item.id, key, items, i)}
              onClick={() => toggleFolder(item.id)}
              onContextMenu={(e) => openContextMenu(e, { type: "folder", id: item.id })}
            >
              <span className="drag-handle">⠿</span>
              <span className="category-arrow">{isOpen ? "▼" : "▶"}</span>
              <div className="category-icon">📁</div>
              <span className="folder-name">{item.name}</span>
              {excludedIds.includes(item.id) && <span className="folder-flag">no random</span>}
              <RowMenuBtn />
            </div>
            {isOpen && renderItems(item.id, indentLevel + 1)}
          </React.Fragment>
        );
      }

      // soundtrack
      return (
        <div
          key={item.id}
          className={"folder-item" + (item.id === viewingId ? " active" : "")}
          style={style}
          draggable
          onDragStart={() => handleDragStart(key, i, meta)}
          onDragOver={handleDragOver}
          onDrop={() => handleDropReorder(key, items, i)}
          onClick={() => openSoundtrack(item.id)}
          onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: item.id })}
        >
          <span className="drag-handle">⠿</span>
          <img loading="lazy" decoding="async" className="folder-thumb" src={item.cover ? streamUrl(item.cover) : ""} />
          <span className="folder-name">{item.name}</span>
          {excludedIds.includes(item.id) && !item.feedUrl && <span className="folder-flag">no random</span>}
          {item.id === playingId && <div className="folder-playing-dot"></div>}
          <RowMenuBtn />
        </div>
      );
    });
  }

  // flattened folder list for the "create soundtrack in..." dropdown, indented by depth
  function flattenFolders(parentId, depth) {
    return Object.values(library.folders)
      .filter((f) => (f.parentId || null) === (parentId || null))
      .flatMap((f) => [{ ...f, depth }, ...flattenFolders(f.id, depth + 1)]);
  }
  const folderOptions = flattenFolders(null, 0);

  // ---- playback ----

  function playTrackAt(id, key) {
    const soundtrack = library.soundtracks[id];
    if (!soundtrack || !soundtrack.tracks.some((t) => t.key === key)) return;
    setPlayingId(id);
    setPlayingKey(key);
  }

  // when something finishes, pick a random soundtrack from the same parent folder (including inside its
  // subfolders), skipping anything excluded: excluded folders/soundtracks, and everything inside excluded folders.
  // random pick never lands on a B side track
  function pickableTracks(st) {
    return st.sides ? st.tracks.filter((t) => sideOf(t) === "A") : st.tracks;
  }

  function playRandomNext(parentId, skipSoundtrackId) {
    const pool = [];
    const same = (a) => (a || null) === (parentId || null);
    function walk(pid) {
      allSoundtracks.forEach((s) => {
        if ((s.parentId || null) === (pid || null) && s.id !== skipSoundtrackId && !excludedIds.includes(s.id) && !s.feedUrl && pickableTracks(s).length > 0) pool.push({ type: "soundtrack", item: s });
      });
      Object.values(library.folders).forEach((f) => {
        if ((f.parentId || null) === (pid || null) && !excludedIds.includes(f.id)) walk(f.id);
      });
    }
    walk(parentId);
    if (pool.length === 0) return;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    const st = pick.item;
    const list = pickableTracks(st);
    playTrackAt(st.id, list[Math.floor(Math.random() * list.length)].key);
  }

  useEffect(() => {
    const soundtrack = playingId && library.soundtracks[playingId];
    const track = soundtrack && soundtrack.tracks.find((t) => t.key === playingKey);
    if (track && audioRef.current) {
      let cancelled = false;
      getPlayableUrl(track.key).then((url) => {
        if (cancelled) return;
        if (lastBlobUrlRef.current) {
          URL.revokeObjectURL(lastBlobUrlRef.current);
          lastBlobUrlRef.current = null;
        }
        if (url.startsWith("blob:")) lastBlobUrlRef.current = url;
        audioRef.current.src = url;
        audioRef.current.play();
      });
      return () => { cancelled = true; };
    }
  }, [playingKey, playingId]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.loop = loopTrack;
  }, [loopTrack]);

  playingKeyRef.current = playingKey;

  const [muted, setMuted] = useState(false);
  useEffect(() => { if (audioRef.current) audioRef.current.muted = muted; }, [muted]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = Math.pow(volumePercent / 100, 2);
    localStorage.setItem("volumePercent", volumePercent);
  }, [volumePercent]);

  const [volumeInput, setVolumeInput] = useState(null);

  function commitVolumeInput() {
    if (volumeInput === null) return;
    const parsed = parseInt(volumeInput, 10);
    if (!isNaN(parsed)) setVolumePercent(Math.max(0, Math.min(100, parsed)));
    setVolumeInput(null);
  }

  function handleSeek(value) {
    if (audioRef.current) audioRef.current.currentTime = value;
    setCurrentTime(value);
  }

  function togglePlayPause() {
    if (!audioRef.current) return;
    if (audioRef.current.paused) audioRef.current.play();
    else audioRef.current.pause();
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function handlePrevious() {
    const soundtrack = playingId && library.soundtracks[playingId];
    if (!soundtrack) return;
    const currentIndex = soundtrack.tracks.findIndex((t) => t.key === playingKey);
    const prevTrack = soundtrack.tracks[currentIndex - 1];
    if (prevTrack && (!soundtrack.sides || sideOf(prevTrack) === sideOf(soundtrack.tracks[currentIndex]))) playTrackAt(playingId, prevTrack.key);
  }

  function handleEnded() {
    if (loopTrack) return;
    if (isExternal(playingKey)) {
      recordProg(playingKey, { pos: 0, done: true });
      flushProgress(false);
      if (getDlSettings().deleteAfterPlayed) removeEpisodeDownload(playingKey);
    }

    const soundtrack = playingId && library.soundtracks[playingId];
    if (!soundtrack) return;
    const currentIndex = soundtrack.tracks.findIndex((t) => t.key === playingKey);

    // with A/B sides on, shuffle and "next" stay on the current side; the end of a side moves on to a random pick
    const curSide = soundtrack.sides ? sideOf(soundtrack.tracks[currentIndex]) : null;
    const sidePool = curSide ? soundtrack.tracks.filter((t) => sideOf(t) === curSide) : soundtrack.tracks;
    if (shuffle && sidePool.length > 1) {
      let pick;
      do {
        pick = sidePool[Math.floor(Math.random() * sidePool.length)];
      } while (pick.key === playingKey);
      playTrackAt(playingId, pick.key);
      return;
    }

    const nextTrack = soundtrack.tracks[currentIndex + 1];
    if (nextTrack && (!curSide || sideOf(nextTrack) === curSide)) {
      playTrackAt(playingId, nextTrack.key);
      return;
    }

    if (soundtrack.feedUrl) return; // podcasts just stop at the last episode
    // reached the end of this soundtrack - continue with a random pick from the same folder
    playRandomNext(soundtrack.parentId, soundtrack.id);
  }

  // ---- lock screen / system media controls (Media Session) ----

  const mediaActionsRef = useRef({});
  mediaActionsRef.current = { prev: handlePrevious, next: handleEnded };

  // transport buttons on the lock screen, notification shade, headphones and car controls
  useEffect(() => {
    if (!("mediaSession" in navigator)) return;
    const set = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) { /* action not supported here */ } };
    set("play", () => { if (audioRef.current) audioRef.current.play(); });
    set("pause", () => { if (audioRef.current) audioRef.current.pause(); });
    set("previoustrack", () => { if (mediaActionsRef.current.prev) mediaActionsRef.current.prev(); });
    set("nexttrack", () => { if (mediaActionsRef.current.next) mediaActionsRef.current.next(); });
    set("seekbackward", (d) => { const el = audioRef.current; if (el) el.currentTime = Math.max(0, el.currentTime - ((d && d.seekOffset) || 10)); });
    set("seekforward", (d) => { const el = audioRef.current; if (el) el.currentTime = el.currentTime + ((d && d.seekOffset) || 10); });
    set("seekto", (d) => { const el = audioRef.current; if (el && d && d.seekTime != null) { el.currentTime = d.seekTime; setCurrentTime(d.seekTime); } });
  }, []);

  // what the lock screen shows: track title, soundtrack as the album, cover art
  const playingSoundtrackObj = playingId ? library.soundtracks[playingId] : null;
  useEffect(() => {
    if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    const st = playingSoundtrackObj;
    const track = st && st.tracks.find((t) => t.key === playingKey);
    if (!track) { navigator.mediaSession.metadata = null; return; }
    const owner = track.isRef ? library.soundtracks[track.soundtrackId] : st;
    const coverKey = track.cover || (owner && owner.cover) || st.cover;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: stripExt(track.name),
        artist: st.artist || (owner && owner.artist) || "",
        album: st.name,
        artwork: coverKey ? [{ src: streamUrl(coverKey) }] : [],
      });
    } catch (e) { /* ignore */ }
  }, [playingId, playingKey, playingSoundtrackObj, token]);

  useEffect(() => {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
  }, [isPlaying]);

  // position and length for the lock screen scrubber
  useEffect(() => {
    const el = audioRef.current;
    if (!el || !("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
    function update() {
      if (!isFinite(el.duration) || el.duration <= 0) return;
      try {
        navigator.mediaSession.setPositionState({ duration: el.duration, position: Math.min(el.currentTime || 0, el.duration), playbackRate: el.playbackRate || 1 });
      } catch (e) { /* ignore */ }
    }
    update();
    el.addEventListener("seeked", update);
    return () => el.removeEventListener("seeked", update);
  }, [duration, isPlaying, playingKey]);

  // ---- resizable library panel (desktop; the phone drawer keeps its own width) ----

  const [sidebarWidth, setSidebarWidth] = useState(() => {
    let saved = NaN;
    try { saved = parseInt(localStorage.getItem("sidebarWidth") || "", 10); } catch (e) { /* ignore */ }
    return saved >= 180 && saved <= 700 ? saved : 260;
  });
  const [resizingSidebar, setResizingSidebar] = useState(false);

  function startSidebarResize(e) {
    e.preventDefault();
    setResizingSidebar(true);
    const startX = e.clientX;
    const startW = sidebarWidth;
    const maxW = Math.min(700, Math.round(window.innerWidth * 0.6));
    let latest = startW;
    function move(ev) {
      latest = Math.max(180, Math.min(maxW, startW + ev.clientX - startX));
      setSidebarWidth(latest);
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      setResizingSidebar(false);
      try { localStorage.setItem("sidebarWidth", String(latest)); } catch (err) { /* ignore */ }
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  function resetSidebarWidth() {
    setSidebarWidth(260);
    try { localStorage.removeItem("sidebarWidth"); } catch (e) { /* ignore */ }
  }

  // ---- track reordering ----

  async function reorderTracks(id, order, sides) {
    setLibrary((prev) => {
      const soundtrack = prev.soundtracks[id];
      if (!soundtrack) return prev;
      const byKey = {};
      soundtrack.tracks.forEach((t) => { byKey[t.key] = sides && sides[t.key] ? { ...t, side: sides[t.key] === "B" ? "B" : undefined } : t; });
      let newTracks = order.map((k) => byKey[k]).filter(Boolean);
      if (soundtrack.sides) newTracks = [...newTracks.filter((t) => sideOf(t) === "A"), ...newTracks.filter((t) => sideOf(t) === "B")];
      return { ...prev, soundtracks: { ...prev.soundtracks, [id]: { ...soundtrack, tracks: newTracks } } };
    });
    await authedFetch("/api/reorder-tracks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, order, sides }),
    });
  }

  function handleSetSide(id, key, side) {
    const st = library.soundtracks[id];
    if (!st) return;
    reorderTracks(id, st.tracks.map((t) => t.key), { [key]: side });
  }

  const trackDragRef = useRef(null);

  function handleTrackDragStart(i) {
    trackDragRef.current = i;
  }

  function handleTrackDrop(i, tracks) {
    const from = trackDragRef.current;
    trackDragRef.current = null;
    if (from === null || from === i) return;
    const newTracks = [...tracks];
    const [moved] = newTracks.splice(from, 1);
    newTracks.splice(i, 0, moved);
    // with A/B sides on, dropping a track onto a row of the other side moves it to that side
    const st = library.soundtracks[viewingId];
    const sides = st && st.sides && sideOf(tracks[i]) !== sideOf(moved) ? { [moved.key]: sideOf(tracks[i]) } : undefined;
    reorderTracks(viewingId, newTracks.map((t) => t.key), sides);
  }

  // ---- downloads for currently viewed soundtrack ----

  const viewingSoundtrackForEffect = viewingId ? library.soundtracks[viewingId] : null;

  useEffect(() => {
    let cancelled = false;
    if (viewingSoundtrackForEffect) {
      isDownloaded(viewingSoundtrackForEffect).then((result) => {
        if (!cancelled) setIsViewingDownloaded(result);
      });
    } else {
      setIsViewingDownloaded(false);
    }
    return () => { cancelled = true; };
  }, [viewingId, viewingSoundtrackForEffect, dlTick]);

  // ---- soundtrack downloads: one queue, one soundtrack at a time, each cancellable ----
  const [sdlActive, setSdlActive] = useState(null); // { id, name, index, count, file, loaded, total }
  const [sdlQueued, setSdlQueued] = useState([]); // soundtrack ids waiting
  const [dlTick, setDlTick] = useState(0);
  const sdlQueueRef = useRef([]);
  const sdlRunningRef = useRef(false);
  const sdlAbortRef = useRef(null);
  const sdlCurrentRef = useRef(null);

  function handleDownload() {
    if (!viewingSoundtrackForEffect) return;
    const id = viewingSoundtrackForEffect.id;
    if (sdlCurrentRef.current === id || sdlQueueRef.current.includes(id)) return;
    sdlQueueRef.current.push(id);
    setSdlQueued([...sdlQueueRef.current]);
    runSdlQueue();
  }

  async function runSdlQueue() {
    if (sdlRunningRef.current) return;
    sdlRunningRef.current = true;
    while (sdlQueueRef.current.length) {
      const id = sdlQueueRef.current.shift();
      setSdlQueued([...sdlQueueRef.current]);
      const st = library.soundtracks[id];
      if (!st) continue;
      const controller = new AbortController();
      sdlAbortRef.current = controller;
      sdlCurrentRef.current = id;
      setSdlActive({ id, name: st.name, index: 0, count: offlineKeys(st).length, file: "", loaded: 0, total: 0 });
      try {
        await downloadSoundtrack(st, (p) => setSdlActive({ id, name: st.name, index: p.index, count: p.count, file: fileLabel(p.name), loaded: p.loaded, total: p.total }), controller.signal);
      } catch (e) {
        if (e.name === "AbortError") await removeDownload(st); // cancelled: don't leave a half-downloaded soundtrack behind
        else alert("Download of \"" + st.name + "\" failed: " + e.message);
      }
      sdlCurrentRef.current = null;
      sdlAbortRef.current = null;
      setSdlActive(null);
      setDlTick((t) => t + 1);
    }
    sdlRunningRef.current = false;
  }

  // one soundtrack (queued or running), or everything when no id is given
  function cancelSoundtrackDownloads(id) {
    sdlQueueRef.current = id ? sdlQueueRef.current.filter((x) => x !== id) : [];
    setSdlQueued([...sdlQueueRef.current]);
    if (sdlAbortRef.current && (!id || sdlCurrentRef.current === id)) sdlAbortRef.current.abort();
  }

  async function handleRemoveDownload() {
    if (!viewingSoundtrackForEffect) return;
    await removeDownload(viewingSoundtrackForEffect);
    setIsViewingDownloaded(false);
  }

  // ---- context menu ----

  const [contextMenu, setContextMenu] = useState(null);
  const [addPickerFor, setAddPickerFor] = useState(null);

  useEffect(() => {
    function closeMenu() { setContextMenu(null); setAddPickerFor(null); }
    window.addEventListener("click", closeMenu);
    return () => window.removeEventListener("click", closeMenu);
  }, []);

  function openContextMenu(e, target) {
    e.preventDefault();
    e.stopPropagation();
    setContextMenu({ x: e.clientX, y: e.clientY, target });
  }

  if (error) {
    return <div style={{padding: 24, color: "#fff"}}>{error}</div>;
  }

  const viewingSoundtrack = viewingId ? library.soundtracks[viewingId] : null;
  const playingSoundtrack = playingId ? library.soundtracks[playingId] : null;
  const hasNowPlaying = playingSoundtrack && playingKey !== null;
  const playingTrack = playingSoundtrack ? playingSoundtrack.tracks.find((t) => t.key === playingKey) : null;

  return (
    <div className="app">
      <div className="mobile-topbar">
        <button className="mobile-menu-btn" onClick={() => setSidebarOpen(true)}>Library</button>
        <div className="mobile-topbar-title">
          {viewingSoundtrack ? viewingSoundtrack.name : "My Music"}
        </div>
      </div>
      <div className={"drawer-backdrop" + (sidebarOpen ? " open" : "")} onClick={() => setSidebarOpen(false)}></div>
      <div className={"app-body" + (resizingSidebar ? " resizing" : "")} style={{ "--sidebar-w": sidebarWidth + "px" }}>

        <div
          className={"sidebar" + (sidebarOpen ? " open" : "")}
          onContextMenu={(e) => openContextMenu(e, { type: "empty" })}
          onDragOver={handleDragOver}
          onDrop={() => {
            // only fires if no nested item's own onDrop already handled and cleared the drag (see handleDrop*),
            // so this only triggers for drops on truly empty sidebar space - moves the dragged item to the top level
            const drag = dragRef.current;
            dragRef.current = null;
            if (drag && drag.parentPath !== "_pinned") moveItem(drag.meta.type, drag.meta.id, null);
          }}
        >
          <div className="sidebar-header">
            <h1>Library</h1>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="add-btn" style={{ width: "auto", padding: "0 8px", fontSize: 12 }} onClick={() => openPodcastModal(null)}>Podcast</button>
              <button className="add-btn" onClick={() => setShowAddForm(!showAddForm)}>+</button>
            </div>

          </span>
        </div>

        <div className="bar-divider"></div>

        <button className={"loop-btn" + (shuffle ? " active" : "")} onClick={() => setShuffle(!shuffle)}>
          Shuffle {shuffle ? "On" : "Off"}
        </button>
        <button className={"loop-btn" + (loopTrack ? " active" : "")} onClick={() => setLoopTrack(!loopTrack)}>
          Loop {loopTrack ? "On" : "Off"}
        </button>
      </div>

      {showPodcastModal && (
        <div className="modal-backdrop" onClick={() => setShowPodcastModal(false)}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>Add podcast</h3>
              <button className="modal-close" onClick={() => setShowPodcastModal(false)}>x</button>
            </div>
            <input
              type="text"
              className="search-input"
              style={{ marginBottom: 8 }}
              placeholder="Podcast name or RSS link"
              value={podcastInput}
              autoFocus
              onChange={(e) => setPodcastInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") searchPodcasts(); }}
            />
            <button className="add-tracks-btn" onClick={searchPodcasts} disabled={podcastBusy || !podcastInput.trim()}>
              {podcastBusy ? "Working..." : isExternal(podcastInput.trim()) ? "Add from link" : "Search"}
            </button>
            {podcastError && <div className="search-subtitle" style={{ marginTop: 10 }}>{podcastError}</div>}
            {podcastResults.length > 0 && (
              <div className="online-results" style={{ marginTop: 10 }}>
                {podcastResults.map((r, i) => (
                  <div key={i} className="online-result" onClick={() => !podcastBusy && addPodcast(r.feedUrl)}>
                    {r.artworkUrl100 && <img src={r.artworkUrl100} className="online-result-thumb" />}
                    <div style={{ minWidth: 0 }}>
                      <div className="online-result-name">{r.collectionName}</div>
                      <div className="online-result-sub">{r.artistName}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {showDlModal && viewingSoundtrack && viewingSoundtrack.feedUrl && (
        <div className="modal-backdrop" onClick={() => setShowDlModal(false)}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>Podcast downloads</h3>
              <button className="modal-close" onClick={() => setShowDlModal(false)}>x</button>
            </div>
            {(() => {
              const mine = dlIndex.filter((d) => (d.pid || episodeInfo(d.key).pid) === viewingId);
              const autoN = mine.filter((d) => d.auto).length;
              return (
                <div className="search-subtitle" style={{ marginBottom: 12 }}>
                  This podcast: {autoN} auto, {mine.length - autoN} saved by you ({fmtBytes(mine.reduce((a, d) => a + (d.size || 0), 0))}).
                  All podcasts: {fmtBytes(dlIndex.reduce((a, d) => a + (d.size || 0), 0))}.
                </div>
              );
            })()}
            <label style={{ display: "block", marginBottom: 12, fontSize: 14 }}>
              Auto-download for this podcast<br />
              <select
                style={{ marginTop: 6, background: "#222", color: "inherit", border: "1px solid #444", borderRadius: 6, padding: "6px 8px" }}
                value={getAutoCount(viewingId)}
                onChange={(e) => setAuto(viewingId, parseInt(e.target.value, 10))}
              >
                <option value={0}>Off</option>
                <option value={1}>Latest 1 episode</option>
                <option value={3}>Latest 3 episodes</option>
                <option value={5}>Latest 5 episodes</option>
                <option value={10}>Latest 10 episodes</option>
              </select>
            </label>
            <label style={{ display: "block", marginBottom: 12, fontSize: 14 }}>
              Auto-download limit<br />
              <select
                style={{ marginTop: 6, background: "#222", color: "inherit", border: "1px solid #444", borderRadius: 6, padding: "6px 8px" }}
                value={getCap(viewingId)}
                onChange={(e) => setCap(viewingId, parseInt(e.target.value, 10))}
              >
                {[3, 5, 10, 20, 30, 50].map((n) => <option key={n} value={n}>{n} episodes</option>)}
              </select>
              <div className="search-subtitle" style={{ marginTop: 4 }}>Episodes you save yourself do not count.</div>
            </label>
            <label style={{ display: "block", marginBottom: 12, fontSize: 14 }}>
              <input type="checkbox" checked={dlSettings.deleteAfterPlayed} onChange={(e) => setDeleteAfterPlayed(e.target.checked)} />
              {" "}Delete an episode after it has been played (all podcasts)
            </label>
            <div className="search-subtitle" style={{ marginBottom: 12 }}>
              Auto-downloaded episodes rotate: the newest releases are fetched, and when over the limit the oldest release is removed first.
              Episodes you save yourself are never removed automatically. The episode playing is never removed.
              Auto-download only runs while the app is open.
            </div>
            <button className="add-tracks-btn" onClick={() => removeDownloads(viewingId)}>Remove this podcast's downloads</button>
            {" "}
            <button className="add-tracks-btn" onClick={() => removeDownloads(null)} disabled={dlIndex.length === 0}>Remove all</button>
          </div>
        </div>
      )}

      {showEditModal && editTarget && (
        <div className="modal-backdrop" onClick={() => setShowEditModal(false)}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>Edit {editTarget.type}</h3>
              <button className="modal-close" onClick={() => setShowEditModal(false)}>✕</button>
            </div>

            <input
              type="text"
              className="search-input"
              style={{marginBottom: 8}}
              placeholder="Name"
              value={editForm.name}
              onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
            />

            {editTarget.type === "soundtrack" && (
              <React.Fragment>
                <input
                  type="text"
                  className="search-input"
                  style={{marginBottom: 8}}
                  placeholder="Artist"
                  value={editForm.artist}
                  onChange={(e) => setEditForm({ ...editForm, artist: e.target.value })}
                />
                <input
                  type="text"
                  className="search-input"
                  style={{marginBottom: 8}}
                  placeholder="Year"
                  value={editForm.year}
                  onChange={(e) => setEditForm({ ...editForm, year: e.target.value })}
                />
              </React.Fragment>
            )}

            <textarea
              className="search-input"
              style={{marginBottom: 10, minHeight: 70, resize: "vertical", fontFamily: "inherit"}}
              placeholder="Description"
              value={editForm.description}
              onChange={(e) => setEditForm({ ...editForm, description: e.target.value })}
            ></textarea>

            {!(library.soundtracks[editTarget.id] && library.soundtracks[editTarget.id].feedUrl) && (
              <label style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 14}}>
                <input type="checkbox" checked={!!editForm.sides} onChange={(e) => setEditForm({ ...editForm, sides: e.target.checked })} />
                <span>AB Side (B side is skipped by random pick and never follows the A side)</span>
              </label>
            )}

            {!(library.soundtracks[editTarget.id] && library.soundtracks[editTarget.id].feedUrl) && (
              <label style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 14}}>
                <input type="checkbox" checked={!!editForm.shrinkArt} onChange={(e) => setEditForm({ ...editForm, shrinkArt: e.target.checked })} />
                <span>Auto-shrink track art when added (smaller downloads)</span>
              </label>
            )}

            <div style={{marginBottom: 12}}>
              <label style={{fontSize: 12, color: "var(--text-dim)", display: "block", marginBottom: 4}}>Cover image</label>
              <input type="file" accept="image/*" onChange={(e) => setEditCoverFile(e.target.files[0])} />
            </div>

            <button
              onClick={handleSaveEdit}
              disabled={savingEdit}
              style={{width: "100%", background: "var(--accent)", border: "none", color: "#000", padding: 8, borderRadius: 6, fontWeight: 600, cursor: "pointer"}}
            >
              {savingEdit ? "Saving..." : "Save"}
            </button>
          </div>
        </div>
      )}

      {contextMenu && (
        <div className="context-menu" style={{top: contextMenu.y, left: contextMenu.x}} onClick={(e) => e.stopPropagation()}>
          {addPickerFor ? (
            <React.Fragment>
              <div className="context-item" onClick={() => { handleCreateSoundtrackAndAdd(addPickerFor.id, addPickerFor.key); setContextMenu(null); setAddPickerFor(null); }}>
                + New soundtrack...
              </div>
              {Object.values(library.soundtracks)
                .filter((st) => !st.feedUrl && st.id !== addPickerFor.ownerId && !st.tracks.some((t) => t.key === addPickerFor.key))
                .sort((a, b) => a.name.localeCompare(b.name))
                .map((st) => (
                  <div
                    key={st.id}
                    className="context-item"
                    onClick={() => { handleAddToSoundtrack(st.id, addPickerFor.id, addPickerFor.key); setContextMenu(null); setAddPickerFor(null); }}
                  >
                    {st.name}
                  </div>
                ))}
            </React.Fragment>
          ) : (
            <React.Fragment>
              {["folder", "soundtrack"].includes(contextMenu.target.type) && pinnedIds.includes(contextMenu.target.id) && (
                <React.Fragment>
                  <div className="context-item" onClick={() => movePinned(contextMenu.target.id, -1)}>Move up in pinned</div>
                  <div className="context-item" onClick={() => movePinned(contextMenu.target.id, 1)}>Move down in pinned</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "empty" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => handleCreateFolder(null)}>New folder</div>
                  <div className="context-item" onClick={() => handleCreateEmptySoundtrack(null)}>New empty soundtrack</div>
                  <div className="context-item" onClick={() => { setContextMenu(null); shrinkTrackArt(null); }}>Shrink all track art</div>
                  <div className="context-item" onClick={() => openPodcastModal(null)}>Add podcast...</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "folder" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => togglePin(contextMenu.target.id)}>
                    {pinnedIds.includes(contextMenu.target.id) ? "Unpin" : "Pin"}
                  </div>
                  <div className="context-item" onClick={() => toggleExcluded(contextMenu.target.id)}>
                    Random pick: {excludedIds.includes(contextMenu.target.id) ? "Excluded" : "Included"}
                  </div>
                  <div className="context-item" onClick={() => openPodcastModal(contextMenu.target.id)}>Add podcast...</div>
                  <div className="context-item" onClick={() => { setShowAddForm(true); setNewParentId(contextMenu.target.id); }}>
                    Add soundtrack here
                  </div>
                  <div className="context-item" onClick={() => handleCreateEmptySoundtrack(contextMenu.target.id)}>New empty soundtrack here</div>
                  <div className="context-item" onClick={() => handleCreateFolder(contextMenu.target.id)}>New subfolder here</div>
                  <div className="context-item" onClick={() => handleRenameFolder(contextMenu.target.id)}>Rename</div>
                  {library.folders[contextMenu.target.id] && library.folders[contextMenu.target.id].parentId && (
                    <div className="context-item" onClick={() => moveItem("folder", contextMenu.target.id, null)}>Move to top level</div>
                  )}
                  <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete folder</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "soundtrack" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => togglePin(contextMenu.target.id)}>
                    {pinnedIds.includes(contextMenu.target.id) ? "Unpin" : "Pin"}
                  </div>
                  {!(library.soundtracks[contextMenu.target.id] && library.soundtracks[contextMenu.target.id].feedUrl) && (
                    <div className="context-item" onClick={() => toggleExcluded(contextMenu.target.id)}>
                      Random pick: {excludedIds.includes(contextMenu.target.id) ? "Excluded" : "Included"}
                    </div>
                  )}
                  <div className="context-item" onClick={() => handleRenameSoundtrack(contextMenu.target.id)}>Rename</div>
                  {!(library.soundtracks[contextMenu.target.id] && library.soundtracks[contextMenu.target.id].feedUrl) && (
                    <div className="context-item" onClick={() => { const sid = contextMenu.target.id; setContextMenu(null); scanTrackArt(sid); }}>Find track art in files</div>
                  )}
                  {!(library.soundtracks[contextMenu.target.id] && library.soundtracks[contextMenu.target.id].feedUrl) && (
                    <div className="context-item" onClick={() => { const sid = contextMenu.target.id; setContextMenu(null); shrinkTrackArt([sid]); }}>Shrink track art</div>
                  )}
                  {library.soundtracks[contextMenu.target.id] && library.soundtracks[contextMenu.target.id].parentId && (
                    <div className="context-item" onClick={() => moveItem("soundtrack", contextMenu.target.id, null)}>Move to top level</div>
                  )}
                  <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "track" && (
                isExternal(contextMenu.target.key) ? (
                  <React.Fragment>
                    <div className="context-item" onClick={() => { const k = contextMenu.target.key; setContextMenu(null); if (isDl(k)) removeEpisodeDownload(k); else downloadEpisode(k, "", true, contextMenu.target.id || viewingId); }}>
                      {isDl(contextMenu.target.key) ? "Remove download" : "Download episode"}
                    </div>
                    {dlIndex.some((d) => d.key === contextMenu.target.key && d.auto) && (
                      <div className="context-item" onClick={() => { keepDownload(contextMenu.target.key); setContextMenu(null); }}>Keep this download</div>
                    )}
                    <div className="context-item" onClick={() => markPlayed(contextMenu.target.key)}>Mark as played</div>
                    <div className="context-item" onClick={() => resetProg(contextMenu.target.key)}>Reset progress</div>
                  </React.Fragment>
                ) : (() => {
                  const menuSt = library.soundtracks[contextMenu.target.id];
                  const menuTrack = menuSt && menuSt.tracks.find((t) => t.key === contextMenu.target.key);
                  const isRef = !!(menuTrack && menuTrack.isRef);
                  const ownerId = menuTrack && menuTrack.soundtrackId ? menuTrack.soundtrackId : contextMenu.target.id;
                  return (
                    <React.Fragment>
                      {menuSt && menuSt.sides && (
                        <div className="context-item" onClick={() => { handleSetSide(contextMenu.target.id, contextMenu.target.key, sideOf(menuTrack) === "B" ? "A" : "B"); setContextMenu(null); }}>
                          {sideOf(menuTrack) === "B" ? "Move to A Side" : "Move to B Side"}
                        </div>
                      )}
                      <div className="context-item" onClick={() => handleRenameTrack(contextMenu.target.id, contextMenu.target.key)}>Rename</div>
                      <div className="context-item" onClick={() => setAddPickerFor({ id: contextMenu.target.id, key: contextMenu.target.key, ownerId })}>
                        Add to soundtrack...
                      </div>
                      <div className="context-item" onClick={() => { const k = contextMenu.target.key; setContextMenu(null); findTrackArt(ownerId, k); }}>Find track image</div>
                      {menuTrack && menuTrack.cover && (
                        <div className="context-item" onClick={() => { const k = contextMenu.target.key; setContextMenu(null); handleClearTrackCover(ownerId, k); }}>Use soundtrack image</div>
                      )}
                      <div className="context-item danger" onClick={() => handleDeleteTrack(contextMenu.target.id, contextMenu.target.key)}>
                        {isRef ? "Remove from this soundtrack" : "Delete"}
                      </div>
                    </React.Fragment>
                  );
                })()
              )}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}
</script>

</body>
</html>
