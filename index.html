<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
  li { padding: 8px; cursor: pointer; border-bottom: 1px solid #ddd; }
  li:hover { background: #f0f0f0; }
  audio { width: 100%; margin-top: 20px; }
</style>
</head>
<body>

<h2 id="page-title">My Music</h2>
<button id="back-btn" style="display:none;">Back to soundtracks</button>
<img id="cover" style="display:none; width:100%; margin-top:12px; border-radius:8px;">
<ul id="list">Loading...</ul>
<audio id="player" controls></audio>

<script>
  // CHANGE THIS to your deployed worker URL
  const WORKER_URL = "https://my-music-worker.YOUR-SUBDOMAIN.workers.dev";

  let token = sessionStorage.getItem("auth_token");
  if (!token) {
    token = prompt("Enter password:");
    sessionStorage.setItem("auth_token", token);
  }

  const listEl = document.getElementById("list");
  const coverEl = document.getElementById("cover");
  const backBtn = document.getElementById("back-btn");
  const titleEl = document.getElementById("page-title");

  backBtn.onclick = () => loadSoundtracks();

  async function authedFetch(path) {
    const res = await fetch(WORKER_URL + path, {
      headers: { "X-Auth-Token": token },
    });
    if (!res.ok) {
      listEl.textContent = "Auth failed. Refresh and re-enter password.";
      sessionStorage.removeItem("auth_token");
      throw new Error("auth failed");
    }
    return res.json();
  }

  async function loadSoundtracks() {
    titleEl.textContent = "My Music";
    backBtn.style.display = "none";
    coverEl.style.display = "none";
    listEl.innerHTML = "Loading...";

    const folders = await authedFetch("/api/soundtracks");
    listEl.innerHTML = "";

    folders.forEach((folder) => {
      const li = document.createElement("li");
      li.textContent = folder;
      li.onclick = () => loadSoundtrack(folder);
      listEl.appendChild(li);
    });
  }

  async function loadSoundtrack(folder) {
    titleEl.textContent = folder;
    backBtn.style.display = "inline-block";
    listEl.innerHTML = "Loading...";

    const data = await authedFetch("/api/soundtracks/" + encodeURIComponent(folder));

    if (data.cover) {
      coverEl.src = `${WORKER_URL}/api/stream/${encodeURIComponent(data.cover)}?token=${encodeURIComponent(token)}`;
      coverEl.style.display = "block";
    } else {
      coverEl.style.display = "none";
    }

    listEl.innerHTML = "";
    data.tracks.forEach((track) => {
      const li = document.createElement("li");
      li.textContent = track.name;
      li.onclick = () => playTrack(track.key);
      listEl.appendChild(li);
    });
  }

  function playTrack(key) {
    const player = document.getElementById("player");
    const streamUrl = `${WORKER_URL}/api/stream/${encodeURIComponent(key)}?token=${encodeURIComponent(token)}`;
    player.src = streamUrl;
    player.play();
  }

  loadSoundtracks();
</script>

</body>
</html>
