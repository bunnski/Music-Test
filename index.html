<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#121212">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #121212;
    --sidebar-bg: #000000;
    --panel-bg: #181818;
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --accent: #3fb950;
    --hover: #2a2a2a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  #root { height: 100vh; }

  .app { display: flex; flex-direction: column; height: 100vh; }
  .app-body { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    padding: 16px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  .sidebar-header h1 {
    margin: 0;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .add-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 4px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }

  .add-btn:hover { color: var(--text); border-color: #666; }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
    margin-bottom: 12px;
    background: #181818;
    border-radius: 6px;
  }

  .add-form input[type="text"] {
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  .add-form input[type="file"] { color: var(--text-dim); font-size: 12px; }

  .add-form button {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .add-form button:disabled { opacity: 0.6; cursor: default; }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
    padding: 8px 8px 4px 8px;
  }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .folder-item:hover { background: var(--hover); }
  .folder-item.active { background: var(--hover); }
  .folder-item:active { cursor: grabbing; }
  .folder-item.nested { padding-left: 24px; }

  .category-arrow { color: var(--text-dim); font-size: 10px; width: 10px; flex-shrink: 0; }

  .category-icon {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: #2a2a2a;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .folder-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .folder-name {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .folder-playing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: auto;
    flex-shrink: 0;
  }

  .drag-handle { color: #555; font-size: 14px; cursor: grab; flex-shrink: 0; }

  .marquee-wrap { overflow: hidden; white-space: nowrap; position: relative; }

  .marquee-wrap.overflowing .marquee-inner {
    display: inline-block;
    animation: marquee 16s linear infinite;
    padding-right: 40px;
  }

  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .main { flex: 1; background: var(--panel-bg); overflow-y: auto; padding: 24px 32px; }

  .main-empty {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 60px;
    text-align: center;
  }

  .main-header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }

  .main-cover {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    background: #333;
    flex-shrink: 0;
  }

  .main-title { font-size: 28px; font-weight: 700; margin: 0; }

  .add-tracks-btn {
    display: inline-block;
    color: var(--text-dim);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
    background: transparent;
    font-family: inherit;
  }

  .add-tracks-btn:hover { color: var(--text); border-color: #666; }

  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .track-row:hover { background: var(--hover); }
  .track-row.playing { color: var(--accent); }

  .track-index { width: 20px; color: var(--text-dim); text-align: right; flex-shrink: 0; }

  .bottom-bar {
    height: 90px;
    background: #181818;
    border-top: 1px solid #282828;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
  }

  .now-playing-info {
    width: 260px;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .now-playing-cover {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-track { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing-folder { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bottom-bar audio { flex: 1; height: 32px; }

  .loop-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .loop-btn.active { border-color: var(--accent); color: var(--accent); }

  .context-menu {
    position: fixed;
    background: #282828;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 4px;
    z-index: 1000;
    min-width: 170px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .context-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .context-item:hover { background: var(--hover); }
  .context-item.danger { color: #f87171; }
  .context-item.danger:hover { background: rgba(248,113,113,0.1); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// CHANGE THIS to your deployed worker URL
const WORKER_URL = "https://my-music-worker.noahnator-workers.workers.dev";

function stripExt(filename) {
  return filename.replace(/\.[^/.]+$/, "");
}

function applyOrder(items, orderKeys, getKey) {
  const byKey = {};
  items.forEach((item) => { byKey[getKey(item)] = item; });
  const ordered = orderKeys.filter((k) => byKey[k]).map((k) => byKey[k]);
  const remaining = items.filter((item) => !orderKeys.includes(getKey(item)));
  return [...ordered, ...remaining];
}

function Marquee({ text, className }) {
  const wrapRef = useRef(null);
  const [overflowing, setOverflowing] = useState(false);

  useEffect(() => {
    const el = wrapRef.current;
    if (el) setOverflowing(el.scrollWidth > el.clientWidth + 2);
  }, [text]);

  return (
    <div ref={wrapRef} className={"marquee-wrap" + (overflowing ? " overflowing" : "") + (className ? " " + className : "")}>
      <span className="marquee-inner">
        {text}
        {overflowing && <React.Fragment>&nbsp;&nbsp;&nbsp;&nbsp;{text}</React.Fragment>}
      </span>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => sessionStorage.getItem("auth_token") || "");
  const [library, setLibrary] = useState({ soundtracks: {}, categories: [], order: {} });
  const [expanded, setExpanded] = useState({});

  const [viewingId, setViewingId] = useState(null);
  const [error, setError] = useState(null);
  const [isViewingDownloaded, setIsViewingDownloaded] = useState(false);
  const [downloadStatus, setDownloadStatus] = useState(null); // e.g. "3 / 8" while downloading, null otherwise

  const [playingId, setPlayingId] = useState(null);
  const [playingIndex, setPlayingIndex] = useState(-1);
  const [loopTrack, setLoopTrack] = useState(false);

  const audioRef = useRef(null);

  function streamUrl(key) {
    return `${WORKER_URL}/api/stream/${encodeURIComponent(key)}?token=${encodeURIComponent(token)}`;
  }

  async function authedFetch(path, options) {
    const res = await fetch(WORKER_URL + path, {
      ...options,
      headers: { ...(options && options.headers), "X-Auth-Token": token },
    });
    if (!res.ok) {
      sessionStorage.removeItem("auth_token");
      setError("Auth failed. Refresh and re-enter password.");
      throw new Error("auth failed");
    }
    return res.json();
  }

  async function loadLibrary() {
    setError(null);
    try {
      setLibrary(await authedFetch("/api/library"));
    } catch (e) { /* error already set */ }
  }

  useEffect(() => {
    if (!token) {
      const entered = prompt("Enter password:");
      sessionStorage.setItem("auth_token", entered || "");
      setToken(entered || "");
      return;
    }
    loadLibrary();
  }, [token]);

  const OFFLINE_CACHE = "music-offline-v1";
  const lastBlobUrlRef = useRef(null);

  function offlineKeys(soundtrack) {
    const keys = soundtrack.tracks.map((t) => t.key);
    if (soundtrack.cover) keys.push(soundtrack.cover);
    return keys;
  }

  async function isDownloaded(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    const results = await Promise.all(offlineKeys(soundtrack).map((k) => cache.match(k)));
    return results.length > 0 && results.every((r) => r);
  }

  async function downloadSoundtrack(soundtrack, onProgress) {
    const cache = await caches.open(OFFLINE_CACHE);
    const keys = offlineKeys(soundtrack);
    for (let i = 0; i < keys.length; i++) {
      const res = await fetch(streamUrl(keys[i]));
      await cache.put(keys[i], res.clone());
      if (onProgress) onProgress(i + 1, keys.length);
    }
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist(); // ask the browser not to evict this under storage pressure
    }
  }

  async function removeDownload(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    for (const key of offlineKeys(soundtrack)) {
      await cache.delete(key);
    }
  }

  async function getPlayableUrl(key) {
    const cache = await caches.open(OFFLINE_CACHE);
    const cached = await cache.match(key);
    if (cached) {
      const blob = await cached.blob();
      return URL.createObjectURL(blob);
    }
    return streamUrl(key);
  }

  async function uploadFile(id, file) {
    await authedFetch("/api/upload?id=" + encodeURIComponent(id), {
      method: "POST",
      headers: { "X-Filename": file.name, "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
  }

  const [showAddForm, setShowAddForm] = useState(false);
  const [newCategory, setNewCategory] = useState("");
  const [newName, setNewName] = useState("");
  const [newFiles, setNewFiles] = useState(null);
  const [uploading, setUploading] = useState(false);

  async function handleCreateSoundtrack() {
    if (!newName || !newFiles || newFiles.length === 0) return;
    setUploading(true);
    const { id } = await authedFetch("/api/create-soundtrack", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: newName, category: newCategory || null }),
    });
    for (const file of newFiles) {
      await uploadFile(id, file);
    }
    setUploading(false);
    setShowAddForm(false);
    setNewCategory("");
    setNewName("");
    setNewFiles(null);
    loadLibrary();
  }

  async function handleAddTracksToViewing(fileList) {
    if (!viewingId || !fileList || fileList.length === 0) return;
    setUploading(true);
    for (const file of fileList) {
      await uploadFile(viewingId, file);
    }
    setUploading(false);
    loadLibrary();
  }

  async function handleRenameSoundtrack(id) {
    const current = library.soundtracks[id] ? library.soundtracks[id].name : "";
    const name = prompt("New name:", current);
    if (!name || name === current) return;
    await authedFetch("/api/rename-soundtrack", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, name }),
    });
    loadLibrary();
  }

  async function handleRenameCategory(oldName) {
    const newName = prompt("New category name:", oldName);
    if (!newName || newName === oldName) return;
    await authedFetch("/api/rename-category", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ oldName, newName }),
    });
    loadLibrary();
  }

  async function handleCreateCategory() {
    const name = prompt("New category name:");
    if (!name) return;
    await authedFetch("/api/create-category", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    loadLibrary();
  }

  // moving is now instant - just a metadata update, no file copying
  async function moveSoundtrackToCategory(id, toCategory) {
    await authedFetch("/api/move", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, category: toCategory || null }),
    });
    loadLibrary();
  }

  async function handleMoveToCategory(id) {
    const targetCategory = prompt("Move to which category? (leave blank for top level)");
    if (targetCategory === null) return;
    await moveSoundtrackToCategory(id, targetCategory);
  }

  async function handleDelete(target) {
    const label = target.type === "category"
      ? `category "${target.name}" and everything in it`
      : `"${library.soundtracks[target.id] ? library.soundtracks[target.id].name : ''}"`;
    if (!confirm(`Delete ${label}? This cannot be undone.`)) return;

    await authedFetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(target),
    });

    if (target.type === "soundtrack" && viewingId === target.id) setViewingId(null);
    if (target.type === "soundtrack" && playingId === target.id) {
      setPlayingId(null);
      setPlayingIndex(-1);
      if (audioRef.current) audioRef.current.pause();
    }
    loadLibrary();
  }

  function togglePin(id) {
    const pinned = library.order["_pinned"] || [];
    const newPinned = pinned.includes(id) ? pinned.filter((p) => p !== id) : [...pinned, id];
    updateOrder("_pinned", newPinned);
  }

  async function updateOrder(parentPath, newOrder) {
    setLibrary((prev) => ({ ...prev, order: { ...prev.order, [parentPath]: newOrder } }));
    await authedFetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parentPath, order: newOrder }),
    });
  }

  const allSoundtracks = Object.values(library.soundtracks);
  const directSoundtracks = allSoundtracks.filter((s) => !s.category);
  const categoriesWithSoundtracks = library.categories.map((name) => ({
    name,
    soundtracks: allSoundtracks.filter((s) => s.category === name),
  }));

  const topLevelItems = applyOrder(
    [
      ...categoriesWithSoundtracks.map((c) => ({ type: "category", name: c.name, soundtracks: c.soundtracks })),
      ...directSoundtracks.map((s) => ({ type: "soundtrack", id: s.id, name: s.name, cover: s.cover })),
    ],
    library.order[""] || [],
    (item) => (item.type === "category" ? item.name : item.id)
  );

  const pinnedIds = library.order["_pinned"] || [];
  const pinnedItems = pinnedIds.map((id) => library.soundtracks[id]).filter(Boolean);

  // drag-and-drop
  const dragRef = useRef(null);

  function handleDragStart(parentPath, index, meta) {
    dragRef.current = { parentPath, index, meta };
  }

  function handleDragOver(e) { e.preventDefault(); }

  function handleDrop(parentPath, displayedItems, getKey, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag || drag.parentPath !== parentPath || drag.index === dropIndex) return;
    const newItems = [...displayedItems];
    const [moved] = newItems.splice(drag.index, 1);
    newItems.splice(dropIndex, 0, moved);
    updateOrder(parentPath, newItems.map(getKey));
  }

  function handleDropOnCategory(categoryName, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag) return;

    if (drag.meta && drag.meta.type === "soundtrack") {
      moveSoundtrackToCategory(drag.meta.id, categoryName);
      return;
    }

    if (drag.parentPath !== "" || drag.index === dropIndex) return;
    const newItems = [...topLevelItems];
    const [moved] = newItems.splice(drag.index, 1);
    newItems.splice(dropIndex, 0, moved);
    updateOrder("", newItems.map((it) => (it.type === "category" ? it.name : it.id)));
  }

  function toggleCategory(name) {
    setExpanded((prev) => ({ ...prev, [name]: !prev[name] }));
  }

  const viewingSoundtrackForEffect = viewingId ? library.soundtracks[viewingId] : null;

  useEffect(() => {
    let cancelled = false;
    if (viewingSoundtrackForEffect) {
      isDownloaded(viewingSoundtrackForEffect).then((result) => {
        if (!cancelled) setIsViewingDownloaded(result);
      });
    } else {
      setIsViewingDownloaded(false);
    }
    return () => { cancelled = true; };
  }, [viewingId, viewingSoundtrackForEffect]);

  async function handleDownload() {
    if (!viewingSoundtrackForEffect) return;
    setDownloadStatus("Starting...");
    await downloadSoundtrack(viewingSoundtrackForEffect, (done, total) => setDownloadStatus(`${done} / ${total}`));
    setDownloadStatus(null);
    setIsViewingDownloaded(true);
  }

  async function handleRemoveDownload() {
    if (!viewingSoundtrackForEffect) return;
    await removeDownload(viewingSoundtrackForEffect);
    setIsViewingDownloaded(false);
  }

  function playTrackAt(id, i) {
    const soundtrack = library.soundtracks[id];
    if (!soundtrack || i < 0 || i >= soundtrack.tracks.length) return;
    setPlayingId(id);
    setPlayingIndex(i);
  }

  useEffect(() => {
    const soundtrack = playingId && library.soundtracks[playingId];
    if (soundtrack && playingIndex >= 0 && soundtrack.tracks[playingIndex] && audioRef.current) {
      let cancelled = false;
      getPlayableUrl(soundtrack.tracks[playingIndex].key).then((url) => {
        if (cancelled) return;
        if (lastBlobUrlRef.current) {
          URL.revokeObjectURL(lastBlobUrlRef.current);
          lastBlobUrlRef.current = null;
        }
        if (url.startsWith("blob:")) lastBlobUrlRef.current = url;
        audioRef.current.src = url;
        audioRef.current.play();
      });
      return () => { cancelled = true; };
    }
  }, [playingIndex, playingId]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.loop = loopTrack;
  }, [loopTrack]);

  useEffect(() => {
    if (audioRef.current) {
      const saved = localStorage.getItem("volume");
      if (saved !== null) audioRef.current.volume = parseFloat(saved);
      const handleVolumeChange = () => localStorage.setItem("volume", audioRef.current.volume);
      audioRef.current.addEventListener("volumechange", handleVolumeChange);
      return () => audioRef.current && audioRef.current.removeEventListener("volumechange", handleVolumeChange);
    }
  }, []);

  function handleEnded() {
    if (loopTrack) return;
    playTrackAt(playingId, playingIndex + 1);
  }

  const [contextMenu, setContextMenu] = useState(null);

  useEffect(() => {
    function closeMenu() { setContextMenu(null); }
    window.addEventListener("click", closeMenu);
    return () => window.removeEventListener("click", closeMenu);
  }, []);

  function openContextMenu(e, target) {
    e.preventDefault();
    e.stopPropagation();
    setContextMenu({ x: e.clientX, y: e.clientY, target });
  }

  if (error) {
    return <div style={{padding: 24, color: "#fff"}}>{error}</div>;
  }

  const viewingSoundtrack = viewingId ? library.soundtracks[viewingId] : null;
  const playingSoundtrack = playingId ? library.soundtracks[playingId] : null;
  const hasNowPlaying = playingSoundtrack && playingIndex >= 0;

  return (
    <div className="app">
      <div className="app-body">

        <div className="sidebar" onContextMenu={(e) => openContextMenu(e, { type: "empty" })}>
          <div className="sidebar-header">
            <h1>Library</h1>
            <button className="add-btn" onClick={() => setShowAddForm(!showAddForm)}>+</button>
          </div>

          {showAddForm && (
            <div className="add-form">
              <input type="text" placeholder="Category (optional)" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} />
              <input type="text" placeholder="Soundtrack name" value={newName} onChange={(e) => setNewName(e.target.value)} />
              <input type="file" multiple accept="audio/*,image/*" onChange={(e) => setNewFiles(e.target.files)} />
              <button onClick={handleCreateSoundtrack} disabled={uploading}>{uploading ? "Uploading..." : "Create"}</button>
            </div>
          )}

          {pinnedItems.length > 0 && (
            <React.Fragment>
              <div className="section-label">Pinned</div>
              {pinnedItems.map((s) => (
                <div
                  key={"pin-" + s.id}
                  className={"folder-item" + (s.id === viewingId ? " active" : "")}
                  onClick={() => setViewingId(s.id)}
                  onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: s.id })}
                >
                  <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                  <span className="folder-name">{s.name}</span>
                  {s.id === playingId && <div className="folder-playing-dot"></div>}
                </div>
              ))}
              <div className="section-label">All</div>
            </React.Fragment>
          )}

          {topLevelItems.map((item, i) => {
            if (item.type === "category") {
              const isOpen = !!expanded[item.name];
              const nestedItems = applyOrder(item.soundtracks, library.order[item.name] || [], (s) => s.id);
              return (
                <React.Fragment key={item.name}>
                  <div
                    className="folder-item"
                    draggable
                    onDragStart={() => handleDragStart("", i, { type: "category", name: item.name })}
                    onDragOver={handleDragOver}
                    onDrop={() => handleDropOnCategory(item.name, i)}
                    onClick={() => toggleCategory(item.name)}
                    onContextMenu={(e) => openContextMenu(e, { type: "category", name: item.name })}
                  >
                    <span className="drag-handle">⠿</span>
                    <span className="category-arrow">{isOpen ? "▼" : "▶"}</span>
                    <div className="category-icon">📁</div>
                    <span className="folder-name">{item.name}</span>
                  </div>
                  {isOpen && nestedItems.map((s, j) => (
                    <div
                      key={s.id}
                      className={"folder-item nested" + (s.id === viewingId ? " active" : "")}
                      draggable
                      onDragStart={() => handleDragStart(item.name, j, { type: "soundtrack", id: s.id })}
                      onDragOver={handleDragOver}
                      onDrop={() => handleDrop(item.name, nestedItems, (it) => it.id, j)}
                      onClick={() => setViewingId(s.id)}
                      onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: s.id })}
                    >
                      <span className="drag-handle">⠿</span>
                      <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                      <span className="folder-name">{s.name}</span>
                      {s.id === playingId && <div className="folder-playing-dot"></div>}
                    </div>
                  ))}
                </React.Fragment>
              );
            }

            return (
              <div
                key={item.id}
                className={"folder-item" + (item.id === viewingId ? " active" : "")}
                draggable
                onDragStart={() => handleDragStart("", i, { type: "soundtrack", id: item.id })}
                onDragOver={handleDragOver}
                onDrop={() => handleDrop("", topLevelItems, (it) => (it.type === "category" ? it.name : it.id), i)}
                onClick={() => setViewingId(item.id)}
                onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: item.id })}
              >
                <span className="drag-handle">⠿</span>
                <img className="folder-thumb" src={item.cover ? streamUrl(item.cover) : ""} />
                <span className="folder-name">{item.name}</span>
                {item.id === playingId && <div className="folder-playing-dot"></div>}
              </div>
            );
          })}
        </div>

        <div className="main">
          {!viewingSoundtrack ? (
            <div className="main-empty">Pick a soundtrack from the left to see its tracks.</div>
          ) : (
            <React.Fragment>
              <div className="main-header">
                {viewingSoundtrack.cover && <img className="main-cover" src={streamUrl(viewingSoundtrack.cover)} />}
                <h2 className="main-title">{viewingSoundtrack.name}</h2>
              </div>
              <label className="add-tracks-btn">
                {uploading ? "Uploading..." : "+ Add tracks"}
                <input type="file" multiple accept="audio/*,image/*" style={{display: "none"}} disabled={uploading}
                  onChange={(e) => handleAddTracksToViewing(e.target.files)} />
              </label>
              {" "}
              {downloadStatus ? (
                <span className="add-tracks-btn">Downloading {downloadStatus}...</span>
              ) : isViewingDownloaded ? (
                <button className="add-tracks-btn" onClick={handleRemoveDownload}>✓ Downloaded (remove)</button>
              ) : (
                <button className="add-tracks-btn" onClick={handleDownload}>Download for offline</button>
              )}
              {viewingSoundtrack.tracks.map((track, i) => {
                const isPlaying = viewingId === playingId && i === playingIndex;
                return (
                  <div key={track.key} className={"track-row" + (isPlaying ? " playing" : "")} onClick={() => playTrackAt(viewingId, i)}>
                    <span className="track-index">{isPlaying ? "▶" : i + 1}</span>
                    <span>{stripExt(track.name)}</span>
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
      </div>

      <div className="bottom-bar">
        <div className="now-playing-info">
          {hasNowPlaying ? (
            <React.Fragment>
              {playingSoundtrack.cover && <img className="now-playing-cover" src={streamUrl(playingSoundtrack.cover)} />}
              <div style={{minWidth: 0}}>
                <Marquee text={stripExt(playingSoundtrack.tracks[playingIndex].name)} className="now-playing-track" />
                <Marquee text={playingSoundtrack.name} className="now-playing-folder" />
              </div>
            </React.Fragment>
          ) : (
            <div className="now-playing-folder">Nothing playing</div>
          )}
        </div>
        <audio ref={audioRef} controls onEnded={handleEnded}></audio>
        <button className={"loop-btn" + (loopTrack ? " active" : "")} onClick={() => setLoopTrack(!loopTrack)}>
          Loop {loopTrack ? "On" : "Off"}
        </button>
      </div>

      {contextMenu && (
        <div className="context-menu" style={{top: contextMenu.y, left: contextMenu.x}} onClick={(e) => e.stopPropagation()}>
          {contextMenu.target.type === "empty" && (
            <div className="context-item" onClick={handleCreateCategory}>New category folder</div>
          )}
          {contextMenu.target.type === "category" && (
            <React.Fragment>
              <div className="context-item" onClick={() => { setShowAddForm(true); setNewCategory(contextMenu.target.name); }}>
                Add soundtrack here
              </div>
              <div className="context-item" onClick={() => handleRenameCategory(contextMenu.target.name)}>Rename</div>
              <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete category</div>
            </React.Fragment>
          )}
          {contextMenu.target.type === "soundtrack" && (
            <React.Fragment>
              <div className="context-item" onClick={() => togglePin(contextMenu.target.id)}>
                {pinnedIds.includes(contextMenu.target.id) ? "Unpin" : "Pin"}
              </div>
              <div className="context-item" onClick={() => handleRenameSoundtrack(contextMenu.target.id)}>Rename</div>
              <div className="context-item" onClick={() => handleMoveToCategory(contextMenu.target.id)}>Move to category...</div>
              <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete</div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}

</script>

</body>
</html>
