<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<style>
  :root {
    --bg: #121212;
    --sidebar-bg: #000000;
    --panel-bg: #181818;
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --accent: #3fb950;
    --hover: #2a2a2a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  #root { height: 100vh; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .app-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Sidebar: soundtrack list */
  .sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    padding: 16px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  .sidebar-header h1 {
    margin: 0;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .add-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 4px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }

  .add-btn:hover { color: var(--text); border-color: #666; }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
    margin-bottom: 12px;
    background: #181818;
    border-radius: 6px;
  }

  .add-form input[type="text"] {
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  .add-form input[type="file"] {
    color: var(--text-dim);
    font-size: 12px;
  }

  .add-form button {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .add-form button:disabled { opacity: 0.6; cursor: default; }

  .add-tracks-btn {
    display: inline-block;
    color: var(--text-dim);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .add-tracks-btn:hover { color: var(--text); border-color: #666; }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .folder-item:hover { background: var(--hover); }
  .folder-item.active { background: var(--hover); }
  .folder-item:active { cursor: grabbing; }

  .folder-item.nested { padding-left: 24px; }

  .category-arrow {
    color: var(--text-dim);
    font-size: 10px;
    width: 10px;
    flex-shrink: 0;
  }

  .category-icon {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: #2a2a2a;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .folder-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .folder-name {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .folder-playing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: auto;
    flex-shrink: 0;
  }

  .drag-handle {
    color: #555;
    font-size: 14px;
    cursor: grab;
    flex-shrink: 0;
  }

  .marquee-wrap {
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }

  .marquee-wrap.overflowing .marquee-inner {
    display: inline-block;
    animation: marquee 16s linear infinite;
    padding-right: 40px;
  }

  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Main panel: selected soundtrack's tracks */
  .main {
    flex: 1;
    background: var(--panel-bg);
    overflow-y: auto;
    padding: 24px 32px;
  }

  .main-empty {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 60px;
    text-align: center;
  }

  .main-header {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 24px;
  }

  .main-cover {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    background: #333;
    flex-shrink: 0;
  }

  .main-title { font-size: 28px; font-weight: 700; margin: 0; }

  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .track-row:hover { background: var(--hover); }
  .track-row.playing { color: var(--accent); }

  .track-index {
    width: 20px;
    color: var(--text-dim);
    text-align: right;
    flex-shrink: 0;
  }

  /* Bottom control bar */
  .bottom-bar {
    height: 90px;
    background: #181818;
    border-top: 1px solid #282828;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
  }

  .now-playing-info {
    width: 260px;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .now-playing-cover {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-track {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .now-playing-folder {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bottom-bar audio {
    flex: 1;
    height: 32px;
  }

  .loop-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .loop-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React, ReactDOM, and Babel via CDN - no build step needed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// CHANGE THIS to your deployed worker URL
const WORKER_URL = "https://my-music-worker.noahnator-workers.workers.dev";

function stripExt(filename) {
  return filename.replace(/\.[^/.]+$/, "");
}

// applies a saved order (array of keys) to a list of items, unlisted items go at the end
function applyOrder(items, orderKeys, getKey) {
  const byKey = {};
  items.forEach((item) => { byKey[getKey(item)] = item; });
  const ordered = orderKeys.filter((k) => byKey[k]).map((k) => byKey[k]);
  const remaining = items.filter((item) => !orderKeys.includes(getKey(item)));
  return [...ordered, ...remaining];
}

function Marquee({ text, className }) {
  const wrapRef = useRef(null);
  const [overflowing, setOverflowing] = useState(false);

  useEffect(() => {
    const el = wrapRef.current;
    if (el) {
      setOverflowing(el.scrollWidth > el.clientWidth + 2);
    }
  }, [text]);

  return (
    <div ref={wrapRef} className={"marquee-wrap" + (overflowing ? " overflowing" : "") + (className ? " " + className : "")}>
      <span className="marquee-inner">
        {text}
        {overflowing && <React.Fragment>&nbsp;&nbsp;&nbsp;&nbsp;{text}</React.Fragment>}
      </span>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => sessionStorage.getItem("auth_token") || "");
  const [tree, setTree] = useState({ soundtracks: [], categories: [] }); // { soundtracks: [{name,cover,path}], categories: [{name, soundtracks:[...]}] }
  const [orderMap, setOrderMap] = useState({}); // { "<parentPath>": ["key1","key2",...] }, "" = top level, category name = within that category
  const [expanded, setExpanded] = useState({}); // { categoryName: true/false }

  const [viewingPath, setViewingPath] = useState(null); // full path of soundtrack open in main panel, e.g. "Movies/Interstellar"
  const [tracks, setTracks] = useState([]);
  const [cover, setCover] = useState(null);
  const [error, setError] = useState(null);

  // playback state - separate from "viewing", so playback persists when browsing elsewhere
  const [playingPath, setPlayingPath] = useState(null);
  const [playingIndex, setPlayingIndex] = useState(-1);
  const [playingTracks, setPlayingTracks] = useState([]);
  const [playingCover, setPlayingCover] = useState(null);
  const [loopTrack, setLoopTrack] = useState(false);

  const audioRef = useRef(null);

  function streamUrl(key) {
    return `${WORKER_URL}/api/stream/${encodeURIComponent(key)}?token=${encodeURIComponent(token)}`;
  }

  async function uploadFile(key, file) {
    await fetch(WORKER_URL + "/api/upload?key=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "X-Auth-Token": token, "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
  }

  const [showAddForm, setShowAddForm] = useState(false);
  const [newCategory, setNewCategory] = useState("");
  const [newName, setNewName] = useState("");
  const [newFiles, setNewFiles] = useState(null);
  const [uploading, setUploading] = useState(false);

  async function handleCreateSoundtrack() {
    if (!newName || !newFiles || newFiles.length === 0) return;
    setUploading(true);
    const folder = newCategory ? `${newCategory}/${newName}` : newName;
    for (const file of newFiles) {
      await uploadFile(`${folder}/${file.name}`, file);
    }
    setUploading(false);
    setShowAddForm(false);
    setNewCategory("");
    setNewName("");
    setNewFiles(null);
    loadSoundtracks();
  }

  async function handleAddTracksToViewing(fileList) {
    if (!viewingPath || !fileList || fileList.length === 0) return;
    setUploading(true);
    for (const file of fileList) {
      await uploadFile(`${viewingPath}/${file.name}`, file);
    }
    setUploading(false);
    openSoundtrack(viewingPath); // refresh track list
  }

  async function authedFetch(path) {
    const res = await fetch(WORKER_URL + path, {
      headers: { "X-Auth-Token": token },
    });
    if (!res.ok) {
      sessionStorage.removeItem("auth_token");
      setError("Auth failed. Refresh and re-enter password.");
      throw new Error("auth failed");
    }
    return res.json();
  }

  useEffect(() => {
    if (!token) {
      const entered = prompt("Enter password:");
      sessionStorage.setItem("auth_token", entered || "");
      setToken(entered || "");
      return;
    }
    loadSoundtracks();
  }, [token]);

  async function loadSoundtracks() {
    setError(null);
    try {
      const [treeData, orderData] = await Promise.all([
        authedFetch("/api/soundtracks"),
        authedFetch("/api/order"),
      ]);
      setTree(treeData);
      setOrderMap(orderData);
    } catch (e) { /* error already set */ }
  }

  async function postOrder(parentPath, order) {
    try {
      await fetch(WORKER_URL + "/api/order", {
        method: "POST",
        headers: { "X-Auth-Token": token, "Content-Type": "application/json" },
        body: JSON.stringify({ parentPath, order }),
      });
    } catch (e) { /* saving order failed silently, not critical */ }
  }

  function updateOrder(parentPath, newOrder) {
    setOrderMap((prev) => ({ ...prev, [parentPath]: newOrder }));
    postOrder(parentPath, newOrder);
  }

  // build the ordered top-level list: categories + direct soundtracks mixed together
  const topLevelItems = applyOrder(
    [
      ...tree.categories.map((c) => ({ type: "category", name: c.name, soundtracks: c.soundtracks })),
      ...tree.soundtracks.map((s) => ({ type: "soundtrack", name: s.name, cover: s.cover, path: s.path })),
    ],
    orderMap[""] || [],
    (item) => item.name
  );

  // drag-and-drop reordering - dragRef stores { parentPath, index } of the item being dragged
  const dragRef = useRef(null);

  function handleDragStart(parentPath, index) {
    dragRef.current = { parentPath, index };
  }

  function handleDragOver(e) {
    e.preventDefault(); // required to allow dropping
  }

  function handleDrop(parentPath, displayedItems, getKey, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag || drag.parentPath !== parentPath || drag.index === dropIndex) return; // only reorder within the same list
    const newItems = [...displayedItems];
    const [moved] = newItems.splice(drag.index, 1);
    newItems.splice(dropIndex, 0, moved);
    updateOrder(parentPath, newItems.map(getKey));
  }

  function toggleCategory(name) {
    setExpanded((prev) => ({ ...prev, [name]: !prev[name] }));
  }

  async function openSoundtrack(path) {
    setError(null);
    setViewingPath(path);
    try {
      const data = await authedFetch("/api/soundtracks/" + encodeURIComponent(path));
      setTracks(data.tracks);
      setCover(data.cover);
    } catch (e) { /* error already set */ }
  }

  function playTrackAt(path, folderTracks, folderCover, i) {
    if (i < 0 || i >= folderTracks.length) return; // reached end, stop
    setPlayingPath(path);
    setPlayingTracks(folderTracks);
    setPlayingCover(folderCover);
    setPlayingIndex(i);
  }

  // whenever the "playing" pointer changes, actually load + play the audio
  useEffect(() => {
    if (playingIndex >= 0 && playingTracks[playingIndex] && audioRef.current) {
      audioRef.current.src = streamUrl(playingTracks[playingIndex].key);
      audioRef.current.play();
    }
  }, [playingIndex, playingPath]);

  // keep the audio element's native loop in sync with the toggle
  useEffect(() => {
    if (audioRef.current) {
      audioRef.current.loop = loopTrack;
    }
  }, [loopTrack]);

  // restore saved volume once the audio element exists, and save it whenever changed
  useEffect(() => {
    if (audioRef.current) {
      const saved = localStorage.getItem("volume");
      if (saved !== null) audioRef.current.volume = parseFloat(saved);

      const handleVolumeChange = () => {
        localStorage.setItem("volume", audioRef.current.volume);
      };
      audioRef.current.addEventListener("volumechange", handleVolumeChange);
      return () => audioRef.current && audioRef.current.removeEventListener("volumechange", handleVolumeChange);
    }
  }, []);

  function handleEnded() {
    if (loopTrack) return; // native loop attribute handles replaying, skip auto-advance
    playTrackAt(playingPath, playingTracks, playingCover, playingIndex + 1);
  }

  if (error) {
    return <div style={{padding: 24, color: "#fff"}}>{error}</div>;
  }

  const hasNowPlaying = playingPath && playingIndex >= 0;
  const viewingName = viewingPath ? viewingPath.split("/").pop() : null;
  const playingName = playingPath ? playingPath.split("/").pop() : null;

  return (
    <div className="app">
      <div className="app-body">

        {/* Sidebar: categories + soundtracks */}
        <div className="sidebar">
          <div className="sidebar-header">
            <h1>Soundtracks</h1>
            <button className="add-btn" onClick={() => setShowAddForm(!showAddForm)}>+</button>
          </div>

          {showAddForm && (
            <div className="add-form">
              <input
                type="text"
                placeholder="Category (optional)"
                value={newCategory}
                onChange={(e) => setNewCategory(e.target.value)}
              />
              <input
                type="text"
                placeholder="Soundtrack name"
                value={newName}
                onChange={(e) => setNewName(e.target.value)}
              />
              <input
                type="file"
                multiple
                accept="audio/*,image/*"
                onChange={(e) => setNewFiles(e.target.files)}
              />
              <button onClick={handleCreateSoundtrack} disabled={uploading}>
                {uploading ? "Uploading..." : "Create"}
              </button>
            </div>
          )}

          {topLevelItems.map((item, i) => {
            if (item.type === "category") {
              const isOpen = !!expanded[item.name];
              const nestedItems = applyOrder(item.soundtracks, orderMap[item.name] || [], (s) => s.name);
              return (
                <React.Fragment key={item.name}>
                  <div
                    className="folder-item"
                    draggable
                    onDragStart={() => handleDragStart("", i)}
                    onDragOver={handleDragOver}
                    onDrop={() => handleDrop("", topLevelItems, (it) => it.name, i)}
                    onClick={() => toggleCategory(item.name)}
                  >
                    <span className="drag-handle">⠿</span>
                    <span className="category-arrow">{isOpen ? "▼" : "▶"}</span>
                    <div className="category-icon">📁</div>
                    <span className="folder-name">{item.name}</span>
                  </div>
                  {isOpen && nestedItems.map((s, j) => (
                    <div
                      key={s.path}
                      className={"folder-item nested" + (s.path === viewingPath ? " active" : "")}
                      draggable
                      onDragStart={() => handleDragStart(item.name, j)}
                      onDragOver={handleDragOver}
                      onDrop={() => handleDrop(item.name, nestedItems, (it) => it.name, j)}
                      onClick={() => openSoundtrack(s.path)}
                    >
                      <span className="drag-handle">⠿</span>
                      <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                      <span className="folder-name">{s.name}</span>
                      {s.path === playingPath && <div className="folder-playing-dot"></div>}
                    </div>
                  ))}
                </React.Fragment>
              );
            }

            // top-level direct soundtrack (no category)
            return (
              <div
                key={item.path}
                className={"folder-item" + (item.path === viewingPath ? " active" : "")}
                draggable
                onDragStart={() => handleDragStart("", i)}
                onDragOver={handleDragOver}
                onDrop={() => handleDrop("", topLevelItems, (it) => it.name, i)}
                onClick={() => openSoundtrack(item.path)}
              >
                <span className="drag-handle">⠿</span>
                <img className="folder-thumb" src={item.cover ? streamUrl(item.cover) : ""} />
                <span className="folder-name">{item.name}</span>
                {item.path === playingPath && <div className="folder-playing-dot"></div>}
              </div>
            );
          })}
        </div>

        {/* Main panel: tracks of the selected soundtrack */}
        <div className="main">
          {!viewingPath ? (
            <div className="main-empty">Pick a soundtrack from the left to see its tracks.</div>
          ) : (
            <React.Fragment>
              <div className="main-header">
                {cover && <img className="main-cover" src={streamUrl(cover)} />}
                <h2 className="main-title">{viewingName}</h2>
              </div>
              <label className="add-tracks-btn">
                {uploading ? "Uploading..." : "+ Add tracks"}
                <input
                  type="file"
                  multiple
                  accept="audio/*,image/*"
                  style={{ display: "none" }}
                  onChange={(e) => handleAddTracksToViewing(e.target.files)}
                  disabled={uploading}
                />
              </label>
              {tracks.map((track, i) => {
                const isPlaying = viewingPath === playingPath && i === playingIndex;
                return (
                  <div
                    key={track.key}
                    className={"track-row" + (isPlaying ? " playing" : "")}
                    onClick={() => playTrackAt(viewingPath, tracks, cover, i)}
                  >
                    <span className="track-index">{isPlaying ? "▶" : i + 1}</span>
                    <span>{stripExt(track.name)}</span>
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
      </div>

      {/* Bottom control bar - persistent audio element lives here, never unmounts */}
      <div className="bottom-bar">
        <div className="now-playing-info">
          {hasNowPlaying ? (
            <React.Fragment>
              {playingCover && (
                <img className="now-playing-cover" src={streamUrl(playingCover)} />
              )}
              <div style={{minWidth: 0}}>
                <Marquee text={stripExt(playingTracks[playingIndex].name)} className="now-playing-track" />
                <Marquee text={playingName} className="now-playing-folder" />
              </div>
            </React.Fragment>
          ) : (
            <div className="now-playing-folder">Nothing playing</div>
          )}
        </div>
        <audio ref={audioRef} controls onEnded={handleEnded}></audio>
        <button className={"loop-btn" + (loopTrack ? " active" : "")} onClick={() => setLoopTrack(!loopTrack)}>
          Loop {loopTrack ? "On" : "Off"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
