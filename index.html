<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#121212">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #121212;
    --sidebar-bg: #000000;
    --panel-bg: #181818;
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --accent: #3fb950;
    --hover: #2a2a2a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #root { height: 100vh; height: 100dvh; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .app-body { display: flex; flex: 1; min-height: 0; }
  .app-body.resizing { user-select: none; cursor: col-resize; }
  .sidebar-resizer { width: 6px; flex-shrink: 0; cursor: col-resize; background: transparent; touch-action: none; transition: background 0.15s; }
  .sidebar-resizer:hover, .app-body.resizing .sidebar-resizer { background: #3a3a3a; }

  .sidebar {
    width: var(--sidebar-w, 260px);
    background: var(--sidebar-bg);
    padding: 16px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  .sidebar-header h1 {
    margin: 0;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .add-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 4px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }

  .add-btn:hover { color: var(--text); border-color: #666; }

  .search-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-wrap { position: relative; margin-bottom: 12px; }

  .search-input {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 7px 26px 7px 10px;
    border-radius: 16px;
    font-size: 13px;
  }

  .search-input:focus { outline: none; border-color: var(--accent); }

  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 2px;
  }

  .search-clear-btn:hover { color: var(--text); }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
    margin-bottom: 12px;
    background: #181818;
    border-radius: 6px;
  }

  .add-form input[type="text"] {
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  .add-form input[type="file"] { color: var(--text-dim); font-size: 12px; }

  .add-form button {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .add-form button:disabled { opacity: 0.6; cursor: default; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }

  .modal-panel {
    background: #181818;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    width: 360px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .modal-header h3 { margin: 0; font-size: 16px; }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
  }

  .modal-close:hover { color: var(--text); }

  .lookup-buttons { display: flex; gap: 6px; }
  .lookup-buttons button { flex: 1; }

  .online-results {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 160px;
    overflow-y: auto;
  }

  .online-result, .online-selected {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
    background: #222;
  }

  .online-result:hover { background: #2a2a2a; }
  .online-selected { cursor: default; background: #20301f; }

  .online-result-thumb {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .online-result-name {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-result-sub {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-clear-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
    padding: 8px 8px 4px 8px;
  }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .folder-item:hover { background: var(--hover); }
  .folder-item.active { background: var(--hover); }
  .folder-item:active { cursor: grabbing; }
  .folder-item.nested { padding-left: 24px; }

  .category-arrow { color: var(--text-dim); font-size: 10px; width: 10px; flex-shrink: 0; }

  .category-icon {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: #2a2a2a;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .folder-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .folder-name {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ep-progress { height: 3px; width: 120px; max-width: 60%; background: #3a3a3a; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .ep-progress-fill { height: 100%; background: var(--accent); transition: width 0.3s linear; }
  .ep-meta { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .ep-done { opacity: 0.55; }
  .row-menu-btn { display: inline-block; background: transparent; border: none; color: var(--text-dim); font-size: 16px; letter-spacing: 1px; padding: 2px 8px; margin-left: auto; flex-shrink: 0; cursor: pointer; font-family: inherit; border-radius: 6px; }
  .row-menu-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  .ep-dl-btn { background: transparent; border: 1px solid #444; color: var(--text-dim); border-radius: 12px; padding: 2px 10px; font-size: 11px; margin-left: 10px; flex-shrink: 0; cursor: pointer; font-family: inherit; }
  .ep-dl-btn.saved { color: var(--accent); border-color: var(--accent); }
  .sync-badge {
    position: fixed; top: 12px; right: 16px; z-index: 50;
    background: #181818; border: 1px solid #333; border-radius: 12px;
    padding: 3px 10px; font-size: 12px; color: var(--text-dim); pointer-events: none;
  }
  .sync-badge.offline { color: #e0a030; border-color: #e0a030; }

  .folder-flag {
    font-size: 10px; color: var(--text-dim); border: 1px solid #444; border-radius: 8px;
    padding: 0 6px; margin-left: auto; flex-shrink: 0; white-space: nowrap;
  }

  .folder-playing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: auto;
    flex-shrink: 0;
  }

  .drag-handle { color: #555; font-size: 14px; cursor: grab; flex-shrink: 0; }

  .marquee-wrap { overflow: hidden; white-space: nowrap; position: relative; }

  .marquee-wrap.overflowing .marquee-inner {
    display: inline-block;
    animation: marquee 16s linear infinite;
    padding-right: 40px;
  }

  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .main { flex: 1; background: var(--panel-bg); overflow-y: auto; padding: 24px 32px; }

  .main-empty {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 60px;
    text-align: center;
  }

  .main-header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }

  .main-cover {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    background: #333;
    flex-shrink: 0;
  }

  .main-title { font-size: 28px; font-weight: 700; margin: 0; }
  .main-subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

  .add-tracks-btn {
    display: inline-block;
    color: var(--text-dim);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
    background: transparent;
    font-family: inherit;
  }

  .add-tracks-btn:hover { color: var(--text); border-color: #666; }

  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .track-row:hover { background: var(--hover); }
  .track-row.playing { color: var(--accent); }

  .track-index { width: 20px; color: var(--text-dim); text-align: right; flex-shrink: 0; }

  .track-thumb {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 3px;
    background: #333;
    flex-shrink: 0;
  }

  .bottom-bar {
    height: 90px;
    background: #181818;
    border-top: 1px solid #282828;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .bar-divider {
    width: 1px;
    height: 32px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-info {
    width: 220px;
    flex-shrink: 1;
    min-width: 140px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .now-playing-cover {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-track { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing-folder { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .play-pause-btn {
    background: var(--text);
    color: #000;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-pause-btn:disabled { opacity: 0.4; cursor: default; }

  .skip-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
  }

  .skip-btn:hover:not(:disabled) { color: var(--text); }
  .skip-btn:disabled { opacity: 0.3; cursor: default; }

  .transport {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 80px;
  }

  .time-label {
    font-size: 11px;
    color: var(--text-dim);
    width: 34px;
    flex-shrink: 0;
    text-align: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    height: 16px;
    min-width: 0;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--range-progress, 0%), #4a4a4a var(--range-progress, 0%));
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    background: #4a4a4a;
    border-radius: 2px;
  }

  input[type="range"]::-moz-range-progress {
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    margin-top: -4px;
    box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }

  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    border: none;
    box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }

  input[type="range"]:disabled::-webkit-slider-thumb { background: #666; }
  input[type="range"]:disabled { cursor: default; }

  .seek-bar { flex: 1; }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 130px;
    flex-shrink: 0;
  }

  .volume-icon { font-size: 14px; flex-shrink: 0; }
  .volume-bar { flex: 1; min-width: 0; }
  .volume-percent { font-size: 11px; color: var(--text-dim); width: 30px; flex-shrink: 0; text-align: right; display: flex; align-items: center; justify-content: flex-end; }

  .volume-percent-input {
    width: 20px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    text-align: right;
    padding: 0;
  }

  .volume-percent-input:focus {
    outline: none;
    color: var(--text);
  }

  .loop-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 16px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .loop-btn.active { border-color: var(--accent); color: var(--accent); }

  .context-menu {
    position: fixed;
    background: #282828;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 4px;
    z-index: 1000;
    min-width: 170px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .context-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .context-item:hover { background: var(--hover); }
  .context-item.danger { color: #f87171; }
  .context-item.danger:hover { background: rgba(248,113,113,0.1); }


  .mobile-topbar, .drawer-backdrop { display: none; }

  @media (max-width: 700px) {
    body { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .mobile-topbar {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
      background: #000; border-bottom: 1px solid #282828;
    }
    .mobile-menu-btn {
      background: transparent; border: 1px solid #444; color: var(--text);
      border-radius: 16px; padding: 6px 14px; font-size: 13px; font-family: inherit;
    }
    .sync-badge { top: calc(54px + env(safe-area-inset-top, 0px)); right: 12px; }
    .mobile-topbar-title { font-size: 14px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 85vw; max-width: 340px;
      z-index: 900; transform: translateX(-100%); transition: transform 0.2s ease;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-backdrop {
      display: block; position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .main { padding: 16px; }
    .sidebar-resizer { display: none; }
    .main-header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .main-cover { width: 120px; height: 120px; }
    .main-title { font-size: 22px; }
    .track-row { padding: 12px 8px; gap: 10px; }
    .modal-panel { width: 94vw !important; max-width: 94vw !important; max-height: 90dvh; overflow-y: auto; }
    input, select, textarea { font-size: 16px; } /* stops iOS zoom on focus */

    .bottom-bar {
      height: auto; display: grid; grid-template-columns: 1fr auto auto auto;
      grid-auto-rows: auto; align-items: center; gap: 6px 4px;
      padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      overflow: visible;
    }
    .bottom-bar .now-playing-info { grid-column: 1; grid-row: 1; width: auto; min-width: 0; }
    .bottom-bar .skip-btn, .bottom-bar .play-pause-btn { grid-row: 1; }
    .bottom-bar .skip-btn { width: 40px; height: 40px; font-size: 20px; }
    .bottom-bar .play-pause-btn { width: 44px; height: 44px; font-size: 16px; }
    .bottom-bar .transport { grid-column: 1 / -1; grid-row: 2; }
    .bottom-bar .loop-btn:nth-of-type(1) { grid-column: 1 / 3; grid-row: 3; }
    .bottom-bar .loop-btn:nth-of-type(2) { grid-column: 3 / 5; grid-row: 3; }
    .bottom-bar .loop-btn { padding: 8px 10px; }
    .bottom-bar .bar-divider, .bottom-bar .volume-control { display: none; }
    input[type="range"] { height: 28px; }
    .context-menu { max-width: 80vw; }
    .context-item { padding: 12px 14px; font-size: 15px; }
  }


  .transfer-wrap {
    background: #101010; border-top: 1px solid #282828; padding: 6px 16px;
    display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
  }
  .transfer-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); }
  .transfer-label { flex: 0 1 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transfer-track { flex: 1; height: 4px; background: #4a4a4a; border-radius: 2px; overflow: hidden; min-width: 40px; }
  .transfer-fill { height: 100%; background: var(--accent); transition: width 0.15s linear; }
  .transfer-pct { width: 36px; text-align: right; flex-shrink: 0; }
  .transfer-cancel { background: transparent; border: 1px solid #444; color: var(--text-dim); border-radius: 10px; padding: 1px 9px; font-size: 11px; cursor: pointer; flex-shrink: 0; font-family: inherit; }
  .transfer-cancel:hover { color: var(--text); border-color: var(--text-dim); }
  .transfer-detail { flex-shrink: 0; white-space: nowrap; }
  @media (max-width: 700px) {
    .transfer-wrap { padding: 6px 12px; }
    .transfer-label { flex-basis: 45%; }
    .transfer-detail { display: none; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
</style>
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// CHANGE THIS to your deployed worker URL
const WORKER_URL = "https://my-music-worker.noahnator-workers.workers.dev";

function stripExt(filename) {
  return filename.replace(/\.(mp3|m4a|m4b|aac|wav|flac|ogg|oga|opus|wma|aif|aiff|mp4|webm)$/i, "");
}

// per-episode listening progress, kept in this browser's localStorage
function readProg(key) {
  try {
    return {
      pos: parseInt(localStorage.getItem("pos:" + key) || "0", 10),
      dur: parseFloat(localStorage.getItem("dur:" + key) || "0"),
      done: localStorage.getItem("done:" + key) === "1",
    };
  } catch (e) { return { pos: 0, dur: 0, done: false }; }
}
// Listening progress is kept only in this browser and capped: once more than PROG_MAX episodes have saved progress,
// the least recently listened ones are dropped first (FIFO). Change this number to keep more or fewer.
const PROG_MAX = 100;
function pruneProg(touchKey) {
  try {
    let idx = JSON.parse(localStorage.getItem("prog:index") || "[]");
    if (!Array.isArray(idx)) idx = [];
    if (!touchKey) {
      // on startup, adopt progress saved before the index existed (treated as the oldest)
      const known = new Set(idx);
      const found = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        const m = k && k.match(/^(pos|dur|done):(.+)$/);
        if (m && !known.has(m[2]) && !found.includes(m[2])) found.push(m[2]);
      }
      idx = [...found, ...idx];
    } else {
      idx = idx.filter((k) => k !== touchKey).concat(touchKey); // most recent goes to the end
    }
    while (idx.length > PROG_MAX) {
      const old = idx.shift();
      ["pos:", "dur:", "done:", "t:"].forEach((p) => localStorage.removeItem(p + old));
    }
    localStorage.setItem("prog:index", JSON.stringify(idx));
  } catch (e) {}
}

// writes progress to this browser (the offline copy; the server is the source of truth when online)
function saveProg(key, patch) {
  try {
    const next = { ...readProg(key), ...patch };
    if (next.pos > 0) localStorage.setItem("pos:" + key, String(Math.floor(next.pos))); else localStorage.removeItem("pos:" + key);
    if (next.dur > 0) localStorage.setItem("dur:" + key, String(Math.floor(next.dur)));
    if (next.done) localStorage.setItem("done:" + key, "1"); else localStorage.removeItem("done:" + key);
    pruneProg(key);
  } catch (e) {}
}

function writeEvicted(pid, list) { try { localStorage.setItem("podcast:evicted:" + pid, JSON.stringify(list.slice(-300))); } catch (e) {} }

function fmtLeft(sec) {

// ---- official track order matching (used by "Try Order") ----
function normTitle(str, stripNum) {
  let t = stripExt(String(str || "")).toLowerCase();
  if (stripNum) t = t.replace(/^\s*\d{1,3}[\s.\-_)]+/, ""); // leading track number in a filename: "03 - Name"
  return t.replace(/\(.*?\)|\[.*?\]/g, " ").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
}
function titleScore(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (Math.min(a.length, b.length) >= 3 && (a.includes(b) || b.includes(a))) return 0.9;
  const wa = new Set(a.split(" ")), wb = new Set(b.split(" "));
  let common = 0;
  wa.forEach((w) => { if (wb.has(w)) common++; });
  return common / (wa.size + wb.size - common);
}
// official: [{ title }] in official order; tracks: your tracks. Returns { rows, matched } where rows follow the official order,
// and files with no match are appended at the end in their current order.
function matchOfficialOrder(tracks, official) {
  const off = official.map((o) => ({ ...o, norms: [o.title, ...(o.alts || [])].map((t) => normTitle(t, false)) }));
  const files = tracks.map((t) => ({ t, norm: normTitle(t.name, true) }));
  const pairs = [];
  off.forEach((o, oi) => files.forEach((f, fi) => {
    const sc = Math.max(...o.norms.map((n) => titleScore(f.norm, n)));
    if (sc >= 0.6) pairs.push({ oi, fi, sc });
  }));
  pairs.sort((a, b) => b.sc - a.sc || Math.abs(a.oi - a.fi) - Math.abs(b.oi - b.fi));
  const offTaken = {}, fileTaken = {}, byOff = {};
  pairs.forEach((p) => {
    if (offTaken[p.oi] || fileTaken[p.fi]) return;
    offTaken[p.oi] = true; fileTaken[p.fi] = true; byOff[p.oi] = p.fi;
  });
  const rows = [];
  off.forEach((o, oi) => { if (byOff[oi] !== undefined) rows.push({ official: o.title, track: files[byOff[oi]].t }); });
  files.forEach((f, fi) => { if (!fileTaken[fi]) rows.push({ official: null, track: f.t }); });
  return { rows, matched: Object.keys(byOff).length };
}

const isExternal = (key) => /^https?:\/\//i.test(key || "");

// parses podcast RSS XML into { title, description, artist, cover, tracks } (tracks use the episode audio url as their key)
function parsePodcastFeed(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const channel = doc.querySelector("channel");
  if (doc.querySelector("parsererror") || !channel) throw new Error("That does not look like a podcast feed");
  const kids = (el) => Array.from(el.children);
  const child = (el, name) => kids(el).find((c) => c.localName === name);
  const txt = (el, name) => { const c = child(el, name); return c ? c.textContent.trim() : ""; };
  const https = (u) => (u || "").replace(/^http:\/\//i, "https://");

  let cover = "";
  const imgs = kids(channel).filter((c) => c.localName === "image");
  for (const im of imgs) {
    const href = im.getAttribute("href");
    if (href) { cover = href; break; }
    const u = child(im, "url");
    if (u && !cover) cover = u.textContent.trim();
  }

  const seen = new Set();
  let tracks = kids(channel).filter((c) => c.localName === "item").map((item) => {
    const enc = child(item, "enclosure");
    const url = enc ? https(enc.getAttribute("url")) : "";
    if (!url || seen.has(url)) return null;
    seen.add(url);
    const date = Date.parse(txt(item, "pubDate"));
    return { key: url, name: txt(item, "title") || "Episode", date: isNaN(date) ? 0 : date };
  }).filter(Boolean);
  if (tracks.every((t) => t.date)) tracks.sort((a, b) => b.date - a.date); // newest first
  tracks = tracks.slice(0, 300);

  return {
    title: txt(channel, "title"),
    description: txt(channel, "description").replace(/<[^>]*>/g, "").slice(0, 1000),
    artist: txt(channel, "author"),
    cover: https(cover),
    tracks,
  };
}

// Tracks inside a soundtrack are either owned { key, name } or references { key, soundtrackId } to a track owned by
// another soundtrack. This fills in names for references (flagged isRef) so the rest of the app can treat every
// soundtrack's tracks the same way. References whose source no longer exists are dropped.
// ---- embedded cover art in audio files: ID3 (mp3), PICTURE block (flac), covr atom (m4a/mp4) ----
// read(start, length) returns a Uint8Array for that byte range (shorter or empty past the end of the file)
function u32(b, o) { return ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0; }
function syncsafe(b, o) { return (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3]; }
function ascii(b, o, n) { let s = ""; for (let i = o; i < o + n && i < b.length; i++) s += String.fromCharCode(b[i]); return s; }

function makeArt(bytes) {
  let mime = null;
  if (bytes.length > 3 && bytes[0] === 0xFF && bytes[1] === 0xD8) mime = "image/jpeg";
  else if (bytes.length > 4 && bytes[0] === 0x89 && ascii(bytes, 1, 3) === "PNG") mime = "image/png";
  else if (bytes.length > 12 && ascii(bytes, 0, 4) === "RIFF" && ascii(bytes, 8, 4) === "WEBP") mime = "image/webp";
  else if (bytes.length > 3 && ascii(bytes, 0, 3) === "GIF") mime = "image/gif";
  return mime && bytes.length > 100 && bytes.length <= 8 * 1024 * 1024 ? { mime, bytes } : null;
}

async function artFromId3(read) {
  const head = await read(0, 10);
  if (head.length < 10 || ascii(head, 0, 3) !== "ID3") return null;
  const ver = head[3];
  const flags = head[5];
  const size = syncsafe(head, 6);
  if (size <= 0 || size > 20 * 1024 * 1024) return null;
  const tag = await read(10, size);
  let pos = 0;
  if ((flags & 0x40) && tag.length >= 4) pos = ver === 4 ? syncsafe(tag, 0) : u32(tag, 0) + 4; // skip extended header
  const idLen = ver === 2 ? 3 : 4;
  const hdrLen = ver === 2 ? 6 : 10;
  let best = null;
  while (pos + hdrLen <= tag.length) {
    const id = ascii(tag, pos, idLen);
    if (!id.trim() || tag[pos] === 0) break; // padding
    let fsize;
    if (ver === 2) fsize = (tag[pos + 3] << 16) | (tag[pos + 4] << 8) | tag[pos + 5];
    else if (ver === 4) fsize = syncsafe(tag, pos + 4);
    else fsize = u32(tag, pos + 4);
    const dStart = pos + hdrLen;
    const dEnd = dStart + fsize;
    if (fsize <= 0 || dEnd > tag.length) break;
    if (id === "APIC" || id === "PIC") {
      const f = tag.subarray(dStart, dEnd);
      const enc = f[0];
      let p = 1;
      if (ver === 2) p += 3; // 3 letter image format
      else { while (p < f.length && f[p] !== 0) p++; p++; } // mime type, null terminated
      const picType = f[p];
      p++;
      if (enc === 1 || enc === 2) { while (p + 1 < f.length && !(f[p] === 0 && f[p + 1] === 0)) p += 2; p += 2; } // utf-16 description
      else { while (p < f.length && f[p] !== 0) p++; p++; }
      const art = makeArt(f.slice(p));
      if (art && (!best || picType === 3)) { best = art; if (picType === 3) break; } // 3 = front cover
    }
    pos = dEnd;
  }
  return best;
}

async function artFromFlac(read) {
  const head = await read(0, 4);
  if (head.length < 4 || ascii(head, 0, 4) !== "fLaC") return null;
  let pos = 4;
  let best = null;
  for (let n = 0; n < 200; n++) {
    const h = await read(pos, 4);
    if (h.length < 4) break;
    const last = !!(h[0] & 0x80);
    const type = h[0] & 0x7f;
    const len = (h[1] << 16) | (h[2] << 8) | h[3];
    if (type === 6 && len < 20 * 1024 * 1024) {
      const b = await read(pos + 4, len);
      if (b.length === len) {
        const picType = u32(b, 0);
        let p = 8 + u32(b, 4);
        p += 4 + u32(b, p);
        p += 16; // width, height, depth, colors
        const dataLen = u32(b, p);
        p += 4;
        const art = makeArt(b.slice(p, p + dataLen));
        if (art && (!best || picType === 3)) { best = art; if (picType === 3) break; }
      }
    }
    if (last) break;
    pos += 4 + len;
  }
  return best;
}

// finds a child box between start and end, reading only the small box headers
async function findMp4Box(read, start, end, type) {
  let pos = start;
  while (pos + 8 <= end) {
    const h = await read(pos, 16);
    if (h.length < 8) return null;
    let size = u32(h, 0);
    let hl = 8;
    const t = ascii(h, 4, 4);
    if (size === 1) {
      if (h.length < 16) return null;
      size = u32(h, 8) * 4294967296 + u32(h, 12);
      hl = 16;
    } else if (size === 0) size = end - pos;
    if (size < hl) return null;
    if (t === type) return { start: pos + hl, end: Math.min(pos + size, end) };
    pos += size;
  }
  return null;
}

async function artFromMp4(read) {
  const head = await read(0, 12);
  if (head.length < 12 || ascii(head, 4, 4) !== "ftyp") return null;
  const moov = await findMp4Box(read, 0, Number.MAX_SAFE_INTEGER, "moov");
  if (!moov) return null;
  const udta = await findMp4Box(read, moov.start, moov.end, "udta");
  if (!udta) return null;
  const meta = await findMp4Box(read, udta.start, udta.end, "meta");
  if (!meta) return null;
  const ilst = await findMp4Box(read, meta.start + 4, meta.end, "ilst"); // meta is a full box: skip version and flags
  if (!ilst) return null;
  const covr = await findMp4Box(read, ilst.start, ilst.end, "covr");
  if (!covr) return null;
  const data = await findMp4Box(read, covr.start, covr.end, "data");
  if (!data) return null;
  return makeArt(await read(data.start + 8, Math.min(data.end - data.start - 8, 8 * 1024 * 1024 + 1))); // skip version, flags, locale
}

async function extractEmbeddedArt(read) {
  const head = await read(0, 12);
  if (head.length < 8) return null;
  if (ascii(head, 0, 3) === "ID3") return artFromId3(read);
  if (ascii(head, 0, 4) === "fLaC") return artFromFlac(read);
  if (ascii(head, 4, 4) === "ftyp") return artFromMp4(read);
  return null;
}

// Scales picture bytes down to a small JPEG (longest side maxDim). If the browser cannot decode or encode it, or the result
// would not be smaller, the original is returned unchanged. Same input always gives the same output, so identical pictures
// still match each other afterwards.
async function shrinkImage(art, maxDim, quality) {
  maxDim = maxDim || 320;
  quality = quality || 0.8;
  try {
    const blob = new Blob([art.bytes], { type: art.mime });
    let bmp;
    if (typeof createImageBitmap === "function") {
      bmp = await createImageBitmap(blob);
    } else {
      const url = URL.createObjectURL(blob);
      try {
        bmp = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = url;
        });
      } finally { URL.revokeObjectURL(url); }
    }
    const w0 = bmp.width, h0 = bmp.height;
    if (!w0 || !h0) return art;
    const scale = Math.min(1, maxDim / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * scale));
    const h = Math.max(1, Math.round(h0 * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#111"; // transparent areas would turn black in a JPEG anyway; make that deliberate
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const out = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
    if (!out) return art;
    const bytes = new Uint8Array(await out.arrayBuffer());
    return bytes.length > 100 && bytes.length < art.bytes.length ? { mime: "image/jpeg", bytes } : art;
  } catch (e) {
    return art;
  }
}

function makeFileReader(file) {
  return async (start, length) => new Uint8Array(await file.slice(start, start + length).arrayBuffer());
}

function sideOf(t) { return t && t.side === "B" ? "B" : "A"; }

function hydrateLibrary(lib) {
  const src = lib.soundtracks || {};
  const out = {};
  Object.values(src).forEach((s) => {
    const tracks = (s.tracks || []).map((t) => {
      if (!t.soundtrackId || t.soundtrackId === s.id) return t;
      const owner = src[t.soundtrackId];
      const real = owner && (owner.tracks || []).find((x) => x.key === t.key && !x.soundtrackId);
      return real ? { key: t.key, name: real.name, soundtrackId: t.soundtrackId, isRef: true, side: t.side, cover: real.cover } : null;
    }).filter(Boolean);
    // with A/B sides on, every A track is listed before every B track
    const ordered = s.sides ? [...tracks.filter((t) => sideOf(t) === "A"), ...tracks.filter((t) => sideOf(t) === "B")] : tracks;
    out[s.id] = { ...s, tracks: ordered };
  });
  return { ...lib, soundtracks: out };
}

function applyOrder(items, orderKeys, getKey) {
  const byKey = {};
  items.forEach((item) => { byKey[getKey(item)] = item; });
  const ordered = orderKeys.filter((k) => byKey[k]).map((k) => byKey[k]);
  const remaining = items.filter((item) => !orderKeys.includes(getKey(item)));
  return [...ordered, ...remaining];
}

function Marquee({ text, className }) {
  const wrapRef = useRef(null);
  const [overflowing, setOverflowing] = useState(false);

  useEffect(() => {
    const el = wrapRef.current;
    if (el) setOverflowing(el.scrollWidth > el.clientWidth + 2);
  }, [text]);

  return (
    <div ref={wrapRef} className={"marquee-wrap" + (overflowing ? " overflowing" : "") + (className ? " " + className : "")}>
      <span className="marquee-inner">
        {text}
        {overflowing && <React.Fragment>&nbsp;&nbsp;&nbsp;&nbsp;{text}</React.Fragment>}
      </span>
    </div>
  );
}

function App() {

  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [playingId, setPlayingId] = useState(null);
  const [playingKey, setPlayingKey] = useState(null);
  const [loopTrack, setLoopTrack] = useState(false);
  const [shuffle, setShuffle] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(0);
  const [volumePercent, setVolumePercent] = useState(() => {
    const saved = localStorage.getItem("volumePercent");
    return saved !== null ? parseFloat(saved) : 100;
  });
  const [searchQuery, setSearchQuery] = useState("");

  const audioRef = useRef(null);

  // touch devices do not fire "contextmenu" on long-press (iOS), so emulate it
  useEffect(() => {
    let timer = null, startX = 0, startY = 0, fired = false;
    function cancel() { clearTimeout(timer); timer = null; }
    function onStart(e) {
      fired = false; // must reset first: a leftover "fired" would cancel the click on the next tap, e.g. on a menu item
      if (e.touches.length !== 1) return cancel();
      const t = e.target;
      if (t.closest && t.closest("input, textarea, select, .context-menu, .modal-panel")) return;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY; fired = false;
      timer = setTimeout(() => {
        fired = true;
        t.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: startX, clientY: startY }));
        if (navigator.vibrate) navigator.vibrate(15);
      }, 500);
    }
    function onMove(e) {
      if (Math.abs(e.touches[0].clientX - startX) > 10 || Math.abs(e.touches[0].clientY - startY) > 10) cancel();
    }
    function onEnd(e) { cancel(); if (fired && e.cancelable) e.preventDefault(); fired = false; } // swallow the click that follows a long-press, once
    document.addEventListener("touchstart", onStart, { passive: true });
    document.addEventListener("touchmove", onMove, { passive: true });
    document.addEventListener("touchend", onEnd, { passive: false });
    document.addEventListener("touchcancel", cancel, { passive: true });
    return () => {
      document.removeEventListener("touchstart", onStart);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onEnd);
      document.removeEventListener("touchcancel", cancel);
    };
  }, []);

  // ---- podcasts (episodes come from the RSS feed in the browser; the Worker only passes the XML through) ----
  const podcastCacheRef = useRef({}); // id -> { tracks, at }
  const [podcastStatus, setPodcastStatus] = useState({}); // id -> "loading" | error text
  const [showPodcastModal, setShowPodcastModal] = useState(false);
  const [podcastParent, setPodcastParent] = useState(null);
  const [podcastInput, setPodcastInput] = useState("");
  const [podcastResults, setPodcastResults] = useState([]);
  const [podcastBusy, setPodcastBusy] = useState(false);
  const [podcastError, setPodcastError] = useState("");
  const [progressMap, setProgressMap] = useState({}); // episode key -> { pos, dur, done }

  function refreshProg(key) {
    setProgressMap((m) => ({ ...m, [key]: readProg(key) }));
  }

  // ---- progress sync: Cloudflare is the source of truth; this browser keeps an offline copy ----
  // Online: positions are pushed to the Worker while you listen, and every other device simply shows what the server has.
  // Offline: changes are kept (also across restarts) and pushed as soon as the connection is back.
  const loadPending = () => { try { return new Set(JSON.parse(localStorage.getItem("prog:pending") || "[]")); } catch (e) { return new Set(); } };
  const pendingProgRef = useRef(null);
  if (pendingProgRef.current === null) pendingProgRef.current = loadPending();
  const playingKeyRef = useRef(null);
  const lastSavedAtRef = useRef(0);
  const lastFlushRef = useRef(0);
  const [syncStatus, setSyncStatus] = useState("");
  const lastOkRef = useRef(0);

  function markSynced() {
    lastOkRef.current = Date.now();
    setSyncStatus("Synced " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
  }

  // one failed request is not "offline": only say so if the browser reports it, or nothing has worked for 45 seconds
  function markFailed(err) {
    console.warn("progress sync failed:", err);
    if (navigator.onLine === false || Date.now() - lastOkRef.current > 45000) setSyncStatus("Offline");
  }

  function persistPending() {
    try { localStorage.setItem("prog:pending", JSON.stringify(Array.from(pendingProgRef.current))); } catch (e) {}
  }

  function recordProg(key, patch) {
    saveProg(key, patch);
    pendingProgRef.current.add(key);
    persistPending();
    refreshProg(key);
  }

  function flushProgress(useBeacon) {
    const keys = Array.from(pendingProgRef.current);
    if (keys.length === 0) return;
    lastFlushRef.current = Date.now();
    const updates = keys.map((k) => { const p = readProg(k); return { key: k, pos: p.pos, dur: p.dur, done: p.done }; });
    const body = JSON.stringify({ updates });
    if (useBeacon && navigator.sendBeacon) {
      // text/plain keeps it a "simple" request so it can be sent while the page is closing; the token rides in the query string
      if (navigator.sendBeacon(WORKER_URL + "/api/progress?token=" + encodeURIComponent(token), new Blob([body], { type: "text/plain" }))) {
        keys.forEach((k) => pendingProgRef.current.delete(k));
        persistPending();
      }
      return;
    }
    fetch(WORKER_URL + "/api/progress", { method: "POST", headers: { "X-Auth-Token": token }, body, cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        keys.forEach((k) => {
          // only forget an episode if it hasn't changed again while the request was in flight
          const now = readProg(k);
          const sent = updates.find((u) => u.key === k);
          if (now.pos === sent.pos && now.done === sent.done) pendingProgRef.current.delete(k);
        });
        persistPending();
        markSynced();
      })
      .catch((err) => markFailed(err));
  }

  // returns the server's entries (or null if offline); updates this browser's copy for every episode we have no unsent changes for
  async function pullProgress() {
    try {
      const res = await fetch(WORKER_URL + "/api/progress", { headers: { "X-Auth-Token": token }, cache: "no-store" });
      if (!res.ok) throw new Error();
      const entries = (await res.json()).entries || {};
      const changed = {};
      Object.entries(entries).forEach(([key, e]) => {
        if (pendingProgRef.current.has(key)) return; // we have newer changes still waiting to be sent
        if (key === playingKeyRef.current && audioRef.current && !audioRef.current.paused) return; // never fight the episode playing right now
        const cur = readProg(key);
        if (cur.pos === e.pos && cur.done === e.done && cur.dur === e.dur) return;
        try {
          if (e.pos > 0) localStorage.setItem("pos:" + key, String(e.pos)); else localStorage.removeItem("pos:" + key);
          if (e.dur > 0) localStorage.setItem("dur:" + key, String(e.dur));
          if (e.done) localStorage.setItem("done:" + key, "1"); else localStorage.removeItem("done:" + key);
          pruneProg(key);
        } catch (err) {}
        changed[key] = readProg(key);
      });
      if (Object.keys(changed).length) setProgressMap((m) => ({ ...m, ...changed }));
      markSynced();
      return entries;
    } catch (e) {
      markFailed(e);
      return null;
    }
  }

  useEffect(() => {
    flushProgress(false);
    pullProgress();
    // timers are throttled in background tabs, so pushing while playing is also driven by the audio's own timeupdate
    const timer = setInterval(() => {
      flushProgress(false);
      if (document.visibilityState === "visible") pullProgress();
    }, 15000);
    function onVis() {
      if (document.visibilityState === "hidden") flushProgress(true);
      else { flushProgress(false); pullProgress(); }
    }
    function onHide() { flushProgress(true); }
    function onOnline() { flushProgress(false); pullProgress(); }
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", onHide);
    window.addEventListener("online", onOnline);
    return () => {
      clearInterval(timer);
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", onHide);
      window.removeEventListener("online", onOnline);
    };
  }, []);

  function markPlayed(key) {
    recordProg(key, { pos: 0, done: true });
    if (getDlSettings().deleteAfterPlayed) removeEpisodeDownload(key);
    flushProgress(false);
    setContextMenu(null);
  }

  function resetProg(key) {
    recordProg(key, { pos: 0, done: false });
    flushProgress(false);
    setContextMenu(null);
  }

  useEffect(() => { pruneProg(); }, []); // trim old progress on startup

  // load saved progress for the episodes of the podcast being viewed
  useEffect(() => {
    const st = viewingId && library.soundtracks[viewingId];
    if (!st || !st.feedUrl) return;
    const m = {};
    st.tracks.forEach((t) => { m[t.key] = readProg(t.key); });
    setProgressMap((prev) => ({ ...prev, ...m }));
  }, [viewingId, library.soundtracks[viewingId] ? library.soundtracks[viewingId].tracks.length : 0]);

  async function fetchFeedXml(feedUrl) {
    const res = await fetch(WORKER_URL + "/api/podcast-feed?url=" + encodeURIComponent(feedUrl), { headers: { "X-Auth-Token": token } });
    if (!res.ok) throw new Error(res.status === 401 ? "Not authorised" : (await res.text()) || "Could not load feed");
    return res.text();
  }

  async function fetchPodcastEpisodes(id) {
    const st = library.soundtracks[id];
    if (!st || !st.feedUrl) return;
    const c = podcastCacheRef.current[id];
    if (c && (c.loading || Date.now() - c.at < 600000)) return; // fresh enough (10 min) or already loading
    podcastCacheRef.current[id] = { tracks: c ? c.tracks : [], at: c ? c.at : 0, loading: true };
    setPodcastStatus((p) => ({ ...p, [id]: "loading" }));
    try {
      const feed = parsePodcastFeed(await fetchFeedXml(st.feedUrl));
      podcastCacheRef.current[id] = { tracks: feed.tracks, at: Date.now() };
      setLibrary((prev) => prev.soundtracks[id] ? { ...prev, soundtracks: { ...prev.soundtracks, [id]: { ...prev.soundtracks[id], tracks: feed.tracks } } } : prev);
      setPodcastStatus((p) => ({ ...p, [id]: null }));
      runAutoDownload(id, feed.tracks);
    } catch (e) {
      podcastCacheRef.current[id] = { tracks: c ? c.tracks : [], at: Date.now() }; // avoid retry loops
      setPodcastStatus((p) => ({ ...p, [id]: "Could not load episodes: " + e.message }));
    }
  }

  // whenever the library reloads from the server (podcasts are saved without episodes), put cached episodes back
  useEffect(() => {
    const next = {};
    Object.values(library.soundtracks).forEach((st) => {
      const c = podcastCacheRef.current[st.id];
      if (st.feedUrl && st.tracks.length === 0 && c && c.tracks.length > 0) next[st.id] = { ...st, tracks: c.tracks };
    });
    if (Object.keys(next).length) setLibrary((prev) => ({ ...prev, soundtracks: { ...prev.soundtracks, ...next } }));
  }, [library]);

  // load (or refresh) episodes when opening a podcast
  useEffect(() => {
    if (viewingId) fetchPodcastEpisodes(viewingId);
  }, [viewingId, library.soundtracks[viewingId] ? library.soundtracks[viewingId].feedUrl : null]);

  // ---- podcast episode downloads ----
  const [dlIndex, setDlIndex] = useState(readDl);
  const [dlActive, setDlActive] = useState(null); // { key, loaded, total }
  const [dlQueued, setDlQueued] = useState([]);
  const [dlSettings, setDlSettings] = useState(() => ({ ...getDlSettings() }));
  const [showDlModal, setShowDlModal] = useState(false);
  const dlQueueRef = useRef([]);
  const dlRunningRef = useRef(false);
  const dlAbortRef = useRef(null);
  const dlCurrentRef = useRef(null); // { key, pid, manual } of the episode downloading now

  // stops queued episode downloads that match, and the running one if it matches too
  function cancelEpisodeDownloads(match) {
    dlQueueRef.current = dlQueueRef.current.filter((q) => !match(q));
    setDlQueued(dlQueueRef.current.map((q) => q.key));
    if (dlAbortRef.current && dlCurrentRef.current && match(dlCurrentRef.current)) dlAbortRef.current.abort();
  }

  const isDl = (key) => dlIndex.some((d) => d.key === key);

  function episodeInfo(key) {
    for (const st of Object.values(library.soundtracks)) {
      if (!st.feedUrl) continue;
      const t = st.tracks.find((x) => x.key === key);
      if (t) return { pid: st.id, date: t.date || 0, name: t.name, podcast: st.name };
    }
    return { pid: "", date: 0, name: "", podcast: "" };
  }

  // manual = you pressed Save (kept until you remove it); otherwise it is an auto-download (rotates out, oldest release first)
  function downloadEpisode(key, title, manual, pid, rel) {
    if (readDl().some((d) => d.key === key)) return;
    const info = episodeInfo(key);
    if (!dlQueueRef.current.some((q) => q.key === key)) dlQueueRef.current.push({ key, title: title || info.name, podcast: info.podcast, manual, pid: pid || info.pid, rel: rel || info.date });
    setDlQueued(dlQueueRef.current.map((q) => q.key));
    runDlQueue();
  }

  async function runDlQueue() {
    if (dlRunningRef.current) return;
    dlRunningRef.current = true;
    while (dlQueueRef.current.length) {
      const { key, title, podcast, manual, pid, rel } = dlQueueRef.current.shift();
      setDlQueued(dlQueueRef.current.map((q) => q.key));
      if (readDl().some((d) => d.key === key)) continue;
      try {
        setDlActive({ key, loaded: 0, total: 0, title, podcast, manual });
        const controller = new AbortController();
        dlAbortRef.current = controller;
        dlCurrentRef.current = { key, pid, manual };
        const res = await fetch(WORKER_URL + "/api/podcast-audio?url=" + encodeURIComponent(key), { headers: { "X-Auth-Token": token }, signal: controller.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const type = res.headers.get("Content-Type") || "audio/mpeg";
        const total = parseInt(res.headers.get("Content-Length") || "0", 10);
        const reader = res.body.getReader();
        const chunks = [];
        let loaded = 0, lastShown = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          if (Date.now() - lastShown > 250) { lastShown = Date.now(); setDlActive({ key, loaded, total, title, podcast, manual }); }
        }
        const blob = new Blob(chunks, { type });
        const cache = await caches.open(OFFLINE_CACHE);
        await cache.put(key, new Response(blob, { status: 200, headers: { "Content-Type": type } }));
        const list = readDl().filter((d) => d.key !== key);
        list.push({ key, size: blob.size, t: Date.now(), title: title || "", pid, auto: !manual, rel: rel || 0 });
        if (manual && pid) writeEvicted(pid, readEvicted(pid).filter((k) => k !== key)); // you asked for it, so it is no longer "removed to make room"
        writeDl(list);
        await enforceDlCap(key, pid);
        setDlIndex(readDl());
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      } catch (e) {
        if (e.name !== "AbortError") {
          console.warn("episode download failed:", e);
          if (manual) alert("Download failed: " + e.message);
        }
      }
      dlAbortRef.current = null;
      dlCurrentRef.current = null;
      setDlActive(null);
    }
    dlRunningRef.current = false;
  }

  // Keep at most this podcast's cap of AUTO-downloaded episodes: the oldest release goes first. Episodes you saved yourself
  // are never removed here, and neither is the one playing right now.
  async function enforceDlCap(justKey, pid) {
    if (!pid) return;
    const cap = getCap(pid);
    let list = readDl();
    const cache = await caches.open(OFFLINE_CACHE);
    const evicted = readEvicted(pid);
    const isAuto = (d) => d.auto && (d.pid || episodeInfo(d.key).pid) === pid;
    while (list.filter(isAuto).length > cap) {
      const candidates = list
        .filter((d) => isAuto(d) && d.key !== justKey && d.key !== playingKeyRef.current)
        .sort((a, b) => (a.rel || 0) - (b.rel || 0) || a.t - b.t);
      if (candidates.length === 0) break;
      const victim = candidates[0];
      list = list.filter((d) => d.key !== victim.key);
      await cache.delete(victim.key);
      evicted.push(victim.key); // remembered so auto-download doesn't fetch it again
    }
    writeEvicted(pid, evicted);
    writeDl(list);
    setDlIndex(list);
  }

  function keepDownload(key) {
    writeDl(readDl().map((d) => (d.key === key ? { ...d, auto: false } : d)));
    setDlIndex(readDl());
  }

  async function removeEpisodeDownload(key) {
    const cache = await caches.open(OFFLINE_CACHE);
    await cache.delete(key);
    writeDl(readDl().filter((d) => d.key !== key));
    setDlIndex(readDl());
  }

  async function removeDownloads(pid) {
    const inScope = (d) => !pid || (d.pid || episodeInfo(d.key).pid) === pid;
    const victims = readDl().filter(inScope);
    if (victims.length === 0) return;
    if (!window.confirm(pid ? "Remove this podcast's downloaded episodes from this device?" : "Remove ALL downloaded podcast episodes from this device?")) return;
    const cache = await caches.open(OFFLINE_CACHE);
    for (const d of victims) await cache.delete(d.key);
    writeDl(readDl().filter((d) => !inScope(d)));
    setDlIndex(readDl());
  }

  // make sure the newest N episodes (by release date) of a podcast with auto-download on are downloaded
  function runAutoDownload(id, tracks) {
    const n = Math.min(getAutoCount(id), getCap(id));
    if (!n || navigator.onLine === false) return;
    const evicted = readEvicted(id);
    const have = readDl();
    [...tracks].sort((a, b) => (b.date || 0) - (a.date || 0)).slice(0, n).forEach((t) => {
      if (have.some((d) => d.key === t.key) || evicted.includes(t.key) || readProg(t.key).done) return;
      downloadEpisode(t.key, t.name, false, id, t.date || 0);
    });
  }

  // auto-download only works while the app is open, so check on start and every half hour
  useEffect(() => {
    function check() {
      Object.values(library.soundtracks).forEach((st) => {
        if (st.feedUrl && getAutoCount(st.id) > 0) fetchPodcastEpisodes(st.id);
      });
    }
    check();
    const timer = setInterval(check, 30 * 60 * 1000);
    return () => clearInterval(timer);
  }, [Object.keys(library.soundtracks).length]);

  function setAuto(id, n) {
    cancelEpisodeDownloads((q) => q.pid === id && !q.manual); // changing the setting stops what it had queued or running
    try { localStorage.setItem("podauto:" + id, String(n)); } catch (e) {}
    writeEvicted(id, []); // a changed setting starts fresh
    setDlSettings((s) => ({ ...s }));
    const cached = podcastCacheRef.current[id];
    if (n > 0 && cached) runAutoDownload(id, cached.tracks);
  }

  function setCap(id, n) {
    const old = getCap(id);
    try { localStorage.setItem("podcap:" + id, String(n)); } catch (e) {}
    if (n > old) writeEvicted(id, []); // more room now, so earlier removals can be fetched again
    setDlSettings((s) => ({ ...s }));
    enforceDlCap(null, id);
    const cached = podcastCacheRef.current[id];
    if (n > old && cached) runAutoDownload(id, cached.tracks);
  }

  function setDeleteAfterPlayed(v) {
    try { localStorage.setItem("podcast:delplayed", v ? "1" : "0"); } catch (e) {}
    setDlSettings((s) => ({ ...s, deleteAfterPlayed: v }));
  }

  function openPodcastModal(parentId) {
    setPodcastParent(parentId || null);
    setPodcastInput("");
    setPodcastResults([]);
    setPodcastError("");
    setShowPodcastModal(true);
    setContextMenu(null);
  }

  async function searchPodcasts() {
    const q = podcastInput.trim();
    if (!q) return;
    if (isExternal(q)) return addPodcast(q);
    setPodcastBusy(true);
    setPodcastError("");
    try {
      const res = await fetch("https://itunes.apple.com/search?media=podcast&entity=podcast&limit=8&term=" + encodeURIComponent(q));
      const data = await res.json();
      const results = (data.results || []).filter((r) => r.feedUrl);
      setPodcastResults(results);
      if (results.length === 0) setPodcastError("No podcasts found. Try pasting the RSS link instead.");
    } catch (e) {
      setPodcastError("Search failed. Try pasting the RSS link instead.");
    }
    setPodcastBusy(false);
  }

  async function addPodcast(feedUrl) {
    setPodcastBusy(true);
    setPodcastError("");
    try {
      const feed = parsePodcastFeed(await fetchFeedXml(feedUrl));
      const res = await fetch(WORKER_URL + "/api/add-podcast", {
        method: "POST",
        headers: { "X-Auth-Token": token, "Content-Type": "application/json" },
        body: JSON.stringify({
          name: feed.title || "Podcast", feedUrl, cover: feed.cover, artist: feed.artist,
          description: feed.description, parentId: podcastParent,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      podcastCacheRef.current[data.id] = { tracks: feed.tracks, at: Date.now() };
      await loadLibrary();
      setShowPodcastModal(false);
      if (podcastParent) setExpanded((prev) => ({ ...prev, [podcastParent]: true }));
      openSoundtrack(data.id);
    } catch (e) {
      setPodcastError("Could not add podcast: " + e.message);
    }
    setPodcastBusy(false);
  }

  function openSoundtrack(id) {
    setSidebarOpen(false);
    setViewingId(id);
    setShowMetaResults(false);
    setMetaResults([]);
  }

  function goToNowPlaying() {
    if (!playingId) return;
    const item = library.soundtracks[playingId];
    openSoundtrack(playingId);
    // expand every ancestor folder so the item is visible in the sidebar
    const open = {};
    let pid = item && item.parentId;
    while (pid && library.folders[pid] && !open[pid]) {
      open[pid] = true;
      pid = library.folders[pid].parentId;
    }
    setExpanded((prev) => ({ ...prev, ...open }));
    setTimeout(() => {
      const el = document.querySelector(".track-row.playing");
      if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 50);
  }

  function streamUrl(key) {
    if (isExternal(key)) return key; // podcast audio and covers play straight from the publisher, not through the Worker
    return `${WORKER_URL}/api/stream/${encodeURIComponent(key)}?token=${encodeURIComponent(token)}`;
  }

  async function authedFetch(path, options) {
    const res = await fetch(WORKER_URL + path, {
      ...options,
      headers: { ...(options && options.headers), "X-Auth-Token": token },
    });
    if (!res.ok) {
      sessionStorage.removeItem("auth_token");
      setError("Auth failed. Refresh and re-enter password.");
      throw new Error("auth failed");
    }
    return res.json();
  }

  async function loadLibrary() {
    setError(null);
    try {
      setLibrary(hydrateLibrary(await authedFetch("/api/library")));
    } catch (e) { /* error already set */ }
  }

  useEffect(() => {
    if (!token) {
      const entered = prompt("Enter password:");
      sessionStorage.setItem("auth_token", entered || "");
      setToken(entered || "");
      return;
    }
    loadLibrary();
  }, [token]);

  // if the thing currently being viewed/played gets deleted (directly, or via a parent folder
  // getting deleted), clear that state once the library refreshes
  useEffect(() => {
    if (viewingId && !library.soundtracks[viewingId]) setViewingId(null);
  }, [library.soundtracks, viewingId]);

  useEffect(() => {
    if (playingId && !library.soundtracks[playingId]) {
      setPlayingId(null);
      setPlayingKey(null);
      if (audioRef.current) audioRef.current.pause();
    }
  }, [library.soundtracks, playingId]);

  // ---- offline downloads ----

  const OFFLINE_CACHE = "music-offline-v1";
  const lastBlobUrlRef = useRef(null);

  function offlineKeys(soundtrack) {
    const keys = soundtrack.tracks.map((t) => t.key);
    if (soundtrack.cover) keys.push(soundtrack.cover);
    return keys;
  }

  // Cache Storage only accepts http(s) addresses, so give every file an explicit https cache key. (A relative key breaks when the
  // page is opened from a file:// path, and ties downloads to whichever address the site happens to be served from.)
  function offlineKey(key) {
    if (isExternal(key)) return key;
    return WORKER_URL + "/offline/" + String(key).split("/").map(encodeURIComponent).join("/");
  }

  // finds a downloaded file, also accepting downloads saved under the old relative key
  async function cacheMatch(cache, key) {
    const hit = await cache.match(offlineKey(key));
    if (hit) return hit;
    try { return await cache.match(key); } catch (e) { return undefined; }
  }

  async function isDownloaded(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    const results = await Promise.all(offlineKeys(soundtrack).map((k) => cacheMatch(cache, k)));
    return results.length > 0 && results.every((r) => r);
  }

  async function downloadSoundtrack(soundtrack, onProgress, signal) {
    const cache = await caches.open(OFFLINE_CACHE);
    const keys = offlineKeys(soundtrack);
    for (let i = 0; i < keys.length; i++) {
      const res = await fetch(streamUrl(keys[i]), { signal });
      if (!res.ok) throw new Error("Download failed (" + res.status + ")");
      const type = res.headers.get("Content-Type") || "";
      const total = parseInt(res.headers.get("Content-Length") || "0", 10);
      let blob;
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const chunks = [];
        let loaded = 0;
        if (onProgress) onProgress({ index: i + 1, count: keys.length, name: keys[i], loaded: 0, total });
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          if (onProgress) onProgress({ index: i + 1, count: keys.length, name: keys[i], loaded, total });
        }
        blob = new Blob(chunks, { type });
      } else {
        blob = await res.blob();
      }
      await cache.put(offlineKey(keys[i]), new Response(blob, { status: 200, headers: { "Content-Type": type } }));
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }

  async function removeDownload(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    for (const key of offlineKeys(soundtrack)) {
      await cache.delete(offlineKey(key));
      try { await cache.delete(key); } catch (e) {} // old relative key
    }
  }

  async function getPlayableUrl(key) {
    const cache = await caches.open(OFFLINE_CACHE);
    const cached = await cacheMatch(cache, key);
    if (!cached && isExternal(key)) return key; // not downloaded: stream from the publisher
    if (cached) {
      const blob = await cached.blob();
      return URL.createObjectURL(blob);
    }
    return streamUrl(key);
  }

  // ---- uploads ----

  const [uploadProgress, setUploadProgress] = useState(null);

  function fileLabel(key) {
    return String(key).split("/").pop();
  }

  function fmtBytes(n) {
    if (!n) return "0 B";
    const u = ["B", "KB", "MB", "GB"];
    const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
    return (n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + " " + u[i];
  }

  // overall percent for a progress object; downloads only know per-file size, uploads know the batch size
  function overallPct(p) {
    if (p.batch) return p.total ? Math.min(100, (p.loaded / p.total) * 100) : 0;
    const frac = p.total ? Math.min(1, p.loaded / p.total) : 0;
    return Math.max(0, Math.min(100, ((p.index - 1 + frac) / p.count) * 100));
  }

  // single file upload via XHR so we get byte-level progress (fetch can't report upload progress)
  async function uploadFile(id, file, onBytes) {
    await uploadFileRaw(id, file, onBytes);
    // audio files: if the file carries its own picture, keep it as that track's icon (never blocks the upload)
    if (!/\.(jpe?g|png|webp|gif)$/i.test(file.name)) {
      try {
        const art = await extractEmbeddedArt(makeFileReader(file));
        if (art) await postTrackCover(id, "media/" + id + "/" + file.name, art);
      } catch (e) { console.warn("track art skipped", e); }
    }
  }

  // force = shrink even if this soundtrack has auto-shrink switched off (used by the explicit "Shrink track art" action)
  async function postTrackCover(id, key, art, force) {
    const st = library.soundtracks[id];
    const doShrink = !!force || !st || st.shrinkArt !== false;
    if (doShrink) art = await shrinkImage(art); // small file = small download; the original stays inside the audio file
    const res = await fetch(WORKER_URL + "/api/upload-track-cover?id=" + encodeURIComponent(id) + "&key=" + encodeURIComponent(key) + (doShrink ? "" : "&full=1"), {
      method: "POST",
      headers: { "X-Auth-Token": token, "Content-Type": art.mime },
      body: art.bytes,
    });
    if (!res.ok) throw new Error("track cover upload failed (" + res.status + ")");
  }

  // reads byte ranges of a stored track through the Worker (needs the Range support in worker.js)
  function makeRangeReader(key) {
    return async (start, length) => {
      if (length <= 0) return new Uint8Array(0);
      const res = await fetch(streamUrl(key), { headers: { Range: "bytes=" + start + "-" + (start + length - 1) } });
      if (res.status === 416) return new Uint8Array(0);
      if (!res.ok) throw new Error("read failed (" + res.status + ")");
      const buf = new Uint8Array(await res.arrayBuffer());
      return res.status === 206 ? buf : buf.slice(start, start + length); // a Worker without Range support sends the whole file
    };
  }

  // looks inside the already uploaded tracks of a soundtrack for embedded pictures
  async function scanTrackArt(id) {
    const st = library.soundtracks[id];
    if (!st) return;
    const todo = st.tracks.filter((t) => !t.isRef && !t.cover && !t.coverOff && !isExternal(t.key));
    if (!todo.length) { alert("Nothing to scan: every track here already has its own art, or there are no tracks."); return; }
    if (!confirm("Scan " + todo.length + " track(s) in \"" + st.name + "\" for embedded art? This only reads the start of each file.")) return;
    let found = 0;
    try {
      for (let i = 0; i < todo.length; i++) {
        setUploadProgress({ batch: true, unit: "items", index: i + 1, count: todo.length, name: todo[i].name, total: todo.length, loaded: i, text: "Scanning track art " + (i + 1) + "/" + todo.length + ": " + todo[i].name });
        try {
          const art = await extractEmbeddedArt(makeRangeReader(todo[i].key));
          if (art) { await postTrackCover(id, todo[i].key, art); found++; }
        } catch (e) { console.warn("track art scan failed for", todo[i].key, e); }
      }
    } finally {
      setUploadProgress(null);
    }
    await loadLibrary();
    alert("Found art for " + found + " of " + todo.length + " track(s).");
  }

  // re-saves existing track art small and shared (same picture = one file). ids: list of soundtrack ids, or null for all.
  // Art already stored small under a hashed name is skipped. Soundtrack covers are not touched.
  async function shrinkTrackArt(ids) {
    // "all" leaves out soundtracks that have auto-shrink switched off; picking one soundtrack shrinks it regardless
    const sts = (ids ? ids.map((i) => library.soundtracks[i]) : Object.values(library.soundtracks).filter((st) => st.shrinkArt !== false)).filter(Boolean);
    const hashed = /\/\.track-covers\/[0-9a-f]{16}\.[a-z]+$/;
    const todo = [];
    sts.forEach((st) => st.tracks.forEach((t) => {
      if (!t.isRef && t.cover && (!hashed.test(t.cover) || t.coverFull)) todo.push({ id: st.id, t });
    }));
    if (!todo.length) { alert("Nothing to do: the track art here is already small and shared."); return; }
    if (!confirm("Shrink the art of " + todo.length + " track(s)? Audio files and soundtrack covers are not changed, and the full-size picture stays inside each audio file.")) return;
    let done = 0;
    let failed = 0;
    try {
      for (let i = 0; i < todo.length; i++) {
        const item = todo[i];
        setUploadProgress({ batch: true, unit: "items", index: i + 1, count: todo.length, name: item.t.name, total: todo.length, loaded: i, text: "Shrinking track art " + (i + 1) + "/" + todo.length + ": " + stripExt(item.t.name) });
        try {
          const res = await fetch(streamUrl(item.t.cover));
          if (!res.ok) throw new Error("download failed (" + res.status + ")");
          const art = makeArt(new Uint8Array(await res.arrayBuffer()));
          if (!art) throw new Error("not an image");
          await postTrackCover(item.id, item.t.key, art, true);
          done++;
        } catch (e) {
          failed++;
          console.warn("shrink failed for", item.t.key, e);
        }
      }
    } finally {
      setUploadProgress(null);
    }
    await loadLibrary();
    alert("Done: " + done + " of " + todo.length + " track(s)" + (failed ? ", " + failed + " could not be processed (see the console)." : "."));
  }

  // looks inside one track's file for an embedded picture; id is the soundtrack that owns the file
  async function findTrackArt(id, key) {
    const st = library.soundtracks[id];
    const t = st && st.tracks.find((x) => x.key === key);
    if (!t) return;
    let found = false;
    let failed = false;
    try {
      setUploadProgress({ batch: true, unit: "items", index: 1, count: 1, name: t.name, total: 1, loaded: 0, text: "Looking for track art: " + stripExt(t.name) });
      const art = await extractEmbeddedArt(makeRangeReader(key));
      if (art) { await postTrackCover(id, key, art); found = true; }
    } catch (e) {
      console.warn("track art lookup failed for", key, e);
      failed = true;
    } finally {
      setUploadProgress(null);
    }
    if (found) await loadLibrary();
    else alert(failed ? "Could not read this file." : "No embedded picture found in this file.");
  }

  function uploadFileRaw(id, file, onBytes) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", WORKER_URL + "/api/upload?id=" + encodeURIComponent(id));
      xhr.setRequestHeader("X-Auth-Token", token);
      xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
      xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
      if (onBytes) xhr.upload.onprogress = (e) => onBytes(e.loaded);
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) return resolve();
        if (xhr.status === 401 || xhr.status === 403) {
          sessionStorage.removeItem("auth_token");
          setError("Auth failed. Refresh and re-enter password.");
        }
        reject(new Error("upload failed (" + xhr.status + ")"));
      };
      xhr.onerror = () => reject(new Error("network error"));
      xhr.send(file);
    });
  }

  // upload several files with one combined progress bar
  async function uploadFiles(id, files) {
    const list = Array.from(files);
    const total = list.reduce((a, f) => a + f.size, 0) || 1;
    let base = 0;
    try {
      for (let i = 0; i < list.length; i++) {
        const f = list[i];
        const stName = library.soundtracks[id] ? library.soundtracks[id].name : "";
        const info = { batch: true, index: i + 1, count: list.length, name: f.name, total, text: "Uploading" + (stName ? " to \"" + stName + "\"" : "") + " " + (i + 1) + "/" + list.length + ": " + f.name };
        setUploadProgress({ ...info, loaded: base });
        await uploadFile(id, f, (l) => setUploadProgress({ ...info, loaded: base + l }));
        base += f.size;
      }
    } finally {
      setUploadProgress(null);
    }
  }

  function renderTransfer(kind, p) {
    const pct = Math.round(overallPct(p));
    const text = p.text || (kind + " " + p.index + "/" + p.count + ": " + p.name);
    const detail = p.batch
      ? (p.unit === "items" ? p.loaded + " / " + p.total : fmtBytes(p.loaded) + " / " + fmtBytes(p.total))
      : (p.total ? fmtBytes(p.loaded) + " / " + fmtBytes(p.total) : fmtBytes(p.loaded));
    return (
      <div className="transfer-row" key={kind}>
        <div className="transfer-label" title={text}>{text}</div>
        <div className="transfer-track"><div className="transfer-fill" style={{ width: pct + "%" }}></div></div>
        <div className="transfer-pct">{p.total ? pct + "%" : "..."}</div>
        <div className="transfer-detail">{detail}</div>
        {p.onCancel && <button className="transfer-cancel" onClick={p.onCancel}>{p.cancelLabel || "Cancel"}</button>}
      </div>
    );
  }

  async function handleOrderSearch(source) {

    if (!q) return;
    setMetaResults([]);

    setOrderPreview(null);
    setMetaSearchAttempted(true);
    setOrderBusy(true);
    try {
      if (source === "musicbrainz") {
        const data = await mbFetch("search=" + encodeURIComponent(q));
        const mineCount = viewingId ? library.soundtracks[viewingId].tracks.length : 0;
        const seen = new Set();
        const list = [];
        (data.releases || []).forEach((r) => {
          const tc = r["track-count"] || 0;
          const key = (r.title || "").toLowerCase() + "|" + tc; // many editions of one album: keep the best-scoring one
          if (seen.has(key)) return;
          seen.add(key);
          list.push({
            source: "musicbrainz", id: r.id, name: r.title || "Untitled",
            artist: (r["artist-credit"] || []).map((a) => a.name).join(", "),
            year: r.date ? r.date.slice(0, 4) : null, trackCount: tc, coverUrl: null,
            score: r.score || 0, sameCount: tc === mineCount,
            note: tc === mineCount ? "same track count as yours" : "",
          });
        });
        list.sort((a, b) => (b.sameCount ? 1 : 0) - (a.sameCount ? 1 : 0) || b.score - a.score);
        setOrderResults(list.slice(0, 12));
      } else {
        const res = await fetch("https://itunes.apple.com/search?term=" + encodeURIComponent(q) + "&entity=album&limit=8");
        const data = await res.json();
        setOrderResults((data.results || []).map((r) => ({
          source: "itunes", id: r.collectionId, name: r.collectionName, artist: r.artistName,
          year: r.releaseDate ? r.releaseDate.slice(0, 4) : null, trackCount: r.trackCount,
          coverUrl: r.artworkUrl100 || null,
        })));
      }
    } catch (e) {
      alert("Search failed: " + e.message);
    }
    setOrderBusy(false);
  }

      ? `Remove "${label}" from this soundtrack? The original stays in its own soundtrack.`
