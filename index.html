<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
  li { padding: 8px; cursor: pointer; border-bottom: 1px solid #ddd; }
  li:hover { background: #f0f0f0; }
  audio { width: 100%; margin-top: 20px; }
</style>
</head>
<body>

<h2 id="page-title">My Music</h2>
<button id="back-btn" style="display:none;">Back to soundtracks</button>
<img id="cover" style="display:none; width:100%; margin-top:12px; border-radius:8px;">
<ul id="list">Loading...</ul>
<audio id="player" controls></audio>

<style>
  .folder-item { display: flex; align-items: center; gap: 10px; }
  .folder-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; background: #ddd; }
  .track-item.playing { background: #dff0d8; font-weight: bold; }
</style>

<script>
  // CHANGE THIS to your deployed worker URL
  const WORKER_URL = "https://my-music-worker.noahnator-workers.workers.dev";

  let token = sessionStorage.getItem("auth_token");
  if (!token) {
    token = prompt("Enter password:");
    sessionStorage.setItem("auth_token", token);
  }

  const listEl = document.getElementById("list");
  const coverEl = document.getElementById("cover");
  const backBtn = document.getElementById("back-btn");
  const titleEl = document.getElementById("page-title");
  const player = document.getElementById("player");

  let currentTracks = [];   // tracks in the currently open soundtrack
  let currentIndex = -1;    // index of track currently playing

  backBtn.onclick = () => loadSoundtracks();

  async function authedFetch(path) {
    const res = await fetch(WORKER_URL + path, {
      headers: { "X-Auth-Token": token },
    });
    if (!res.ok) {
      listEl.textContent = "Auth failed. Refresh and re-enter password.";
      sessionStorage.removeItem("auth_token");
      throw new Error("auth failed");
    }
    return res.json();
  }

  function streamUrl(key) {
    return `${WORKER_URL}/api/stream/${encodeURIComponent(key)}?token=${encodeURIComponent(token)}`;
  }

  async function loadSoundtracks() {
    titleEl.textContent = "My Music";
    backBtn.style.display = "none";
    coverEl.style.display = "none";
    listEl.innerHTML = "Loading...";
    currentTracks = [];
    currentIndex = -1;

    const folders = await authedFetch("/api/soundtracks");
    listEl.innerHTML = "";

    folders.forEach((folder) => {
      const li = document.createElement("li");
      li.className = "folder-item";

      const thumb = document.createElement("img");
      thumb.className = "folder-thumb";
      if (folder.cover) thumb.src = streamUrl(folder.cover);

      const label = document.createElement("span");
      label.textContent = folder.name;

      li.appendChild(thumb);
      li.appendChild(label);
      li.onclick = () => loadSoundtrack(folder.name);
      listEl.appendChild(li);
    });
  }

  async function loadSoundtrack(folder) {
    titleEl.textContent = folder;
    backBtn.style.display = "inline-block";
    listEl.innerHTML = "Loading...";

    const data = await authedFetch("/api/soundtracks/" + encodeURIComponent(folder));
    currentTracks = data.tracks;
    currentIndex = -1;

    if (data.cover) {
      coverEl.src = streamUrl(data.cover);
      coverEl.style.display = "block";
    } else {
      coverEl.style.display = "none";
    }

    renderTrackList();
  }

  function renderTrackList() {
    listEl.innerHTML = "";
    currentTracks.forEach((track, i) => {
      const li = document.createElement("li");
      li.className = "track-item" + (i === currentIndex ? " playing" : "");
      li.textContent = track.name;
      li.onclick = () => playTrackAt(i);
      listEl.appendChild(li);
    });
  }

  function playTrackAt(i) {
    if (i < 0 || i >= currentTracks.length) return; // reached end, stop
    currentIndex = i;
    player.src = streamUrl(currentTracks[i].key);
    player.play();
    renderTrackList();
  }

  // auto-play next track when current one finishes
  player.addEventListener("ended", () => {
    playTrackAt(currentIndex + 1);
  });

  loadSoundtracks();
</script>

</body>
</html>
