<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#121212">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #121212;
    --sidebar-bg: #000000;
    --panel-bg: #181818;
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --accent: #3fb950;
    --hover: #2a2a2a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #root { height: 100vh; height: 100dvh; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .app-body { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    padding: 16px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  .sidebar-header h1 {
    margin: 0;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .add-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 4px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }

  .add-btn:hover { color: var(--text); border-color: #666; }

  .search-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-wrap { position: relative; margin-bottom: 12px; }

  .search-input {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 7px 26px 7px 10px;
    border-radius: 16px;
    font-size: 13px;
  }

  .search-input:focus { outline: none; border-color: var(--accent); }

  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 2px;
  }

  .search-clear-btn:hover { color: var(--text); }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
    margin-bottom: 12px;
    background: #181818;
    border-radius: 6px;
  }

  .add-form input[type="text"] {
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  .add-form input[type="file"] { color: var(--text-dim); font-size: 12px; }

  .add-form button {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .add-form button:disabled { opacity: 0.6; cursor: default; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }

  .modal-panel {
    background: #181818;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    width: 360px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .modal-header h3 { margin: 0; font-size: 16px; }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
  }

  .modal-close:hover { color: var(--text); }

  .lookup-buttons { display: flex; gap: 6px; }
  .lookup-buttons button { flex: 1; }

  .online-results {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 160px;
    overflow-y: auto;
  }

  .online-result, .online-selected {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
    background: #222;
  }

  .online-result:hover { background: #2a2a2a; }
  .online-selected { cursor: default; background: #20301f; }

  .online-result-thumb {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .online-result-name {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-result-sub {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-clear-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
    padding: 8px 8px 4px 8px;
  }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .folder-item:hover { background: var(--hover); }
  .folder-item.active { background: var(--hover); }
  .folder-item:active { cursor: grabbing; }
  .folder-item.nested { padding-left: 24px; }

  .category-arrow { color: var(--text-dim); font-size: 10px; width: 10px; flex-shrink: 0; }

  .category-icon {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: #2a2a2a;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .folder-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .folder-name {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ep-progress { height: 3px; width: 120px; max-width: 60%; background: #3a3a3a; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .ep-progress-fill { height: 100%; background: var(--accent); transition: width 0.3s linear; }
  .ep-meta { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .ep-done { opacity: 0.55; }

  .folder-flag {
    font-size: 10px; color: var(--text-dim); border: 1px solid #444; border-radius: 8px;
    padding: 0 6px; margin-left: auto; flex-shrink: 0; white-space: nowrap;
  }

  .folder-playing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: auto;
    flex-shrink: 0;
  }

  .drag-handle { color: #555; font-size: 14px; cursor: grab; flex-shrink: 0; }

  .marquee-wrap { overflow: hidden; white-space: nowrap; position: relative; }

  .marquee-wrap.overflowing .marquee-inner {
    display: inline-block;
    animation: marquee 16s linear infinite;
    padding-right: 40px;
  }

  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .main { flex: 1; background: var(--panel-bg); overflow-y: auto; padding: 24px 32px; }

  .main-empty {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 60px;
    text-align: center;
  }

  .main-header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }

  .main-cover {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    background: #333;
    flex-shrink: 0;
  }

  .main-title { font-size: 28px; font-weight: 700; margin: 0; }
  .main-subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

  .add-tracks-btn {
    display: inline-block;
    color: var(--text-dim);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
    background: transparent;
    font-family: inherit;
  }

  .add-tracks-btn:hover { color: var(--text); border-color: #666; }

  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .track-row:hover { background: var(--hover); }
  .track-row.playing { color: var(--accent); }

  .track-index { width: 20px; color: var(--text-dim); text-align: right; flex-shrink: 0; }

  .track-thumb {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 3px;
    background: #333;
    flex-shrink: 0;
  }

  .bottom-bar {
    height: 90px;
    background: #181818;
    border-top: 1px solid #282828;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .bar-divider {
    width: 1px;
    height: 32px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-info {
    width: 220px;
    flex-shrink: 1;
    min-width: 140px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .now-playing-cover {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-track { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing-folder { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .play-pause-btn {
    background: var(--text);
    color: #000;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-pause-btn:disabled { opacity: 0.4; cursor: default; }

  .skip-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
  }

  .skip-btn:hover:not(:disabled) { color: var(--text); }
  .skip-btn:disabled { opacity: 0.3; cursor: default; }

  .transport {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 80px;
  }

  .time-label {
    font-size: 11px;
    color: var(--text-dim);
    width: 34px;
    flex-shrink: 0;
    text-align: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    height: 16px;
    min-width: 0;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--range-progress, 0%), #4a4a4a var(--range-progress, 0%));
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    background: #4a4a4a;
    border-radius: 2px;
  }

  input[type="range"]::-moz-range-progress {
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    margin-top: -4px;
    box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }

  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    border: none;
    box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }

  input[type="range"]:disabled::-webkit-slider-thumb { background: #666; }
  input[type="range"]:disabled { cursor: default; }

  .seek-bar { flex: 1; }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 130px;
    flex-shrink: 0;
  }

  .volume-icon { font-size: 14px; flex-shrink: 0; }
  .volume-bar { flex: 1; min-width: 0; }
  .volume-percent { font-size: 11px; color: var(--text-dim); width: 30px; flex-shrink: 0; text-align: right; display: flex; align-items: center; justify-content: flex-end; }

  .volume-percent-input {
    width: 20px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    text-align: right;
    padding: 0;
  }

  .volume-percent-input:focus {
    outline: none;
    color: var(--text);
  }

  .loop-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 16px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .loop-btn.active { border-color: var(--accent); color: var(--accent); }

  .context-menu {
    position: fixed;
    background: #282828;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 4px;
    z-index: 1000;
    min-width: 170px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .context-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .context-item:hover { background: var(--hover); }
  .context-item.danger { color: #f87171; }
  .context-item.danger:hover { background: rgba(248,113,113,0.1); }


  .mobile-topbar, .drawer-backdrop { display: none; }

  @media (max-width: 700px) {
    body { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .mobile-topbar {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
      background: #000; border-bottom: 1px solid #282828;
    }
    .mobile-menu-btn {
      background: transparent; border: 1px solid #444; color: var(--text);
      border-radius: 16px; padding: 6px 14px; font-size: 13px; font-family: inherit;
    }
    .mobile-topbar-title { font-size: 14px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 85vw; max-width: 340px;
      z-index: 900; transform: translateX(-100%); transition: transform 0.2s ease;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-backdrop {
      display: block; position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .main { padding: 16px; }
    .main-header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .main-cover { width: 120px; height: 120px; }
    .main-title { font-size: 22px; }
    .track-row { padding: 12px 8px; gap: 10px; }
    .modal-panel { width: 94vw !important; max-width: 94vw !important; max-height: 90dvh; overflow-y: auto; }
    input, select, textarea { font-size: 16px; } /* stops iOS zoom on focus */

    .bottom-bar {
      height: auto; display: grid; grid-template-columns: 1fr auto auto auto;
      grid-auto-rows: auto; align-items: center; gap: 6px 4px;
      padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      overflow: visible;
    }
    .bottom-bar .now-playing-info { grid-column: 1; grid-row: 1; width: auto; min-width: 0; }
    .bottom-bar .skip-btn, .bottom-bar .play-pause-btn { grid-row: 1; }
    .bottom-bar .skip-btn { width: 40px; height: 40px; font-size: 20px; }
    .bottom-bar .play-pause-btn { width: 44px; height: 44px; font-size: 16px; }
    .bottom-bar .transport { grid-column: 1 / -1; grid-row: 2; }
    .bottom-bar .loop-btn:nth-of-type(1) { grid-column: 1 / 3; grid-row: 3; }
    .bottom-bar .loop-btn:nth-of-type(2) { grid-column: 3 / 5; grid-row: 3; }
    .bottom-bar .loop-btn { padding: 8px 10px; }
    .bottom-bar .bar-divider, .bottom-bar .volume-control { display: none; }
    input[type="range"] { height: 28px; }
    .context-menu { max-width: 80vw; }
    .context-item { padding: 12px 14px; font-size: 15px; }
  }


  .transfer-wrap {
    background: #101010; border-top: 1px solid #282828; padding: 6px 16px;
    display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
  }
  .transfer-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); }
  .transfer-label { flex: 0 1 38%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transfer-track { flex: 1; height: 4px; background: #4a4a4a; border-radius: 2px; overflow: hidden; min-width: 40px; }
  .transfer-fill { height: 100%; background: var(--accent); transition: width 0.15s linear; }
  .transfer-pct { width: 36px; text-align: right; flex-shrink: 0; }
  .transfer-detail { flex-shrink: 0; white-space: nowrap; }
  @media (max-width: 700px) {
    .transfer-wrap { padding: 6px 12px; }
    .transfer-label { flex-basis: 45%; }
    .transfer-detail { display: none; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
</style>
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// CHANGE THIS to your deployed worker URL
const WORKER_URL = "https://my-music-worker.noahnator-workers.workers.dev";

function stripExt(filename) {
  return filename.replace(/\.(mp3|m4a|m4b|aac|wav|flac|ogg|oga|opus|wma|aif|aiff|mp4|webm)$/i, "");
}

// per-episode listening progress, kept in this browser's localStorage
function readProg(key) {
  try {
    return {
      pos: parseInt(localStorage.getItem("pos:" + key) || "0", 10),
      dur: parseFloat(localStorage.getItem("dur:" + key) || "0"),
      done: localStorage.getItem("done:" + key) === "1",
    };
  } catch (e) { return { pos: 0, dur: 0, done: false }; }
}
// Listening progress is kept only in this browser and capped: once more than PROG_MAX episodes have saved progress,
// the least recently listened ones are dropped first (FIFO). Change this number to keep more or fewer.
const PROG_MAX = 100;
function pruneProg(touchKey) {
  try {
    let idx = JSON.parse(localStorage.getItem("prog:index") || "[]");
    if (!Array.isArray(idx)) idx = [];
    if (!touchKey) {
      // on startup, adopt progress saved before the index existed (treated as the oldest)
      const known = new Set(idx);
      const found = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        const m = k && k.match(/^(pos|dur|done):(.+)$/);
        if (m && !known.has(m[2]) && !found.includes(m[2])) found.push(m[2]);
      }
      idx = [...found, ...idx];
    } else {
      idx = idx.filter((k) => k !== touchKey).concat(touchKey); // most recent goes to the end
    }
    while (idx.length > PROG_MAX) {
      const old = idx.shift();
      ["pos:", "dur:", "done:", "t:"].forEach((p) => localStorage.removeItem(p + old));
    }
    localStorage.setItem("prog:index", JSON.stringify(idx));
  } catch (e) {}
}

// writes progress to this browser (the offline copy; the server is the source of truth when online)
function saveProg(key, patch) {
  try {
    const next = { ...readProg(key), ...patch };
    if (next.pos > 0) localStorage.setItem("pos:" + key, String(Math.floor(next.pos))); else localStorage.removeItem("pos:" + key);
    if (next.dur > 0) localStorage.setItem("dur:" + key, String(Math.floor(next.dur)));
    if (next.done) localStorage.setItem("done:" + key, "1"); else localStorage.removeItem("done:" + key);
    pruneProg(key);
  } catch (e) {}
}

function fmtLeft(sec) {
  const m = Math.max(1, Math.ceil(sec / 60));
  return m >= 60 ? Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m left" : m + "m left";
}

// ---- official track order matching (used by "Try Order") ----
function normTitle(str, stripNum) {
  let t = stripExt(String(str || "")).toLowerCase();
  if (stripNum) t = t.replace(/^\s*\d{1,3}[\s.\-_)]+/, ""); // leading track number in a filename: "03 - Name"
  return t.replace(/\(.*?\)|\[.*?\]/g, " ").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
}
function titleScore(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (Math.min(a.length, b.length) >= 3 && (a.includes(b) || b.includes(a))) return 0.9;
  const wa = new Set(a.split(" ")), wb = new Set(b.split(" "));
  let common = 0;
  wa.forEach((w) => { if (wb.has(w)) common++; });
  return common / (wa.size + wb.size - common);
}
// official: [{ title }] in official order; tracks: your tracks. Returns { rows, matched } where rows follow the official order,
// and files with no match are appended at the end in their current order.
function matchOfficialOrder(tracks, official) {
  const off = official.map((o) => ({ ...o, norms: [o.title, ...(o.alts || [])].map((t) => normTitle(t, false)) }));
  const files = tracks.map((t) => ({ t, norm: normTitle(t.name, true) }));
  const pairs = [];
  off.forEach((o, oi) => files.forEach((f, fi) => {
    const sc = Math.max(...o.norms.map((n) => titleScore(f.norm, n)));
    if (sc >= 0.6) pairs.push({ oi, fi, sc });
  }));
  pairs.sort((a, b) => b.sc - a.sc || Math.abs(a.oi - a.fi) - Math.abs(b.oi - b.fi));
  const offTaken = {}, fileTaken = {}, byOff = {};
  pairs.forEach((p) => {
    if (offTaken[p.oi] || fileTaken[p.fi]) return;
    offTaken[p.oi] = true; fileTaken[p.fi] = true; byOff[p.oi] = p.fi;
  });
  const rows = [];
  off.forEach((o, oi) => { if (byOff[oi] !== undefined) rows.push({ official: o.title, track: files[byOff[oi]].t }); });
  files.forEach((f, fi) => { if (!fileTaken[fi]) rows.push({ official: null, track: f.t }); });
  return { rows, matched: Object.keys(byOff).length };
}

const isExternal = (key) => /^https?:\/\//i.test(key || "");

// parses podcast RSS XML into { title, description, artist, cover, tracks } (tracks use the episode audio url as their key)
function parsePodcastFeed(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const channel = doc.querySelector("channel");
  if (doc.querySelector("parsererror") || !channel) throw new Error("That does not look like a podcast feed");
  const kids = (el) => Array.from(el.children);
  const child = (el, name) => kids(el).find((c) => c.localName === name);
  const txt = (el, name) => { const c = child(el, name); return c ? c.textContent.trim() : ""; };
  const https = (u) => (u || "").replace(/^http:\/\//i, "https://");

  let cover = "";
  const imgs = kids(channel).filter((c) => c.localName === "image");
  for (const im of imgs) {
    const href = im.getAttribute("href");
    if (href) { cover = href; break; }
    const u = child(im, "url");
    if (u && !cover) cover = u.textContent.trim();
  }

  const seen = new Set();
  let tracks = kids(channel).filter((c) => c.localName === "item").map((item) => {
    const enc = child(item, "enclosure");
    const url = enc ? https(enc.getAttribute("url")) : "";
    if (!url || seen.has(url)) return null;
    seen.add(url);
    const date = Date.parse(txt(item, "pubDate"));
    return { key: url, name: txt(item, "title") || "Episode", date: isNaN(date) ? 0 : date };
  }).filter(Boolean);
  if (tracks.every((t) => t.date)) tracks.sort((a, b) => b.date - a.date); // newest first
  tracks = tracks.slice(0, 300);

  return {
    title: txt(channel, "title"),
    description: txt(channel, "description").replace(/<[^>]*>/g, "").slice(0, 1000),
    artist: txt(channel, "author"),
    cover: https(cover),
    tracks,
  };
}

function applyOrder(items, orderKeys, getKey) {
  const byKey = {};
  items.forEach((item) => { byKey[getKey(item)] = item; });
  const ordered = orderKeys.filter((k) => byKey[k]).map((k) => byKey[k]);
  const remaining = items.filter((item) => !orderKeys.includes(getKey(item)));
  return [...ordered, ...remaining];
}

function Marquee({ text, className }) {
  const wrapRef = useRef(null);
  const [overflowing, setOverflowing] = useState(false);

  useEffect(() => {
    const el = wrapRef.current;
    if (el) setOverflowing(el.scrollWidth > el.clientWidth + 2);
  }, [text]);

  return (
    <div ref={wrapRef} className={"marquee-wrap" + (overflowing ? " overflowing" : "") + (className ? " " + className : "")}>
      <span className="marquee-inner">
        {text}
        {overflowing && <React.Fragment>&nbsp;&nbsp;&nbsp;&nbsp;{text}</React.Fragment>}
      </span>
    </div>
  );
}

    function onEnd(e) { cancel(); if (fired && e.cancelable) e.preventDefault(); } // swallow the click after a long-press

  // Online: positions are pushed to the Worker while you listen, and every other device simply shows what the server has.

  const loadPending = () => { try { return new Set(JSON.parse(localStorage.getItem("prog:pending") || "[]")); } catch (e) { return new Set(); } };
  const pendingProgRef = useRef(null);
  if (pendingProgRef.current === null) pendingProgRef.current = loadPending();

    try { localStorage.setItem("prog:pending", JSON.stringify(Array.from(pendingProgRef.current))); } catch (e) {}
  }

  function recordProg(key, patch) {
    saveProg(key, patch);
    pendingProgRef.current.add(key);
    persistPending();
    refreshProg(key);
  }

  function flushProgress(useBeacon) {
    const keys = Array.from(pendingProgRef.current);
    if (keys.length === 0) return;
    lastFlushRef.current = Date.now();
    const updates = keys.map((k) => { const p = readProg(k); return { key: k, pos: p.pos, dur: p.dur, done: p.done }; });
    const body = JSON.stringify({ updates });
    if (useBeacon && navigator.sendBeacon) {
      // text/plain keeps it a "simple" request so it can be sent while the page is closing; the token rides in the query string
      if (navigator.sendBeacon(WORKER_URL + "/api/progress?token=" + encodeURIComponent(token), new Blob([body], { type: "text/plain" }))) {
        keys.forEach((k) => pendingProgRef.current.delete(k));
        persistPending();
      }
      return;
    }
    fetch(WORKER_URL + "/api/progress", { method: "POST", headers: { "X-Auth-Token": token }, body, cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        keys.forEach((k) => {
          // only forget an episode if it hasn't changed again while the request was in flight
          const now = readProg(k);
          const sent = updates.find((u) => u.key === k);
          if (now.pos === sent.pos && now.done === sent.done) pendingProgRef.current.delete(k);
        });
        persistPending();
        setSyncStatus("Synced " + new Date().toLocaleTimeString());
      })
      .catch(() => setSyncStatus("Offline - progress is saved here and will sync when you are back online"));
  }

  // returns the server's entries (or null if offline); updates this browser's copy for every episode we have no unsent changes for
  async function pullProgress() {
    try {
      const res = await fetch(WORKER_URL + "/api/progress", { headers: { "X-Auth-Token": token }, cache: "no-store" });
      if (!res.ok) throw new Error();
      const entries = (await res.json()).entries || {};
      const changed = {};
      Object.entries(entries).forEach(([key, e]) => {
        if (pendingProgRef.current.has(key)) return; // we have newer changes still waiting to be sent
        if (key === playingKeyRef.current && audioRef.current && !audioRef.current.paused) return; // never fight the episode playing right now
        const cur = readProg(key);
        if (cur.pos === e.pos && cur.done === e.done && cur.dur === e.dur) return;
        try {
          if (e.pos > 0) localStorage.setItem("pos:" + key, String(e.pos)); else localStorage.removeItem("pos:" + key);
          if (e.dur > 0) localStorage.setItem("dur:" + key, String(e.dur));
          if (e.done) localStorage.setItem("done:" + key, "1"); else localStorage.removeItem("done:" + key);
          pruneProg(key);
        } catch (err) {}
        changed[key] = readProg(key);
      });
      if (Object.keys(changed).length) setProgressMap((m) => ({ ...m, ...changed }));
      setSyncStatus("Synced " + new Date().toLocaleTimeString());
      return entries;
    } catch (e) {
      setSyncStatus("Offline - progress is saved here and will sync when you are back online");
      return null;
    }
  }

  // ---- offline downloads ----

  const OFFLINE_CACHE = "music-offline-v1";
  const lastBlobUrlRef = useRef(null);

  function offlineKeys(soundtrack) {
    const keys = soundtrack.tracks.map((t) => t.key);
    if (soundtrack.cover) keys.push(soundtrack.cover);

  }

  async function isDownloaded(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    const results = await Promise.all(offlineKeys(soundtrack).map((k) => cache.match(k)));
    return results.length > 0 && results.every((r) => r);
  }

  async function downloadSoundtrack(soundtrack, onProgress) {
    const cache = await caches.open(OFFLINE_CACHE);
    const keys = offlineKeys(soundtrack);
    for (let i = 0; i < keys.length; i++) {
      const res = await fetch(streamUrl(keys[i]));
      if (!res.ok) throw new Error("Download failed (" + res.status + ")");
      const type = res.headers.get("Content-Type") || "";
      const total = parseInt(res.headers.get("Content-Length") || "0", 10);
      let blob;
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const chunks = [];
        let loaded = 0;
        if (onProgress) onProgress({ index: i + 1, count: keys.length, name: keys[i], loaded: 0, total });
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          if (onProgress) onProgress({ index: i + 1, count: keys.length, name: keys[i], loaded, total });
        }
        blob = new Blob(chunks, { type });
      } else {
        blob = await res.blob();
      }
      await cache.put(keys[i], new Response(blob, { status: 200, headers: { "Content-Type": type } }));
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }

  async function removeDownload(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    for (const key of offlineKeys(soundtrack)) await cache.delete(key);
  }

  async function getPlayableUrl(key) {
    if (isExternal(key)) return key;
    const cache = await caches.open(OFFLINE_CACHE);
    const cached = await cache.match(key);
    if (cached) {
      const blob = await cached.blob();
      return URL.createObjectURL(blob);
    }
    return streamUrl(key);

  // ---- uploads ----

  const [uploadProgress, setUploadProgress] = useState(null);
  const [downloadProgress, setDownloadProgress] = useState(null);

  function fileLabel(key) {

  function fmtBytes(n) {
    if (!n) return "0 B";
    const u = ["B", "KB", "MB", "GB"];
    const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
    return (n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + " " + u[i];
  }

  // overall percent for a progress object; downloads only know per-file size, uploads know the batch size
  function overallPct(p) {
    if (p.batch) return p.total ? Math.min(100, (p.loaded / p.total) * 100) : 0;
    const frac = p.total ? Math.min(1, p.loaded / p.total) : 0;
    return Math.min(100, ((p.index - 1 + frac) / p.count) * 100);
  }

  // single file upload via XHR so we get byte-level progress (fetch can't report upload progress)
  function uploadFile(id, file, onBytes) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", WORKER_URL + "/api/upload?id=" + encodeURIComponent(id));
      xhr.setRequestHeader("X-Auth-Token", token);
      xhr.setRequestHeader("X-Filename", file.name);
      xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
      if (onBytes) xhr.upload.onprogress = (e) => onBytes(e.loaded);
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) return resolve();
        if (xhr.status === 401 || xhr.status === 403) {
          sessionStorage.removeItem("auth_token");
          setError("Auth failed. Refresh and re-enter password.");
        }
        reject(new Error("upload failed (" + xhr.status + ")"));
      };
      xhr.onerror = () => reject(new Error("network error"));
      xhr.send(file);
    });
  }

  // upload several files with one combined progress bar
  async function uploadFiles(id, files) {
    const list = Array.from(files);
    const total = list.reduce((a, f) => a + f.size, 0) || 1;
    let base = 0;
    try {
      for (let i = 0; i < list.length; i++) {
        const f = list[i];
        const info = { batch: true, index: i + 1, count: list.length, name: f.name, total, label: "Uploading" };
        setUploadProgress({ ...info, loaded: base });
        await uploadFile(id, f, (l) => setUploadProgress({ ...info, loaded: base + l }));
        base += f.size;
      }
    } finally {
      setUploadProgress(null);
    }
  }

  function renderTransfer(kind, p) {
    const pct = Math.round(overallPct(p));
    const detail = p.batch
      ? fmtBytes(p.loaded) + " / " + fmtBytes(p.total)
      : (p.total ? fmtBytes(p.loaded) + " / " + fmtBytes(p.total) : fmtBytes(p.loaded));
    return (
      <div className="transfer-row" key={kind}>
        <div className="transfer-label">{kind} {p.index}/{p.count}: {p.name}</div>
        <div className="transfer-track"><div className="transfer-fill" style={{ width: pct + "%" }}></div></div>
        <div className="transfer-pct">{pct}%</div>
        <div className="transfer-detail">{detail}</div>
      </div>
    );
  }

  async function mbFetch(query) {

      throw new Error(res.status === 404
        ? "The Worker has no /api/musicbrainz endpoint yet. Run wrangler deploy with the new worker.js."

  async function handleOrderSearch(source) {
    const q = metaQuery.trim();
    if (!q) return;
    setMetaResults([]);
    setOrderResults([]);
    setOrderPreview(null);
    setMetaSearchAttempted(true);
    setOrderBusy(true);
    try {
      if (source === "musicbrainz") {
        const data = await mbFetch("search=" + encodeURIComponent(q));
        const mineCount = viewingId ? library.soundtracks[viewingId].tracks.length : 0;
        const seen = new Set();
        const list = [];
        (data.releases || []).forEach((r) => {
          const tc = r["track-count"] || 0;
          const key = (r.title || "").toLowerCase() + "|" + tc; // many editions of one album: keep the best-scoring one
          if (seen.has(key)) return;
          seen.add(key);
          list.push({
            source: "musicbrainz", id: r.id, name: r.title || "Untitled",
            artist: (r["artist-credit"] || []).map((a) => a.name).join(", "),
            year: r.date ? r.date.slice(0, 4) : null, trackCount: tc, coverUrl: null,
            score: r.score || 0, sameCount: tc === mineCount,
            note: tc === mineCount ? "same track count as yours" : "",
          });
        });
        list.sort((a, b) => (b.sameCount ? 1 : 0) - (a.sameCount ? 1 : 0) || b.score - a.score);
        setOrderResults(list.slice(0, 12));
      } else {
        const res = await fetch("https://itunes.apple.com/search?term=" + encodeURIComponent(q) + "&entity=album&limit=8");
        const data = await res.json();
        setOrderResults((data.results || []).map((r) => ({
          source: "itunes", id: r.collectionId, name: r.collectionName, artist: r.artistName,
          year: r.releaseDate ? r.releaseDate.slice(0, 4) : null, trackCount: r.trackCount,
          coverUrl: r.artworkUrl100 || null,
        })));
      }
    } catch (e) {
      alert("Search failed: " + e.message);
    }
    setOrderBusy(false);
  }

        (data.media || []).forEach((m) => (m.tracks || []).forEach((t) => { if (t.title) official.push({ title: t.title }); }));

  async function updateOrder(parentPath, newOrder) {
    setLibrary((prev) => ({ ...prev, order: { ...prev.order, [parentPath]: newOrder } }));
    await authedFetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parentPath, order: newOrder }),
    });
  }

  const allSoundtracks = Object.values(library.soundtracks);

  const viewingPlaylist = viewingPlaylistId ? library.playlists[viewingPlaylistId] : null;
  const viewingPlaylistTracks = viewingPlaylist
    ? viewingPlaylist.tracks
        .map((ref) => {
          const soundtrack = library.soundtracks[ref.soundtrackId];
          const track = soundtrack && soundtrack.tracks.find((t) => t.key === ref.key);
          return track ? { soundtrackId: ref.soundtrackId, soundtrack, track } : null;
        })
        .filter(Boolean)
    : [];

  const pinnedIds = library.order["_pinned"] || [];
  const pinnedItems = pinnedIds
    .map((id) => {
      if (library.soundtracks[id]) return { type: "soundtrack", ...library.soundtracks[id] };
      if (library.playlists[id]) return { type: "playlist", ...library.playlists[id] };
      if (library.folders[id]) return { type: "folder", ...library.folders[id] };
      return null;
    })
    .filter(Boolean);

  const searchResults = (() => {
    const q = searchQuery.trim().toLowerCase();
    if (!q) return null;

    const soundtrackMatches = allSoundtracks
      .filter((s) => s.name.toLowerCase().includes(q))
      .map((s) => ({ kind: "soundtrack", soundtrack: s }));

    const trackMatches = [];
    allSoundtracks.forEach((s) => {
      s.tracks.forEach((t) => {
        if (stripExt(t.name).toLowerCase().includes(q)) {
          trackMatches.push({ kind: "track", soundtrack: s, track: t });
        }
      });
    });

    return [...soundtrackMatches, ...trackMatches];
  })();

  // ---- drag and drop ----
  // dragRef stores { parentPath, index, meta: { type, id } } of the item currently being dragged.
  // parentPath is "" for top level, or a folder id for anything nested inside a folder.
  const dragRef = useRef(null);

  function handleDragStart(parentPath, index, meta) {
    dragRef.current = { parentPath, index, meta };
  }

  function handleDragOver(e) {
    e.preventDefault();
  }

  // dropping between/onto items in the SAME list -> pure reorder
  function handleDropReorder(parentPath, displayedItems, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag || drag.parentPath !== parentPath || drag.index === dropIndex) return;
    const newItems = [...displayedItems];
    const [moved] = newItems.splice(drag.index, 1);
    newItems.splice(dropIndex, 0, moved);
    updateOrder(parentPath, newItems.map((it) => it.id));
  }

  // dropping directly onto a folder row -> move soundtracks/playlists into that folder;
  // dropping a folder onto a folder either reorders (same list) or nests it inside (different list)
  function handleDropOnFolder(targetFolderId, parentPath, displayedItems, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag) return;

    if (drag.meta.type === "soundtrack" || drag.meta.type === "playlist") {
      moveItem(drag.meta.type, drag.meta.id, targetFolderId);
      return;
    }

    if (drag.meta.type === "folder") {
      if (drag.meta.id === targetFolderId) return;
      if (drag.parentPath === parentPath && drag.index !== dropIndex) {
        const newItems = [...displayedItems];
        const [moved] = newItems.splice(drag.index, 1);
        newItems.splice(dropIndex, 0, moved);
        updateOrder(parentPath, newItems.map((it) => it.id));
      } else {
        moveItem("folder", drag.meta.id, targetFolderId);
      }
    }
  }

  function toggleFolder(id) {
    setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
  }

  // recursively renders everything inside the given parentId ("" / null = top level)
  function renderItems(parentId, indentLevel) {
    const key = parentId || "";
    const childFolders = Object.values(library.folders).filter((f) => (f.parentId || null) === (parentId || null));
    const childSoundtracks = allSoundtracks.filter((s) => (s.parentId || null) === (parentId || null));
    const childPlaylists = Object.values(library.playlists).filter((pl) => (pl.parentId || null) === (parentId || null));

    const items = applyOrder(
      [
        ...childFolders.map((f) => ({ type: "folder", id: f.id, name: f.name })),
        ...childSoundtracks.map((s) => ({ type: "soundtrack", id: s.id, name: s.name, cover: s.cover })),
        ...childPlaylists.map((pl) => ({ type: "playlist", id: pl.id, name: pl.name, cover: pl.cover })),
      ],
      library.order[key] || [],
      (item) => item.id
    );

    return items.map((item, i) => {
      const meta = { type: item.type, id: item.id };
      const style = { paddingLeft: 8 + indentLevel * 16 };

      if (item.type === "folder") {
        const isOpen = !!expanded[item.id];
        return (
          <React.Fragment key={item.id}>
            <div
              className="folder-item"
              style={style}
              draggable
              onDragStart={() => handleDragStart(key, i, meta)}
              onDragOver={handleDragOver}
              onDrop={() => handleDropOnFolder(item.id, key, items, i)}
              onClick={() => toggleFolder(item.id)}
              onContextMenu={(e) => openContextMenu(e, { type: "folder", id: item.id })}
            >
              <span className="drag-handle">⠿</span>
              <span className="category-arrow">{isOpen ? "▼" : "▶"}</span>
              <div className="category-icon">📁</div>
              <span className="folder-name">{item.name}</span>
              {excludedIds.includes(item.id) && <span className="folder-flag">no random</span>}
            </div>
            {isOpen && renderItems(item.id, indentLevel + 1)}
          </React.Fragment>
        );
      }

      if (item.type === "playlist") {
        return (
          <div
            key={item.id}
            className={"folder-item" + (item.id === viewingPlaylistId ? " active" : "")}
            style={style}
            draggable
            onDragStart={() => handleDragStart(key, i, meta)}
            onDragOver={handleDragOver}
            onDrop={() => handleDropReorder(key, items, i)}
            onClick={() => openPlaylist(item.id)}
            onContextMenu={(e) => openContextMenu(e, { type: "playlist", id: item.id })}
          >
            <span className="drag-handle">⠿</span>
            {item.cover ? (
              <img className="folder-thumb" src={streamUrl(item.cover)} />
            ) : (
              <div className="category-icon">🎶</div>
            )}
            <span className="folder-name">{item.name}</span>
            {excludedIds.includes(item.id) && <span className="folder-flag">no random</span>}
          </div>
        );
      }

      // soundtrack
      return (
        <div
          key={item.id}
          className={"folder-item" + (item.id === viewingId ? " active" : "")}
          style={style}
          draggable
          onDragStart={() => handleDragStart(key, i, meta)}
          onDragOver={handleDragOver}
          onDrop={() => handleDropReorder(key, items, i)}
          onClick={() => openSoundtrack(item.id)}
          onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: item.id })}
        >
          <span className="drag-handle">⠿</span>
          <img className="folder-thumb" src={item.cover ? streamUrl(item.cover) : ""} />
          <span className="folder-name">{item.name}</span>
          {excludedIds.includes(item.id) && !item.feedUrl && <span className="folder-flag">no random</span>}
          {item.id === playingId && <div className="folder-playing-dot"></div>}
        </div>
      );
    });
  }

  // flattened folder list for the "create soundtrack in..." dropdown, indented by depth
  function flattenFolders(parentId, depth) {
    return Object.values(library.folders)
      .filter((f) => (f.parentId || null) === (parentId || null))
      .flatMap((f) => [{ ...f, depth }, ...flattenFolders(f.id, depth + 1)]);
  }
  const folderOptions = flattenFolders(null, 0);

  // ---- playback ----

  function playTrackAt(id, key, playlistId) {
    const soundtrack = library.soundtracks[id];
    if (!soundtrack || !soundtrack.tracks.some((t) => t.key === key)) return;
    setPlayingId(id);
    setPlayingKey(key);
    setPlayingPlaylistId(playlistId || null);
  }

  // when something finishes, pick a random soundtrack or playlist from the same parent folder (including inside its
  // subfolders), skipping anything excluded: excluded folders/playlists, and everything inside excluded folders.
  function playRandomNext(parentId, skipSoundtrackId, skipPlaylistId) {
    const pool = [];
    const same = (a) => (a || null) === (parentId || null);
    function walk(pid) {
      allSoundtracks.forEach((s) => {
        if ((s.parentId || null) === (pid || null) && s.id !== skipSoundtrackId && !excludedIds.includes(s.id) && !s.feedUrl && s.tracks.length > 0) pool.push({ type: "soundtrack", item: s });
      });
      Object.values(library.playlists).forEach((pl) => {
        if ((pl.parentId || null) !== (pid || null) || pl.id === skipPlaylistId || excludedIds.includes(pl.id)) return;
        const first = pl.tracks.find((r) => library.soundtracks[r.soundtrackId] && library.soundtracks[r.soundtrackId].tracks.some((t) => t.key === r.key));
        if (first) pool.push({ type: "playlist", item: pl, first });
      });
      Object.values(library.folders).forEach((f) => {
        if ((f.parentId || null) === (pid || null) && !excludedIds.includes(f.id)) walk(f.id);
      });
    }
    walk(parentId);
    if (pool.length === 0) return;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    if (pick.type === "playlist") {
      playTrackAt(pick.first.soundtrackId, pick.first.key, pick.item.id);
    } else {
      const st = pick.item;
      playTrackAt(st.id, st.tracks[Math.floor(Math.random() * st.tracks.length)].key, null);
    }
  }

  useEffect(() => {
    const soundtrack = playingId && library.soundtracks[playingId];
    const track = soundtrack && soundtrack.tracks.find((t) => t.key === playingKey);
    if (track && audioRef.current) {
      let cancelled = false;
      getPlayableUrl(track.key).then((url) => {
        if (cancelled) return;
        if (lastBlobUrlRef.current) {
          URL.revokeObjectURL(lastBlobUrlRef.current);
          lastBlobUrlRef.current = null;
        }
        if (url.startsWith("blob:")) lastBlobUrlRef.current = url;
        audioRef.current.src = url;
        audioRef.current.play();
      });
      return () => { cancelled = true; };
    }
  }, [playingKey, playingId]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.loop = loopTrack;
  }, [loopTrack]);

  playingKeyRef.current = playingKey;

  const [muted, setMuted] = useState(false);
  useEffect(() => { if (audioRef.current) audioRef.current.muted = muted; }, [muted]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = Math.pow(volumePercent / 100, 2);
    localStorage.setItem("volumePercent", volumePercent);
  }, [volumePercent]);

  const [volumeInput, setVolumeInput] = useState(null);

  function commitVolumeInput() {
    if (volumeInput === null) return;
    const parsed = parseInt(volumeInput, 10);
    if (!isNaN(parsed)) setVolumePercent(Math.max(0, Math.min(100, parsed)));
    setVolumeInput(null);
  }

  function handleSeek(value) {
    if (audioRef.current) audioRef.current.currentTime = value;
    setCurrentTime(value);
  }

  function togglePlayPause() {
    if (!audioRef.current) return;
    if (audioRef.current.paused) audioRef.current.play();
    else audioRef.current.pause();
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function handlePrevious() {
    if (playingPlaylistId) {
      const playlist = library.playlists[playingPlaylistId];
      if (!playlist) return;
      const refs = playlist.tracks;
      const currentIdx = refs.findIndex((t) => t.soundtrackId === playingId && t.key === playingKey);
      const prev = refs[currentIdx - 1];
      if (prev && library.soundtracks[prev.soundtrackId]) {
        playTrackAt(prev.soundtrackId, prev.key, playingPlaylistId);
      }
      return;
    }

    const soundtrack = playingId && library.soundtracks[playingId];
    if (!soundtrack) return;
    const currentIndex = soundtrack.tracks.findIndex((t) => t.key === playingKey);
    const prevTrack = soundtrack.tracks[currentIndex - 1];
    if (prevTrack) playTrackAt(playingId, prevTrack.key);
  }

  function handleEnded() {
    if (loopTrack) return;
    if (isExternal(playingKey)) {
      recordProg(playingKey, { pos: 0, done: true });
      flushProgress(false);
    }

    if (playingPlaylistId) {
      const playlist = library.playlists[playingPlaylistId];
      if (playlist) {
        const refs = playlist.tracks;
        const currentIdx = refs.findIndex((t) => t.soundtrackId === playingId && t.key === playingKey);
        const next = refs[currentIdx + 1];
        if (next && library.soundtracks[next.soundtrackId] && library.soundtracks[next.soundtrackId].tracks.some((t) => t.key === next.key)) {
          playTrackAt(next.soundtrackId, next.key, playingPlaylistId);
          return;
        }
        // playlist finished - continue with a random pick from the same folder
        playRandomNext(playlist.parentId, null, playlist.id);
      }
      return;
    }

    const soundtrack = playingId && library.soundtracks[playingId];
    if (!soundtrack) return;
    const currentIndex = soundtrack.tracks.findIndex((t) => t.key === playingKey);

    if (shuffle && soundtrack.tracks.length > 1) {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * soundtrack.tracks.length);
      } while (nextIndex === currentIndex);
      playTrackAt(playingId, soundtrack.tracks[nextIndex].key);
      return;
    }

    const nextTrack = soundtrack.tracks[currentIndex + 1];
    if (nextTrack) {
      playTrackAt(playingId, nextTrack.key);
      return;
    }

    if (soundtrack.feedUrl) return; // podcasts just stop at the last episode
    // reached the end of this soundtrack - continue with a random pick from the same folder
    playRandomNext(soundtrack.parentId, soundtrack.id, null);
  }

  // ---- track reordering ----

  async function reorderTracks(id, order) {
    setLibrary((prev) => {
      const soundtrack = prev.soundtracks[id];
      if (!soundtrack) return prev;
      const byKey = {};
      soundtrack.tracks.forEach((t) => { byKey[t.key] = t; });
      const newTracks = order.map((k) => byKey[k]).filter(Boolean);
      return { ...prev, soundtracks: { ...prev.soundtracks, [id]: { ...soundtrack, tracks: newTracks } } };
    });
    await authedFetch("/api/reorder-tracks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, order }),
    });
  }

  const trackDragRef = useRef(null);

  function handleTrackDragStart(i) {
    trackDragRef.current = i;
  }

  function handleTrackDrop(i, tracks) {
    const from = trackDragRef.current;
    trackDragRef.current = null;
    if (from === null || from === i) return;
    const newTracks = [...tracks];
    const [moved] = newTracks.splice(from, 1);
    newTracks.splice(i, 0, moved);
    reorderTracks(viewingId, newTracks.map((t) => t.key));
  }

  // ---- downloads for currently viewed soundtrack ----

  const viewingSoundtrackForEffect = viewingId ? library.soundtracks[viewingId] : null;

  useEffect(() => {
    let cancelled = false;
    if (viewingSoundtrackForEffect) {
      isDownloaded(viewingSoundtrackForEffect).then((result) => {
        if (!cancelled) setIsViewingDownloaded(result);
      });
    } else {
      setIsViewingDownloaded(false);
    }
    return () => { cancelled = true; };
  }, [viewingId, viewingSoundtrackForEffect]);

  async function handleDownload() {
    if (!viewingSoundtrackForEffect) return;
    const st = viewingSoundtrackForEffect;
    setDownloadStatus("Starting...");
    setDownloadProgress({ index: 0, count: offlineKeys(st).length, name: st.name, loaded: 0, total: 0, label: st.name });
    try {
      await downloadSoundtrack(st, (p) => {
        setDownloadProgress({ ...p, name: fileLabel(p.name), label: st.name });
        setDownloadStatus(Math.round(overallPct(p)) + "%");
      });
      setIsViewingDownloaded(true);
    } catch (e) {
      alert("Download failed: " + e.message);
    } finally {
      setDownloadStatus(null);
      setDownloadProgress(null);
    }
  }

  async function handleRemoveDownload() {
    if (!viewingSoundtrackForEffect) return;
    await removeDownload(viewingSoundtrackForEffect);
    setIsViewingDownloaded(false);
  }

  // ---- context menu ----

  const [contextMenu, setContextMenu] = useState(null);
  const [playlistPickerFor, setPlaylistPickerFor] = useState(null);

  useEffect(() => {
    function closeMenu() { setContextMenu(null); setPlaylistPickerFor(null); }
    window.addEventListener("click", closeMenu);
    return () => window.removeEventListener("click", closeMenu);
  }, []);

  function openContextMenu(e, target) {
    e.preventDefault();
    e.stopPropagation();
    setContextMenu({ x: e.clientX, y: e.clientY, target });
  }

  if (error) {
    return <div style={{padding: 24, color: "#fff"}}>{error}</div>;
  }

  const viewingSoundtrack = viewingId ? library.soundtracks[viewingId] : null;
  const playingSoundtrack = playingId ? library.soundtracks[playingId] : null;
  const hasNowPlaying = playingSoundtrack && playingKey !== null;
  const playingTrack = playingSoundtrack ? playingSoundtrack.tracks.find((t) => t.key === playingKey) : null;

  return (
    <div className="app">
      <div className="mobile-topbar">
        <button className="mobile-menu-btn" onClick={() => setSidebarOpen(true)}>Library</button>
        <div className="mobile-topbar-title">
          {viewingPlaylist ? viewingPlaylist.name : viewingSoundtrack ? viewingSoundtrack.name : "My Music"}
        </div>
      </div>
      <div className={"drawer-backdrop" + (sidebarOpen ? " open" : "")} onClick={() => setSidebarOpen(false)}></div>
      <div className="app-body">

        <div
          className={"sidebar" + (sidebarOpen ? " open" : "")}
          onContextMenu={(e) => openContextMenu(e, { type: "empty" })}
          onDragOver={handleDragOver}
          onDrop={() => {
            // only fires if no nested item's own onDrop already handled and cleared the drag (see handleDrop*),
            // so this only triggers for drops on truly empty sidebar space - moves the dragged item to the top level
            const drag = dragRef.current;
            dragRef.current = null;
            if (drag && drag.parentPath !== "_pinned") moveItem(drag.meta.type, drag.meta.id, null);
          }}
        >
          <div className="sidebar-header">
            <h1>Library</h1>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="add-btn" style={{ width: "auto", padding: "0 8px", fontSize: 12 }} onClick={() => openPodcastModal(null)}>Podcast</button>
              <button className="add-btn" onClick={() => setShowAddForm(!showAddForm)}>+</button>
            </div>
          </div>

          <div className="search-wrap">
            <input
              type="text"
              className="search-input"
              placeholder="Search library..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
            />
            {searchQuery && <button className="search-clear-btn" onClick={() => setSearchQuery("")}>✕</button>}
          </div>

          {showAddForm && (
            <div className="add-form">
              <select value={newParentId} onChange={(e) => setNewParentId(e.target.value)}>
                <option value="">(Top level)</option>
                {folderOptions.map((f) => (
                  <option key={f.id} value={f.id}>{"—".repeat(f.depth) + " " + f.name}</option>
                ))}
              </select>
              <input type="text" placeholder="Soundtrack name" value={newName} onChange={(e) => setNewName(e.target.value)} />

              <div className="lookup-buttons">
                <button type="button" onClick={handleSearchOnline} disabled={!newName || onlineSearching}>
                  {onlineSearching ? "Searching..." : "🎵 iTunes"}
                </button>
                <button type="button" onClick={handleSearchIgdb} disabled={!newName || onlineSearching}>
                  {onlineSearching ? "Searching..." : "🎮 IGDB"}
                </button>
              </div>

              {onlineResults.length > 0 && (
                <div className="online-results">
                  {onlineResults.map((r, i) => (
                    <div key={i} className="online-result" onClick={() => pickOnlineResult(r)}>
                      {r.coverUrl && <img src={r.coverUrl} className="online-result-thumb" />}
                      <div style={{ minWidth: 0 }}>
                        <div className="online-result-name">{r.name}</div>
                        <div className="online-result-sub">{r.artist}{r.year ? ` · ${r.year}` : ""}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {selectedOnline && (
                <div className="online-selected">
                  {selectedOnline.coverUrl && <img src={selectedOnline.coverUrl} className="online-result-thumb" />}
                  <div style={{ minWidth: 0 }}>
                    <div className="online-result-name">Using: {selectedOnline.name}</div>
                    <div className="online-result-sub">{selectedOnline.artist}{selectedOnline.year ? ` · ${selectedOnline.year}` : ""}</div>
                  </div>
                  <button type="button" className="online-clear-btn" onClick={() => setSelectedOnline(null)}>✕</button>
                </div>
              )}

              <input type="file" multiple accept="audio/*,image/*" onChange={(e) => setNewFiles(e.target.files)} />
              <button onClick={handleCreateSoundtrack} disabled={uploading}>{uploading ? "Uploading..." : "Create"}</button>
            </div>
          )}

          {searchResults ? (
            <React.Fragment>
              <div className="section-label">{searchResults.length} result{searchResults.length === 1 ? "" : "s"}</div>
              {searchResults.map((r) => {
                if (r.kind === "soundtrack") {
                  const s = r.soundtrack;
                  return (
                    <div
                      key={"search-st-" + s.id}
                      className={"folder-item" + (s.id === viewingId ? " active" : "")}
                      onClick={() => openSoundtrack(s.id)}
                      onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: s.id })}
                    >
                      <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                      <span className="folder-name">{s.name}</span>
                      {s.id === playingId && <div className="folder-playing-dot"></div>}
                    </div>
                  );
                }
                const s = r.soundtrack;
                return (
                  <div
                    key={"search-tr-" + r.track.key}
                    className="folder-item"
                    onClick={() => { openSoundtrack(s.id); playTrackAt(s.id, r.track.key); }}
                  >
                    <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                    <div style={{ minWidth: 0, overflow: "hidden" }}>
                      <div className="folder-name">{stripExt(r.track.name)}</div>
                      <div className="search-subtitle">{s.name}</div>
                    </div>
                    {s.id === playingId && r.track.key === playingKey && <div className="folder-playing-dot"></div>}
                  </div>
                );
              })}
            </React.Fragment>
          ) : (
            <React.Fragment>
              {pinnedItems.length > 0 && (
                <React.Fragment>
                  <div className="section-label">Pinned</div>
                  {pinnedItems.map((p, pi) => {
                    const pmeta = { type: p.type, id: p.id };
                    const dragProps = {
                      draggable: true,
                      onDragStart: () => handleDragStart("_pinned", pi, pmeta),
                      onDragOver: handleDragOver,
                      onDrop: () => handleDropReorder("_pinned", pinnedItems, pi),
                      onContextMenu: (e) => openContextMenu(e, { type: p.type, id: p.id, pinned: true }),
                    };
                    if (p.type === "folder") {
                      const pinOpen = !!expanded["pin:" + p.id];
                      return (
                        <React.Fragment key={"pin-" + p.id}>
                          <div className="folder-item" {...dragProps} onClick={() => setExpanded((prev) => ({ ...prev, ["pin:" + p.id]: !prev["pin:" + p.id] }))}>
                            <span className="drag-handle">⠿</span>
                            <span className="category-arrow">{pinOpen ? "▼" : "▶"}</span>
                            <div className="category-icon">📁</div>
                            <span className="folder-name">{p.name}</span>
                            {excludedIds.includes(p.id) && !p.feedUrl && <span className="folder-flag">no random</span>}
                          </div>
                          {pinOpen && renderItems(p.id, 1)}
                        </React.Fragment>
                      );
                    }
                    return (
                      <div
                        key={"pin-" + p.id}
                        className={"folder-item" + ((p.type === "soundtrack" ? p.id === viewingId : p.id === viewingPlaylistId) ? " active" : "")}
                        {...dragProps}
                        onClick={() => (p.type === "soundtrack" ? openSoundtrack(p.id) : openPlaylist(p.id))}
                      >
                        <span className="drag-handle">⠿</span>
                        {p.type === "soundtrack" ? (
                          <img className="folder-thumb" src={p.cover ? streamUrl(p.cover) : ""} />
                        ) : p.cover ? (
                          <img className="folder-thumb" src={streamUrl(p.cover)} />
                        ) : (
                          <div className="category-icon">🎶</div>
                        )}
                        <span className="folder-name">{p.name}</span>
                        {excludedIds.includes(p.id) && <span className="folder-flag">no random</span>}
                        {p.type === "soundtrack" && p.id === playingId && <div className="folder-playing-dot"></div>}
                      </div>
                    );
                  })}
                </React.Fragment>
              )}

              <div className="section-label">All</div>

              {renderItems(null, 0)}
            </React.Fragment>
          )}
        </div>

        <div className="main">
          {viewingPlaylist ? (
            <React.Fragment>
              <div className="main-header">
                {viewingPlaylist.cover ? (
                  <img className="main-cover" src={streamUrl(viewingPlaylist.cover)} />
                ) : (
                  <div className="category-icon main-cover" style={{fontSize: 40, display: "flex", alignItems: "center", justifyContent: "center"}}>🎶</div>
                )}
                <div>
                  <h2 className="main-title">{viewingPlaylist.name}</h2>
                  {viewingPlaylist.description && (
                    <div className="main-subtitle" style={{maxWidth: 500}}>{viewingPlaylist.description}</div>
                  )}
                </div>
              </div>
              <button className="add-tracks-btn" onClick={() => openEditModal("playlist", viewingPlaylistId)}>✏️ Edit</button>
              {viewingPlaylistTracks.length === 0 ? (
                <div className="main-empty" style={{marginTop: 20}}>
                  No tracks yet - right-click any track in your library and choose "Add to playlist...".
                </div>
              ) : (
                viewingPlaylistTracks.map(({ soundtrackId, soundtrack, track }) => {
                  const isPlaying = soundtrackId === playingId && track.key === playingKey;
                  return (
                    <div
                      key={soundtrackId + ":" + track.key}
                      className={"track-row" + (isPlaying ? " playing" : "")}
                      onClick={() => playTrackAt(soundtrackId, track.key, viewingPlaylistId)}
                      onContextMenu={(e) => openContextMenu(e, { type: "track", id: soundtrackId, key: track.key, playlistId: viewingPlaylistId })}
                    >
                      <img
                        className="track-thumb"
                        src={track.cover ? streamUrl(track.cover) : (soundtrack.cover ? streamUrl(soundtrack.cover) : "")}
                      />
                      <span className="track-index">{isPlaying ? "▶" : "♪"}</span>
                      <div style={{ minWidth: 0, overflow: "hidden" }}>

            const t = e.target.currentTime;
            setCurrentTime(t);
            if (isExternal(playingKey) && t > 5 && Date.now() - lastSavedAtRef.current >= 5000) {
              lastSavedAtRef.current = Date.now();
              recordProg(playingKey, { pos: t, dur: e.target.duration || 0, done: false });
              if (Date.now() - lastFlushRef.current >= 15000) flushProgress(false); // live push every ~15s of playback
            }
          }}
          onLoadedMetadata={(e) => {
            setDuration(e.target.duration);
            if (isExternal(playingKey)) {
              try {
                const saved = parseInt(localStorage.getItem("pos:" + playingKey) || "0", 10);
                if (saved > 5 && saved < e.target.duration - 10) e.target.currentTime = saved;
              } catch (err) {}
              const el = e.target, key = playingKey;
              pullProgress().then((entries) => {
                const srv = entries && entries[key];
                if (srv && !pendingProgRef.current.has(key) && playingKeyRef.current === key && srv.pos > 5 && srv.pos < el.duration - 10 && Math.abs(el.currentTime - srv.pos) > 3) {

                )
              )}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}
</script>

</body>
