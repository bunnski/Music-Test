<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Music</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#121212">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #121212;
    --sidebar-bg: #000000;
    --panel-bg: #181818;
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --accent: #3fb950;
    --hover: #2a2a2a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  #root { height: 100vh; }

  .app { display: flex; flex-direction: column; height: 100vh; }
  .app-body { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    padding: 16px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  .sidebar-header h1 {
    margin: 0;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .add-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 4px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }

  .add-btn:hover { color: var(--text); border-color: #666; }

  .search-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-wrap { position: relative; margin-bottom: 12px; }

  .search-input {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 7px 26px 7px 10px;
    border-radius: 16px;
    font-size: 13px;
  }

  .search-input:focus { outline: none; border-color: var(--accent); }

  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 2px;
  }

  .search-clear-btn:hover { color: var(--text); }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
    margin-bottom: 12px;
    background: #181818;
    border-radius: 6px;
  }

  .add-form input[type="text"] {
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  .add-form input[type="file"] { color: var(--text-dim); font-size: 12px; }

  .add-form button {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .add-form button:disabled { opacity: 0.6; cursor: default; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }

  .modal-panel {
    background: #181818;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    width: 360px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .modal-header h3 { margin: 0; font-size: 16px; }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
  }

  .modal-close:hover { color: var(--text); }

  .lookup-buttons { display: flex; gap: 6px; }
  .lookup-buttons button { flex: 1; }

  .online-results {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 160px;
    overflow-y: auto;
  }

  .online-result, .online-selected {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
    background: #222;
  }

  .online-result:hover { background: #2a2a2a; }
  .online-selected { cursor: default; background: #20301f; }

  .online-result-thumb {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .online-result-name {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-result-sub {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-clear-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    margin-left: auto;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
    padding: 8px 8px 4px 8px;
  }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .folder-item:hover { background: var(--hover); }
  .folder-item.active { background: var(--hover); }
  .folder-item:active { cursor: grabbing; }
  .folder-item.nested { padding-left: 24px; }

  .category-arrow { color: var(--text-dim); font-size: 10px; width: 10px; flex-shrink: 0; }

  .category-icon {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: #2a2a2a;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .folder-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .folder-name {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .folder-playing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: auto;
    flex-shrink: 0;
  }

  .drag-handle { color: #555; font-size: 14px; cursor: grab; flex-shrink: 0; }

  .marquee-wrap { overflow: hidden; white-space: nowrap; position: relative; }

  .marquee-wrap.overflowing .marquee-inner {
    display: inline-block;
    animation: marquee 16s linear infinite;
    padding-right: 40px;
  }

  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .main { flex: 1; background: var(--panel-bg); overflow-y: auto; padding: 24px 32px; }

  .main-empty {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 60px;
    text-align: center;
  }

  .main-header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }

  .main-cover {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    background: #333;
    flex-shrink: 0;
  }

  .main-title { font-size: 28px; font-weight: 700; margin: 0; }
  .main-subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

  .add-tracks-btn {
    display: inline-block;
    color: var(--text-dim);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
    background: transparent;
    font-family: inherit;
  }

  .add-tracks-btn:hover { color: var(--text); border-color: #666; }

  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .track-row:hover { background: var(--hover); }
  .track-row.playing { color: var(--accent); }

  .track-index { width: 20px; color: var(--text-dim); text-align: right; flex-shrink: 0; }

  .track-thumb {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 3px;
    background: #333;
    flex-shrink: 0;
  }

  .bottom-bar {
    height: 90px;
    background: #181818;
    border-top: 1px solid #282828;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .bar-divider {
    width: 1px;
    height: 32px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-info {
    width: 220px;
    flex-shrink: 1;
    min-width: 140px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .now-playing-cover {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
    background: #333;
    flex-shrink: 0;
  }

  .now-playing-track { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing-folder { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .play-pause-btn {
    background: var(--text);
    color: #000;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-pause-btn:disabled { opacity: 0.4; cursor: default; }

  .skip-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
  }

  .skip-btn:hover:not(:disabled) { color: var(--text); }
  .skip-btn:disabled { opacity: 0.3; cursor: default; }

  .transport {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 80px;
  }

  .time-label {
    font-size: 11px;
    color: var(--text-dim);
    width: 34px;
    flex-shrink: 0;
    text-align: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    height: 16px;
    min-width: 0;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--range-progress, 0%), #4a4a4a var(--range-progress, 0%));
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    background: #4a4a4a;
    border-radius: 2px;
  }

  input[type="range"]::-moz-range-progress {
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    margin-top: -4px;
    box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }

  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    border: none;
    box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }

  input[type="range"]:disabled::-webkit-slider-thumb { background: #666; }
  input[type="range"]:disabled { cursor: default; }

  .seek-bar { flex: 1; }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 130px;
    flex-shrink: 0;
  }

  .volume-icon { font-size: 14px; flex-shrink: 0; }
  .volume-bar { flex: 1; min-width: 0; }
  .volume-percent { font-size: 11px; color: var(--text-dim); width: 30px; flex-shrink: 0; text-align: right; display: flex; align-items: center; justify-content: flex-end; }

  .volume-percent-input {
    width: 20px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    text-align: right;
    padding: 0;
  }

  .volume-percent-input:focus {
    outline: none;
    color: var(--text);
  }

  .loop-btn {
    background: transparent;
    border: 1px solid #444;
    color: var(--text-dim);
    border-radius: 16px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .loop-btn.active { border-color: var(--accent); color: var(--accent); }

  .context-menu {
    position: fixed;
    background: #282828;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 4px;
    z-index: 1000;
    min-width: 170px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .context-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .context-item:hover { background: var(--hover); }
  .context-item.danger { color: #f87171; }
  .context-item.danger:hover { background: rgba(248,113,113,0.1); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
</style>
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// CHANGE THIS to your deployed worker URL
const WORKER_URL = "https://my-music-worker.noahnator-workers.workers.dev";

function stripExt(filename) {
  return filename.replace(/\.[^/.]+$/, "");
}

function applyOrder(items, orderKeys, getKey) {
  const byKey = {};
  items.forEach((item) => { byKey[getKey(item)] = item; });
  const ordered = orderKeys.filter((k) => byKey[k]).map((k) => byKey[k]);
  const remaining = items.filter((item) => !orderKeys.includes(getKey(item)));
  return [...ordered, ...remaining];
}

function Marquee({ text, className }) {
  const wrapRef = useRef(null);
  const [overflowing, setOverflowing] = useState(false);

  useEffect(() => {
    const el = wrapRef.current;
    if (el) setOverflowing(el.scrollWidth > el.clientWidth + 2);
  }, [text]);

  return (
    <div ref={wrapRef} className={"marquee-wrap" + (overflowing ? " overflowing" : "") + (className ? " " + className : "")}>
      <span className="marquee-inner">
        {text}
        {overflowing && <React.Fragment>&nbsp;&nbsp;&nbsp;&nbsp;{text}</React.Fragment>}
      </span>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => sessionStorage.getItem("auth_token") || "");
  const [library, setLibrary] = useState({ soundtracks: {}, folders: {}, order: {}, playlists: {} });
  const [expanded, setExpanded] = useState({}); // folder id -> bool

  const [viewingId, setViewingId] = useState(null);
  const [viewingPlaylistId, setViewingPlaylistId] = useState(null);
  const [error, setError] = useState(null);
  const [isViewingDownloaded, setIsViewingDownloaded] = useState(false);
  const [downloadStatus, setDownloadStatus] = useState(null);

  const [playingId, setPlayingId] = useState(null);
  const [playingKey, setPlayingKey] = useState(null);
  const [playingPlaylistId, setPlayingPlaylistId] = useState(null); // set when the current track came from a playlist queue
  const [loopTrack, setLoopTrack] = useState(false);
  const [shuffle, setShuffle] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(0);
  const [volumePercent, setVolumePercent] = useState(() => {
    const saved = localStorage.getItem("volumePercent");
    return saved !== null ? parseFloat(saved) : 100;
  });
  const [searchQuery, setSearchQuery] = useState("");

  const audioRef = useRef(null);

  function openSoundtrack(id) {
    setViewingId(id);
    setViewingPlaylistId(null);
    setShowMetaResults(false);
    setMetaResults([]);
  }

  function openPlaylist(id) {
    setViewingPlaylistId(id);
    setViewingId(null);
  }

  function streamUrl(key) {
    return `${WORKER_URL}/api/stream/${encodeURIComponent(key)}?token=${encodeURIComponent(token)}`;
  }

  async function authedFetch(path, options) {
    const res = await fetch(WORKER_URL + path, {
      ...options,
      headers: { ...(options && options.headers), "X-Auth-Token": token },
    });
    if (!res.ok) {
      sessionStorage.removeItem("auth_token");
      setError("Auth failed. Refresh and re-enter password.");
      throw new Error("auth failed");
    }
    return res.json();
  }

  async function loadLibrary() {
    setError(null);
    try {
      setLibrary(await authedFetch("/api/library"));
    } catch (e) { /* error already set */ }
  }

  useEffect(() => {
    if (!token) {
      const entered = prompt("Enter password:");
      sessionStorage.setItem("auth_token", entered || "");
      setToken(entered || "");
      return;
    }
    loadLibrary();
  }, [token]);

  // if the thing currently being viewed/played gets deleted (directly, or via a parent folder
  // getting deleted), clear that state once the library refreshes
  useEffect(() => {
    if (viewingId && !library.soundtracks[viewingId]) setViewingId(null);
  }, [library.soundtracks, viewingId]);

  useEffect(() => {
    if (viewingPlaylistId && !library.playlists[viewingPlaylistId]) setViewingPlaylistId(null);
  }, [library.playlists, viewingPlaylistId]);

  useEffect(() => {
    if (playingId && !library.soundtracks[playingId]) {
      setPlayingId(null);
      setPlayingKey(null);
      if (audioRef.current) audioRef.current.pause();
    }
  }, [library.soundtracks, playingId]);

  // ---- offline downloads ----

  const OFFLINE_CACHE = "music-offline-v1";
  const lastBlobUrlRef = useRef(null);

  function offlineKeys(soundtrack) {
    const keys = soundtrack.tracks.map((t) => t.key);
    if (soundtrack.cover) keys.push(soundtrack.cover);
    return keys;
  }

  async function isDownloaded(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    const results = await Promise.all(offlineKeys(soundtrack).map((k) => cache.match(k)));
    return results.length > 0 && results.every((r) => r);
  }

  async function downloadSoundtrack(soundtrack, onProgress) {
    const cache = await caches.open(OFFLINE_CACHE);
    const keys = offlineKeys(soundtrack);
    for (let i = 0; i < keys.length; i++) {
      const res = await fetch(streamUrl(keys[i]));
      await cache.put(keys[i], res.clone());
      if (onProgress) onProgress(i + 1, keys.length);
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }

  async function removeDownload(soundtrack) {
    const cache = await caches.open(OFFLINE_CACHE);
    for (const key of offlineKeys(soundtrack)) await cache.delete(key);
  }

  async function getPlayableUrl(key) {
    const cache = await caches.open(OFFLINE_CACHE);
    const cached = await cache.match(key);
    if (cached) {
      const blob = await cached.blob();
      return URL.createObjectURL(blob);
    }
    return streamUrl(key);
  }

  // ---- uploads ----

  async function uploadFile(id, file) {
    await authedFetch("/api/upload?id=" + encodeURIComponent(id), {
      method: "POST",
      headers: { "X-Filename": file.name, "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
  }

  const [showAddForm, setShowAddForm] = useState(false);
  const [newParentId, setNewParentId] = useState("");
  const [newName, setNewName] = useState("");
  const [newFiles, setNewFiles] = useState(null);
  const [uploading, setUploading] = useState(false);

  const [onlineResults, setOnlineResults] = useState([]);
  const [onlineSearching, setOnlineSearching] = useState(false);
  const [selectedOnline, setSelectedOnline] = useState(null);

  async function handleSearchOnline() {
    if (!newName) return;
    setOnlineSearching(true);
    setOnlineResults([]);
    try {
      const res = await fetch("https://itunes.apple.com/search?term=" + encodeURIComponent(newName) + "&entity=album&limit=6");
      const data = await res.json();
      setOnlineResults((data.results || []).map((r) => ({
        name: r.collectionName,
        artist: r.artistName,
        year: r.releaseDate ? r.releaseDate.slice(0, 4) : null,
        coverUrl: r.artworkUrl100 ? r.artworkUrl100.replace("100x100bb", "600x600bb") : null,
      })));
    } catch (e) {
      alert("Online search failed: " + e.message);
    } finally {
      setOnlineSearching(false);
    }
  }

  async function handleSearchIgdb() {
    if (!newName) return;
    setOnlineSearching(true);
    setOnlineResults([]);
    try {
      const results = await authedFetch("/api/igdb-search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: newName }),
      });
      setOnlineResults(results);
    } catch (e) {
      alert("IGDB search failed: " + e.message);
    } finally {
      setOnlineSearching(false);
    }
  }

  function pickOnlineResult(result) {
    setSelectedOnline(result);
    setOnlineResults([]);
  }

  async function handleCreateSoundtrack() {
    if (!newName || !newFiles || newFiles.length === 0) return;
    setUploading(true);
    try {
      const { id } = await authedFetch("/api/create-soundtrack", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: newName, parentId: newParentId || null }),
      });
      for (const file of newFiles) await uploadFile(id, file);

      if (selectedOnline) {
        if (selectedOnline.coverUrl) {
          try {
            const imgRes = await fetch(selectedOnline.coverUrl);
            const blob = await imgRes.blob();

  async function updateOrder(parentPath, newOrder) {

  // ---- drag and drop ----
  // dragRef stores { parentPath, index, meta: { type, id } } of the item currently being dragged.
  // parentPath is "" for top level, or a folder id for anything nested inside a folder.
  const dragRef = useRef(null);

  function handleDragStart(parentPath, index, meta) {
    dragRef.current = { parentPath, index, meta };
  }

  function handleDragOver(e) {
    e.preventDefault();
  }

  // dropping between/onto items in the SAME list -> pure reorder
  function handleDropReorder(parentPath, displayedItems, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag || drag.parentPath !== parentPath || drag.index === dropIndex) return;
    const newItems = [...displayedItems];
    const [moved] = newItems.splice(drag.index, 1);
    newItems.splice(dropIndex, 0, moved);
    updateOrder(parentPath, newItems.map((it) => it.id));
  }

  // dropping directly onto a folder row -> move soundtracks/playlists into that folder;
  // dropping a folder onto a folder either reorders (same list) or nests it inside (different list)
  function handleDropOnFolder(targetFolderId, parentPath, displayedItems, dropIndex) {
    const drag = dragRef.current;
    dragRef.current = null;
    if (!drag) return;

    if (drag.meta.type === "soundtrack" || drag.meta.type === "playlist") {
      moveItem(drag.meta.type, drag.meta.id, targetFolderId);
      return;
    }

    if (drag.meta.type === "folder") {
      if (drag.meta.id === targetFolderId) return;
      if (drag.parentPath === parentPath && drag.index !== dropIndex) {
        const newItems = [...displayedItems];
        const [moved] = newItems.splice(drag.index, 1);
        newItems.splice(dropIndex, 0, moved);
        updateOrder(parentPath, newItems.map((it) => it.id));
      } else {
        moveItem("folder", drag.meta.id, targetFolderId);
      }
    }
  }

  function toggleFolder(id) {
    setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
  }

  // recursively renders everything inside the given parentId ("" / null = top level)
  function renderItems(parentId, indentLevel) {
    const key = parentId || "";
    const childFolders = Object.values(library.folders).filter((f) => (f.parentId || null) === (parentId || null));
    const childSoundtracks = allSoundtracks.filter((s) => (s.parentId || null) === (parentId || null));
    const childPlaylists = Object.values(library.playlists).filter((pl) => (pl.parentId || null) === (parentId || null));

    const items = applyOrder(
      [
        ...childFolders.map((f) => ({ type: "folder", id: f.id, name: f.name })),
        ...childSoundtracks.map((s) => ({ type: "soundtrack", id: s.id, name: s.name, cover: s.cover })),
        ...childPlaylists.map((pl) => ({ type: "playlist", id: pl.id, name: pl.name, cover: pl.cover })),
      ],
      library.order[key] || [],
      (item) => item.id
    );

    return items.map((item, i) => {
      const meta = { type: item.type, id: item.id };
      const style = { paddingLeft: 8 + indentLevel * 16 };

      if (item.type === "folder") {
        const isOpen = !!expanded[item.id];
        return (
          <React.Fragment key={item.id}>
            <div
              className="folder-item"
              style={style}
              draggable
              onDragStart={() => handleDragStart(key, i, meta)}
              onDragOver={handleDragOver}
              onDrop={() => handleDropOnFolder(item.id, key, items, i)}
              onClick={() => toggleFolder(item.id)}
              onContextMenu={(e) => openContextMenu(e, { type: "folder", id: item.id })}
            >
              <span className="drag-handle">⠿</span>
              <span className="category-arrow">{isOpen ? "▼" : "▶"}</span>
              <div className="category-icon">📁</div>
              <span className="folder-name">{item.name}</span>
            </div>
            {isOpen && renderItems(item.id, indentLevel + 1)}
          </React.Fragment>
        );
      }

      if (item.type === "playlist") {
        return (
          <div
            key={item.id}
            className={"folder-item" + (item.id === viewingPlaylistId ? " active" : "")}
            style={style}
            draggable
            onDragStart={() => handleDragStart(key, i, meta)}
            onDragOver={handleDragOver}
            onDrop={() => handleDropReorder(key, items, i)}
            onClick={() => openPlaylist(item.id)}
            onContextMenu={(e) => openContextMenu(e, { type: "playlist", id: item.id })}
          >
            <span className="drag-handle">⠿</span>
            {item.cover ? (
              <img className="folder-thumb" src={streamUrl(item.cover)} />
            ) : (
              <div className="category-icon">🎶</div>
            )}
            <span className="folder-name">{item.name}</span>
          </div>
        );
      }

      // soundtrack
      return (
        <div
          key={item.id}
          className={"folder-item" + (item.id === viewingId ? " active" : "")}
          style={style}
          draggable
          onDragStart={() => handleDragStart(key, i, meta)}
          onDragOver={handleDragOver}
          onDrop={() => handleDropReorder(key, items, i)}
          onClick={() => openSoundtrack(item.id)}
          onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: item.id })}
        >
          <span className="drag-handle">⠿</span>
          <img className="folder-thumb" src={item.cover ? streamUrl(item.cover) : ""} />
          <span className="folder-name">{item.name}</span>
          {item.id === playingId && <div className="folder-playing-dot"></div>}
        </div>
      );
    });
  }

  // flattened folder list for the "create soundtrack in..." dropdown, indented by depth
  function flattenFolders(parentId, depth) {
    return Object.values(library.folders)
      .filter((f) => (f.parentId || null) === (parentId || null))
      .flatMap((f) => [{ ...f, depth }, ...flattenFolders(f.id, depth + 1)]);
  }
  const folderOptions = flattenFolders(null, 0);

  // ---- playback ----

  function playTrackAt(id, key, playlistId) {
    const soundtrack = library.soundtracks[id];
    if (!soundtrack || !soundtrack.tracks.some((t) => t.key === key)) return;
    setPlayingId(id);
    setPlayingKey(key);
    setPlayingPlaylistId(playlistId || null);
  }

  // picks a random soundtrack sharing the same parent folder, excluding one id, that actually has tracks
  function pickRandomSiblingSoundtrack(parentId, excludeId) {
    const candidates = allSoundtracks.filter(
      (s) => (s.parentId || null) === (parentId || null) && s.id !== excludeId && s.tracks.length > 0
    );
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  useEffect(() => {
    const soundtrack = playingId && library.soundtracks[playingId];
    const track = soundtrack && soundtrack.tracks.find((t) => t.key === playingKey);
    if (track && audioRef.current) {
      let cancelled = false;
      getPlayableUrl(track.key).then((url) => {
        if (cancelled) return;
        if (lastBlobUrlRef.current) {
          URL.revokeObjectURL(lastBlobUrlRef.current);
          lastBlobUrlRef.current = null;
        }
        if (url.startsWith("blob:")) lastBlobUrlRef.current = url;
        audioRef.current.src = url;
        audioRef.current.play();
      });
      return () => { cancelled = true; };
    }
  }, [playingKey, playingId]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.loop = loopTrack;
  }, [loopTrack]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = Math.pow(volumePercent / 100, 2);
    localStorage.setItem("volumePercent", volumePercent);
  }, [volumePercent]);

  const [volumeInput, setVolumeInput] = useState(null);

  function commitVolumeInput() {
    if (volumeInput === null) return;
    const parsed = parseInt(volumeInput, 10);
    if (!isNaN(parsed)) setVolumePercent(Math.max(0, Math.min(100, parsed)));
    setVolumeInput(null);
  }

  function handleSeek(value) {
    if (audioRef.current) audioRef.current.currentTime = value;
    setCurrentTime(value);
  }

  function togglePlayPause() {
    if (!audioRef.current) return;
    if (audioRef.current.paused) audioRef.current.play();
    else audioRef.current.pause();
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function handlePrevious() {
    if (playingPlaylistId) {
      const playlist = library.playlists[playingPlaylistId];
      if (!playlist) return;
      const refs = playlist.tracks;
      const currentIdx = refs.findIndex((t) => t.soundtrackId === playingId && t.key === playingKey);
      const prev = refs[currentIdx - 1];
      if (prev && library.soundtracks[prev.soundtrackId]) {
        playTrackAt(prev.soundtrackId, prev.key, playingPlaylistId);
      }
      return;
    }

    const soundtrack = playingId && library.soundtracks[playingId];
    if (!soundtrack) return;
    const currentIndex = soundtrack.tracks.findIndex((t) => t.key === playingKey);
    const prevTrack = soundtrack.tracks[currentIndex - 1];
    if (prevTrack) playTrackAt(playingId, prevTrack.key);
  }

  function handleEnded() {
    if (loopTrack) return;

    if (playingPlaylistId) {
      const playlist = library.playlists[playingPlaylistId];
      if (playlist) {
        const refs = playlist.tracks;
        const currentIdx = refs.findIndex((t) => t.soundtrackId === playingId && t.key === playingKey);
        const next = refs[currentIdx + 1];
        if (next && library.soundtracks[next.soundtrackId] && library.soundtracks[next.soundtrackId].tracks.some((t) => t.key === next.key)) {
          playTrackAt(next.soundtrackId, next.key, playingPlaylistId);
          return;
        }
        // playlist finished - continue with a random soundtrack from the same folder
        const sibling = pickRandomSiblingSoundtrack(playlist.parentId, null);
        if (sibling) playTrackAt(sibling.id, sibling.tracks[Math.floor(Math.random() * sibling.tracks.length)].key, null);
      }
      return;
    }

    const soundtrack = playingId && library.soundtracks[playingId];
    if (!soundtrack) return;
    const currentIndex = soundtrack.tracks.findIndex((t) => t.key === playingKey);

    if (shuffle && soundtrack.tracks.length > 1) {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * soundtrack.tracks.length);
      } while (nextIndex === currentIndex);
      playTrackAt(playingId, soundtrack.tracks[nextIndex].key);
      return;
    }

    const nextTrack = soundtrack.tracks[currentIndex + 1];
    if (nextTrack) {
      playTrackAt(playingId, nextTrack.key);
      return;
    }

    // reached the end of this soundtrack - continue with a random soundtrack from the same folder, if any
    const sibling = pickRandomSiblingSoundtrack(soundtrack.parentId, soundtrack.id);
    if (sibling) playTrackAt(sibling.id, sibling.tracks[Math.floor(Math.random() * sibling.tracks.length)].key);
  }

  // ---- track reordering ----

  async function reorderTracks(id, order) {
    setLibrary((prev) => {
      const soundtrack = prev.soundtracks[id];
      if (!soundtrack) return prev;
      const byKey = {};
      soundtrack.tracks.forEach((t) => { byKey[t.key] = t; });
      const newTracks = order.map((k) => byKey[k]).filter(Boolean);
      return { ...prev, soundtracks: { ...prev.soundtracks, [id]: { ...soundtrack, tracks: newTracks } } };
    });
    await authedFetch("/api/reorder-tracks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, order }),
    });
  }

  const trackDragRef = useRef(null);

  function handleTrackDragStart(i) {
    trackDragRef.current = i;
  }

  function handleTrackDrop(i, tracks) {
    const from = trackDragRef.current;
    trackDragRef.current = null;
    if (from === null || from === i) return;
    const newTracks = [...tracks];
    const [moved] = newTracks.splice(from, 1);
    newTracks.splice(i, 0, moved);
    reorderTracks(viewingId, newTracks.map((t) => t.key));
  }

  // ---- downloads for currently viewed soundtrack ----

  const viewingSoundtrackForEffect = viewingId ? library.soundtracks[viewingId] : null;

  useEffect(() => {
    let cancelled = false;
    if (viewingSoundtrackForEffect) {
      isDownloaded(viewingSoundtrackForEffect).then((result) => {
        if (!cancelled) setIsViewingDownloaded(result);
      });
    } else {
      setIsViewingDownloaded(false);
    }
    return () => { cancelled = true; };
  }, [viewingId, viewingSoundtrackForEffect]);

  async function handleDownload() {
    if (!viewingSoundtrackForEffect) return;
    setDownloadStatus("Starting...");
    await downloadSoundtrack(viewingSoundtrackForEffect, (done, total) => setDownloadStatus(`${done} / ${total}`));
    setDownloadStatus(null);
    setIsViewingDownloaded(true);
  }

  async function handleRemoveDownload() {
    if (!viewingSoundtrackForEffect) return;
    await removeDownload(viewingSoundtrackForEffect);
    setIsViewingDownloaded(false);
  }

  // ---- context menu ----

  const [contextMenu, setContextMenu] = useState(null);
  const [playlistPickerFor, setPlaylistPickerFor] = useState(null);

  useEffect(() => {
    function closeMenu() { setContextMenu(null); setPlaylistPickerFor(null); }
    window.addEventListener("click", closeMenu);
    return () => window.removeEventListener("click", closeMenu);
  }, []);

  function openContextMenu(e, target) {
    e.preventDefault();
    e.stopPropagation();
    setContextMenu({ x: e.clientX, y: e.clientY, target });
  }

  if (error) {
    return <div style={{padding: 24, color: "#fff"}}>{error}</div>;
  }

  const viewingSoundtrack = viewingId ? library.soundtracks[viewingId] : null;
  const playingSoundtrack = playingId ? library.soundtracks[playingId] : null;
  const hasNowPlaying = playingSoundtrack && playingKey !== null;
  const playingTrack = playingSoundtrack ? playingSoundtrack.tracks.find((t) => t.key === playingKey) : null;

  return (
    <div className="app">
      <div className="app-body">

        <div
          className="sidebar"
          onContextMenu={(e) => openContextMenu(e, { type: "empty" })}
          onDragOver={handleDragOver}
          onDrop={() => {
            // only fires if no nested item's own onDrop already handled and cleared the drag (see handleDrop*),
            // so this only triggers for drops on truly empty sidebar space - moves the dragged item to the top level
            const drag = dragRef.current;
            dragRef.current = null;
            if (drag) moveItem(drag.meta.type, drag.meta.id, null);
          }}
        >
          <div className="sidebar-header">
            <h1>Library</h1>
            <button className="add-btn" onClick={() => setShowAddForm(!showAddForm)}>+</button>
          </div>

          <div className="search-wrap">
            <input
              type="text"
              className="search-input"
              placeholder="Search library..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
            />
            {searchQuery && <button className="search-clear-btn" onClick={() => setSearchQuery("")}>✕</button>}
          </div>

          {showAddForm && (
            <div className="add-form">
              <select value={newParentId} onChange={(e) => setNewParentId(e.target.value)}>
                <option value="">(Top level)</option>
                {folderOptions.map((f) => (
                  <option key={f.id} value={f.id}>{"—".repeat(f.depth) + " " + f.name}</option>
                ))}
              </select>
              <input type="text" placeholder="Soundtrack name" value={newName} onChange={(e) => setNewName(e.target.value)} />

              <div className="lookup-buttons">
                <button type="button" onClick={handleSearchOnline} disabled={!newName || onlineSearching}>
                  {onlineSearching ? "Searching..." : "🎵 iTunes"}
                </button>
                <button type="button" onClick={handleSearchIgdb} disabled={!newName || onlineSearching}>
                  {onlineSearching ? "Searching..." : "🎮 IGDB"}
                </button>
              </div>

              {onlineResults.length > 0 && (
                <div className="online-results">
                  {onlineResults.map((r, i) => (
                    <div key={i} className="online-result" onClick={() => pickOnlineResult(r)}>
                      {r.coverUrl && <img src={r.coverUrl} className="online-result-thumb" />}
                      <div style={{ minWidth: 0 }}>
                        <div className="online-result-name">{r.name}</div>
                        <div className="online-result-sub">{r.artist}{r.year ? ` · ${r.year}` : ""}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {selectedOnline && (
                <div className="online-selected">
                  {selectedOnline.coverUrl && <img src={selectedOnline.coverUrl} className="online-result-thumb" />}
                  <div style={{ minWidth: 0 }}>
                    <div className="online-result-name">Using: {selectedOnline.name}</div>
                    <div className="online-result-sub">{selectedOnline.artist}{selectedOnline.year ? ` · ${selectedOnline.year}` : ""}</div>
                  </div>
                  <button type="button" className="online-clear-btn" onClick={() => setSelectedOnline(null)}>✕</button>
                </div>
              )}

              <input type="file" multiple accept="audio/*,image/*" onChange={(e) => setNewFiles(e.target.files)} />
              <button onClick={handleCreateSoundtrack} disabled={uploading}>{uploading ? "Uploading..." : "Create"}</button>
            </div>
          )}

          {searchResults ? (
            <React.Fragment>
              <div className="section-label">{searchResults.length} result{searchResults.length === 1 ? "" : "s"}</div>
              {searchResults.map((r) => {
                if (r.kind === "soundtrack") {
                  const s = r.soundtrack;
                  return (
                    <div
                      key={"search-st-" + s.id}
                      className={"folder-item" + (s.id === viewingId ? " active" : "")}
                      onClick={() => openSoundtrack(s.id)}
                      onContextMenu={(e) => openContextMenu(e, { type: "soundtrack", id: s.id })}
                    >
                      <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                      <span className="folder-name">{s.name}</span>
                      {s.id === playingId && <div className="folder-playing-dot"></div>}
                    </div>
                  );
                }
                const s = r.soundtrack;
                return (
                  <div
                    key={"search-tr-" + r.track.key}
                    className="folder-item"
                    onClick={() => { openSoundtrack(s.id); playTrackAt(s.id, r.track.key); }}
                  >
                    <img className="folder-thumb" src={s.cover ? streamUrl(s.cover) : ""} />
                    <div style={{ minWidth: 0, overflow: "hidden" }}>
                      <div className="folder-name">{stripExt(r.track.name)}</div>
                      <div className="search-subtitle">{s.name}</div>
                    </div>
                    {s.id === playingId && r.track.key === playingKey && <div className="folder-playing-dot"></div>}
                  </div>
                );
              })}
            </React.Fragment>
          ) : (
            <React.Fragment>
              {pinnedItems.length > 0 && (
                <React.Fragment>
                  <div className="section-label">Pinned</div>
                  {pinnedItems.map((p) => (
                    <div
                      key={"pin-" + p.id}
                      className={"folder-item" + ((p.type === "soundtrack" ? p.id === viewingId : p.id === viewingPlaylistId) ? " active" : "")}
                      onClick={() => (p.type === "soundtrack" ? openSoundtrack(p.id) : openPlaylist(p.id))}
                      onContextMenu={(e) => openContextMenu(e, { type: p.type, id: p.id })}
                    >
                      {p.type === "soundtrack" ? (
                        <img className="folder-thumb" src={p.cover ? streamUrl(p.cover) : ""} />
                      ) : p.cover ? (
                        <img className="folder-thumb" src={streamUrl(p.cover)} />
                      ) : (
                        <div className="category-icon">🎶</div>
                      )}
                      <span className="folder-name">{p.name}</span>
                      {p.type === "soundtrack" && p.id === playingId && <div className="folder-playing-dot"></div>}
                    </div>
                  ))}
                </React.Fragment>
              )}

              <div className="section-label">All</div>

              {renderItems(null, 0)}
            </React.Fragment>
          )}
        </div>

        <div className="main">
          {viewingPlaylist ? (
            <React.Fragment>
              <div className="main-header">
                {viewingPlaylist.cover ? (
                  <img className="main-cover" src={streamUrl(viewingPlaylist.cover)} />
                ) : (
                  <div className="category-icon main-cover" style={{fontSize: 40, display: "flex", alignItems: "center", justifyContent: "center"}}>🎶</div>
                )}
                <div>
                  <h2 className="main-title">{viewingPlaylist.name}</h2>
                  {viewingPlaylist.description && (
                    <div className="main-subtitle" style={{maxWidth: 500}}>{viewingPlaylist.description}</div>
                  )}
                </div>
              </div>
              <button className="add-tracks-btn" onClick={() => openEditModal("playlist", viewingPlaylistId)}>✏️ Edit</button>
              {viewingPlaylistTracks.length === 0 ? (
                <div className="main-empty" style={{marginTop: 20}}>
                  No tracks yet - right-click any track in your library and choose "Add to playlist...".
                </div>
              ) : (
                viewingPlaylistTracks.map(({ soundtrackId, soundtrack, track }) => {
                  const isPlaying = soundtrackId === playingId && track.key === playingKey;
                  return (
                    <div
                      key={soundtrackId + ":" + track.key}
                      className={"track-row" + (isPlaying ? " playing" : "")}
                      onClick={() => playTrackAt(soundtrackId, track.key, viewingPlaylistId)}
                      onContextMenu={(e) => openContextMenu(e, { type: "track", id: soundtrackId, key: track.key, playlistId: viewingPlaylistId })}
                    >
                      <img
                        className="track-thumb"
                        src={track.cover ? streamUrl(track.cover) : (soundtrack.cover ? streamUrl(soundtrack.cover) : "")}
                      />
                      <span className="track-index">{isPlaying ? "▶" : "♪"}</span>
                      <div style={{ minWidth: 0, overflow: "hidden" }}>
                        <div>{stripExt(track.name)}</div>
                        <div className="search-subtitle">{soundtrack.name}</div>
                      </div>
                    </div>
                  );
                })
              )}
            </React.Fragment>
          ) : !viewingSoundtrack ? (
            <div className="main-empty">Pick a soundtrack from the left to see its tracks.</div>
          ) : (
            <React.Fragment>
              <div className="main-header">
                {viewingSoundtrack.cover && <img className="main-cover" src={streamUrl(viewingSoundtrack.cover)} />}
                <div>
                  <h2 className="main-title">{viewingSoundtrack.name}</h2>
                  {(viewingSoundtrack.artist || viewingSoundtrack.year) && (
                    <div className="main-subtitle">
                      {viewingSoundtrack.artist}{viewingSoundtrack.artist && viewingSoundtrack.year ? " · " : ""}{viewingSoundtrack.year}
                    </div>
                  )}
                  {viewingSoundtrack.description && (
                    <div className="main-subtitle" style={{marginTop: 6, maxWidth: 500}}>{viewingSoundtrack.description}</div>
                  )}
                </div>
              </div>
              <label className="add-tracks-btn">
                {uploading ? "Uploading..." : "+ Add tracks"}
                <input type="file" multiple accept="audio/*,image/*" style={{display: "none"}} disabled={uploading}
                  onChange={(e) => handleAddTracksToViewing(e.target.files)} />
              </label>
              {" "}
              {downloadStatus ? (
                <span className="add-tracks-btn">Downloading {downloadStatus}...</span>
              ) : isViewingDownloaded ? (
                <button className="add-tracks-btn" onClick={handleRemoveDownload}>✓ Downloaded (remove)</button>
              ) : (
                <button className="add-tracks-btn" onClick={handleDownload}>Download for offline</button>
              )}
              {" "}
              <button className="add-tracks-btn" onClick={() => openEditModal("soundtrack", viewingId)}>✏️ Edit</button>
              {" "}
              <button className="add-tracks-btn" onClick={handleTryGetMeta} disabled={metaSearching}>
                {metaSearching ? "Searching..." : "🔎 Try Get Meta"}
              </button>

              {showMetaResults && (
                <div className="modal-backdrop" onClick={() => setShowMetaResults(false)}>
                  <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
                    <div className="modal-header">
                      <h3>Find metadata</h3>
                      <button className="modal-close" onClick={() => setShowMetaResults(false)}>✕</button>
                    </div>
                    <input
                      type="text"
                      className="search-input"
                      style={{marginBottom: 8}}
                      value={metaQuery}
                      onChange={(e) => setMetaQuery(e.target.value)}
                      placeholder="Search term..."
                    />
                    <div className="lookup-buttons">
                      <button type="button" onClick={() => handleMetaSearch("itunes")} disabled={!metaQuery.trim() || metaSearching}>
                        {metaSearching ? "Searching..." : "🎵 iTunes"}
                      </button>
                      <button type="button" onClick={() => handleMetaSearch("igdb")} disabled={!metaQuery.trim() || metaSearching}>
                        {metaSearching ? "Searching..." : "🎮 IGDB"}
                      </button>
                    </div>
                    {metaSearchAttempted && !metaSearching && metaResults.length === 0 && (
                      <div className="search-subtitle" style={{marginTop: 10}}>No matches found for "{metaQuery}".</div>
                    )}
                    {metaResults.length > 0 && (
                      <div className="online-results" style={{marginTop: 10}}>
                        {metaResults.map((r, i) => (
                          <div key={i} className="online-result" onClick={() => applyMetaResult(r)}>
                            {r.coverUrl && <img src={r.coverUrl} className="online-result-thumb" />}
                            <div style={{ minWidth: 0 }}>
                              <div className="online-result-name">{r.name}</div>
                              <div className="online-result-sub">
                                {r.source}{r.artist ? ` · ${r.artist}` : ""}{r.year ? ` · ${r.year}` : ""}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
              {viewingSoundtrack.tracks.map((track, i) => {
                const isPlaying = viewingId === playingId && track.key === playingKey;
                return (
                  <div
                    key={track.key}
                    className={"track-row" + (isPlaying ? " playing" : "")}
                    draggable
                    onDragStart={() => handleTrackDragStart(i)}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => handleTrackDrop(i, viewingSoundtrack.tracks)}
                    onClick={() => playTrackAt(viewingId, track.key)}
                    onContextMenu={(e) => openContextMenu(e, { type: "track", id: viewingId, key: track.key })}
                  >
                    <span className="drag-handle">⠿</span>
                    <img
                      className="track-thumb"
                      src={track.cover ? streamUrl(track.cover) : (viewingSoundtrack.cover ? streamUrl(viewingSoundtrack.cover) : "")}
                    />
                    <span className="track-index">{isPlaying ? "▶" : i + 1}</span>
                    <span>{stripExt(track.name)}</span>
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
      </div>

      <div className="bottom-bar">
        <div className="now-playing-info">
          {hasNowPlaying ? (
            <React.Fragment>
              {playingSoundtrack.cover && <img className="now-playing-cover" src={streamUrl(playingSoundtrack.cover)} />}
              <div style={{minWidth: 0}}>
                <Marquee text={playingTrack ? stripExt(playingTrack.name) : ""} className="now-playing-track" />
                <Marquee text={playingSoundtrack.name} className="now-playing-folder" />
              </div>
            </React.Fragment>
          ) : (
            <div className="now-playing-folder">Nothing playing</div>
          )}
        </div>

        <div className="bar-divider"></div>

        <audio
          ref={audioRef}
          onEnded={handleEnded}
          onPlay={() => setIsPlaying(true)}
          onPause={() => setIsPlaying(false)}
          onTimeUpdate={(e) => setCurrentTime(e.target.currentTime)}
          onLoadedMetadata={(e) => setDuration(e.target.duration)}
          style={{ display: "none" }}
        ></audio>

        <button className="skip-btn" onClick={handlePrevious} disabled={!hasNowPlaying}>⏮</button>

        <button className="play-pause-btn" onClick={togglePlayPause} disabled={!hasNowPlaying}>
          {isPlaying ? "⏸" : "▶"}
        </button>

        <button className="skip-btn" onClick={handleEnded} disabled={!hasNowPlaying}>⏭</button>

        <div className="transport">
          <span className="time-label">{formatTime(currentTime)}</span>
          <input
            type="range"
            className="seek-bar"
            min="0"
            max={duration || 0}
            step="0.1"
            value={currentTime}
            onChange={(e) => handleSeek(parseFloat(e.target.value))}
            disabled={!hasNowPlaying}
            style={{ "--range-progress": duration ? `${(currentTime / duration) * 100}%` : "0%" }}
          />
          <span className="time-label">{formatTime(duration)}</span>
        </div>

        <div className="bar-divider"></div>

        <div className="volume-control">
          <span className="volume-icon">{volumePercent === 0 ? "🔇" : volumePercent < 50 ? "🔉" : "🔊"}</span>
          <input
            type="range"
            className="volume-bar"
            min="0"
            max="100"
            step="1"
            value={volumePercent}
            onChange={(e) => setVolumePercent(parseFloat(e.target.value))}
            style={{ "--range-progress": `${volumePercent}%` }}
          />
          <span className="volume-percent">
            <input
              type="text"
              className="volume-percent-input"
              value={volumeInput !== null ? volumeInput : Math.round(volumePercent)}
              onChange={(e) => setVolumeInput(e.target.value.replace(/[^0-9]/g, ""))}
              onFocus={() => setVolumeInput(String(Math.round(volumePercent)))}
              onBlur={commitVolumeInput}
              onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
            />%
          </span>
        </div>

        <div className="bar-divider"></div>

        <button className={"loop-btn" + (shuffle ? " active" : "")} onClick={() => setShuffle(!shuffle)}>
          Shuffle {shuffle ? "On" : "Off"}
        </button>
        <button className={"loop-btn" + (loopTrack ? " active" : "")} onClick={() => setLoopTrack(!loopTrack)}>
          Loop {loopTrack ? "On" : "Off"}
        </button>
      </div>

      {showEditModal && editTarget && (
        <div className="modal-backdrop" onClick={() => setShowEditModal(false)}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>Edit {editTarget.type}</h3>
              <button className="modal-close" onClick={() => setShowEditModal(false)}>✕</button>
            </div>

            <input
              type="text"
              className="search-input"
              style={{marginBottom: 8}}
              placeholder="Name"
              value={editForm.name}
              onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
            />

            {editTarget.type === "soundtrack" && (
              <React.Fragment>
                <input
                  type="text"
                  className="search-input"
                  style={{marginBottom: 8}}
                  placeholder="Artist"
                  value={editForm.artist}
                  onChange={(e) => setEditForm({ ...editForm, artist: e.target.value })}
                />
                <input
                  type="text"
                  className="search-input"
                  style={{marginBottom: 8}}
                  placeholder="Year"
                  value={editForm.year}
                  onChange={(e) => setEditForm({ ...editForm, year: e.target.value })}
                />
              </React.Fragment>
            )}

            <textarea
              className="search-input"
              style={{marginBottom: 10, minHeight: 70, resize: "vertical", fontFamily: "inherit"}}
              placeholder="Description"
              value={editForm.description}
              onChange={(e) => setEditForm({ ...editForm, description: e.target.value })}
            ></textarea>

            <div style={{marginBottom: 12}}>
              <label style={{fontSize: 12, color: "var(--text-dim)", display: "block", marginBottom: 4}}>Cover image</label>
              <input type="file" accept="image/*" onChange={(e) => setEditCoverFile(e.target.files[0])} />
            </div>

            <button
              onClick={handleSaveEdit}
              disabled={savingEdit}
              style={{width: "100%", background: "var(--accent)", border: "none", color: "#000", padding: 8, borderRadius: 6, fontWeight: 600, cursor: "pointer"}}
            >
              {savingEdit ? "Saving..." : "Save"}
            </button>
          </div>
        </div>
      )}

      {contextMenu && (
        <div className="context-menu" style={{top: contextMenu.y, left: contextMenu.x}} onClick={(e) => e.stopPropagation()}>
          {playlistPickerFor ? (
            <React.Fragment>
              <div className="context-item" onClick={() => { handleCreatePlaylistAndAdd(playlistPickerFor.id, playlistPickerFor.key); setContextMenu(null); setPlaylistPickerFor(null); }}>
                + New playlist...
              </div>
              {Object.values(library.playlists).map((pl) => (
                <div
                  key={pl.id}
                  className="context-item"
                  onClick={() => { handleAddToPlaylist(pl.id, playlistPickerFor.id, playlistPickerFor.key); setContextMenu(null); setPlaylistPickerFor(null); }}
                >
                  {pl.name}
                </div>
              ))}
            </React.Fragment>
          ) : (
            <React.Fragment>
              {contextMenu.target.type === "empty" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => handleCreateFolder(null)}>New folder</div>
                  <div className="context-item" onClick={() => handleCreatePlaylist(null)}>New playlist</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "folder" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => { setShowAddForm(true); setNewParentId(contextMenu.target.id); }}>
                    Add soundtrack here
                  </div>
                  <div className="context-item" onClick={() => handleCreatePlaylist(contextMenu.target.id)}>New playlist here</div>
                  <div className="context-item" onClick={() => handleCreateFolder(contextMenu.target.id)}>New subfolder here</div>
                  <div className="context-item" onClick={() => handleRenameFolder(contextMenu.target.id)}>Rename</div>
                  {library.folders[contextMenu.target.id] && library.folders[contextMenu.target.id].parentId && (
                    <div className="context-item" onClick={() => moveItem("folder", contextMenu.target.id, null)}>Move to top level</div>
                  )}
                  <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete folder</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "soundtrack" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => togglePin(contextMenu.target.id)}>
                    {pinnedIds.includes(contextMenu.target.id) ? "Unpin" : "Pin"}
                  </div>
                  <div className="context-item" onClick={() => handleRenameSoundtrack(contextMenu.target.id)}>Rename</div>
                  {library.soundtracks[contextMenu.target.id] && library.soundtracks[contextMenu.target.id].parentId && (
                    <div className="context-item" onClick={() => moveItem("soundtrack", contextMenu.target.id, null)}>Move to top level</div>
                  )}
                  <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "playlist" && (
                <React.Fragment>
                  <div className="context-item" onClick={() => togglePin(contextMenu.target.id)}>
                    {pinnedIds.includes(contextMenu.target.id) ? "Unpin" : "Pin"}
                  </div>
                  <div className="context-item" onClick={() => handleRenamePlaylist(contextMenu.target.id)}>Rename</div>
                  {library.playlists[contextMenu.target.id] && library.playlists[contextMenu.target.id].parentId && (
                    <div className="context-item" onClick={() => moveItem("playlist", contextMenu.target.id, null)}>Move to top level</div>
                  )}
                  <div className="context-item danger" onClick={() => handleDelete(contextMenu.target)}>Delete playlist</div>
                </React.Fragment>
              )}
              {contextMenu.target.type === "track" && (
                contextMenu.target.playlistId ? (
                  <div
                    className="context-item danger"
                    onClick={() => handleRemoveFromPlaylist(contextMenu.target.playlistId, contextMenu.target.id, contextMenu.target.key)}
                  >
                    Remove from playlist
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="context-item" onClick={() => handleRenameTrack(contextMenu.target.id, contextMenu.target.key)}>Rename</div>
                    <div className="context-item" onClick={() => setPlaylistPickerFor({ id: contextMenu.target.id, key: contextMenu.target.key })}>
                      Add to playlist...
                    </div>
                    <div className="context-item danger" onClick={() => handleDeleteTrack(contextMenu.target.id, contextMenu.target.key)}>Delete</div>
                  </React.Fragment>
                )
              )}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}
